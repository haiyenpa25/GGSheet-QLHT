<script>
  // =========================================================================
  // GLOBAL STATE & RUNNER
  // =========================================================================
  var state = {
    kpis: { total_churches: 0, total_ministries: 0, connected_sheets: 0, pending_sheets: 0 },
    churches: [],
    ministries: [],
    driveFolder: { id: '', name: 'HOI THANH', url: '' },
    masterSpreadsheet: { id: '', name: 'QLHT', url: '' },
    banNganhWebAppUrl: 'https://script.google.com/macros/s/AKfycbznG9ns1n1hqGj6gwqeuOZWZebA1tDOdpt07858Y_BKdjfVsyKMXkutud1beTtwgEZWjA/exec',
    currentView: 'dashboard',
    searchChurch: '',
    searchMin: '',
    filterMinChurch: 'all',
    filterMinType: 'all',
    activeModal: null
  };

  // =========================================================================
  // HIGH-PERFORMANCE IN-MEMORY STATE HELPERS
  // =========================================================================
  function upsertById(collection, record) {
    if (!collection || !record) return;
    const recId = String(record.id || record.ID || '');
    const index = collection.findIndex(item => String(item.id || item.ID || '') === recId);
    if (index === -1) {
      collection.unshift(record);
    } else {
      collection[index] = { ...collection[index], ...record };
    }
  }

  function removeById(collection, id) {
    if (!collection || id === undefined || id === null) return;
    const targetId = String(id);
    const index = collection.findIndex(item => String(item.id || item.ID || '') === targetId);
    if (index !== -1) {
      collection.splice(index, 1);
    }
  }

  function runGAS(functionName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        console.warn('Google Script Environment Unavailable. Mocking result.');
        resolve({ success: false, message: 'Google Script Environment Unavailable' });
        return;
      }

      var runner = google.script.run
        .withSuccessHandler(function(res) {
          console.log('GAS Success [' + functionName + ']:', res);
          resolve(res);
        })
        .withFailureHandler(function(err) {
          console.error('GAS Error [' + functionName + ']:', err);
          showToast('Lỗi máy chủ: ' + (err.message || err), 'error');
          resolve({ success: false, message: err.message || String(err) });
        });

      runner[functionName].apply(runner, args);
    });
  }

  // =========================================================================
  // APP INITIALIZATION & NAVIGATION
  // =========================================================================

  async function initApp() {
    showLoading(true);
    try {
      const res = await runGAS('apiGetInitialData');
      if (res && res.success && res.data) {
        state.kpis = res.data.kpis || state.kpis;
        state.churches = res.data.churches || [];
        state.ministries = res.data.ministries || [];
        state.driveFolder = res.data.driveFolder || state.driveFolder;
        state.masterSpreadsheet = res.data.masterSpreadsheet || state.masterSpreadsheet;
        state.banNganhWebAppUrl = res.data.banNganhWebAppUrl || state.banNganhWebAppUrl;
        renderAll();
      } else {
        showToast('Không thể tải dữ liệu: ' + (res.message || 'Lỗi không xác định'), 'error');
      }
    } catch (e) {
      console.error('initApp Error:', e);
      showToast('Lỗi khởi động: ' + e.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function navigateTo(viewName, params = {}) {
    state.currentView = viewName;
    document.querySelectorAll('.app-view').forEach(el => el.classList.add('hidden'));

    const target = document.getElementById('view-' + viewName);
    if (target) {
      target.classList.remove('hidden');
      target.classList.add('animate-fade-in');
    }

    document.querySelectorAll('.nav-link-btn').forEach(btn => {
      if (btn.getAttribute('data-page') === viewName) {
        btn.className = 'nav-link-btn px-4 py-2 rounded-full text-xs font-bold bg-primary-container/20 text-primary border border-primary-container/40 transition-all';
      } else {
        btn.className = 'nav-link-btn px-4 py-2 rounded-full text-xs font-semibold text-text-secondary hover:text-white hover:bg-white/5 transition-all border border-transparent';
      }
    });

    document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
      const isCurrent = btn.getAttribute('data-page') === viewName;
      btn.className = isCurrent 
        ? 'bottom-nav-btn flex flex-col items-center justify-center text-primary drop-shadow-[0_0_8px_rgba(255,181,152,0.5)] active:scale-90 transition-transform'
        : 'bottom-nav-btn flex flex-col items-center justify-center text-text-secondary hover:text-white active:scale-90 transition-transform';
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (viewName === 'ministries' && params.hoiThanhId) {
      state.filterMinChurch = params.hoiThanhId;
      const fChurch = document.getElementById('min-filter-church');
      if (fChurch) fChurch.value = params.hoiThanhId;
      renderMinistries();
    }
  }

  function renderAll() {
    renderDashboard();
    renderChurches();
    renderMinistries();
    renderSettings();
  }

  // =========================================================================
  // DASHBOARD VIEW
  // =========================================================================

  function renderDashboard() {
    document.getElementById('dash-kpi-churches').textContent = state.churches.length;
    document.getElementById('dash-kpi-ministries').textContent = state.ministries.length;
    const connCount = state.ministries.filter(m => !!m.spreadsheetId).length;
    document.getElementById('dash-kpi-connected').textContent = connCount;
    document.getElementById('dash-kpi-pending').textContent = state.ministries.length - connCount;

    if (state.driveFolder.name) {
      document.getElementById('dash-drive-name').textContent = state.driveFolder.name;
    }
    if (state.driveFolder.url) {
      document.getElementById('dash-drive-link').href = state.driveFolder.url;
    }

    if (state.masterSpreadsheet.name) {
      document.getElementById('dash-master-name').textContent = state.masterSpreadsheet.name;
    }
    if (state.masterSpreadsheet.url) {
      document.getElementById('dash-master-link').href = state.masterSpreadsheet.url;
    }

    // Recent Churches
    const churchesEl = document.getElementById('dash-recent-churches');
    if (state.churches.length > 0) {
      churchesEl.innerHTML = state.churches.slice(0, 5).map(c => `
        <div onclick="navigateTo('ministries', { hoiThanhId: '${c.id}' })" class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 hover:border-primary/30 flex items-center justify-between cursor-pointer transition-all">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-primary-container/15 text-primary flex items-center justify-center font-bold text-xs">
              <span class="material-symbols-outlined text-base">church</span>
            </div>
            <div>
              <h4 class="text-xs font-bold text-white">${c.tenHT}</h4>
              <p class="text-[11px] text-text-secondary">${c.mucSu || c.tinhThanh || 'Chưa cập nhật'}</p>
            </div>
          </div>
          <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-primary-container/20 text-primary border border-primary-container/30">
            ${c.soLuongBanNganh || 0} ban ngành
          </span>
        </div>
      `).join('');
    } else {
      churchesEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có Hội Thánh nào</div>`;
    }

    // Recent Ministries
    const minEl = document.getElementById('dash-recent-ministries');
    if (state.ministries.length > 0) {
      minEl.innerHTML = state.ministries.slice(0, 6).map(m => {
        const hasSheet = !!m.spreadsheetId;
        const webUrl = getMinistryWebAppUrl(m);

        return `
          <div class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 hover:border-secondary/30 flex items-center justify-between gap-3 transition-all">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-9 h-9 rounded-xl bg-secondary-container/15 text-secondary flex items-center justify-center font-bold text-xs shrink-0">
                <span class="material-symbols-outlined text-base">groups</span>
              </div>
              <div class="min-w-0">
                <h4 class="text-xs font-bold text-white truncate">${m.tenBN}</h4>
                <p class="text-[11px] text-text-secondary truncate">${m.tenHoiThanh || ''}</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${hasSheet ? `
                <a href="${m.spreadsheetUrl || ('https://docs.google.com/spreadsheets/d/' + m.spreadsheetId + '/edit')}" target="_blank" class="p-2 rounded-xl bg-white/5 hover:bg-emerald-500/20 text-emerald-400 transition-colors" title="Mở Google Sheet">
                  <span class="material-symbols-outlined text-[17px]">table_chart</span>
                </a>
                ${webUrl ? `
                  <a href="${webUrl}" target="_blank" class="px-2.5 py-1.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-[11px] font-bold flex items-center gap-1 shadow-md transition-all">
                    <span>Mở App</span>
                    <span class="material-symbols-outlined text-xs">rocket_launch</span>
                  </a>
                ` : ''}
              ` : `
                <span class="text-[10px] text-warning-amber font-semibold bg-amber-500/10 px-2 py-0.5 rounded-full">Chưa có Sheet</span>
              `}
            </div>
          </div>
        `;
      }).join('');
    } else {
      minEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có Ban Ngành nào</div>`;
    }
  }

  function getMinistryWebAppUrl(m) {
    if (m.webAppUrl) return m.webAppUrl;
    if (state.banNganhWebAppUrl && m.spreadsheetId) {
      return `${state.banNganhWebAppUrl}?sheetId=${encodeURIComponent(m.spreadsheetId)}&banNganhId=${encodeURIComponent(m.id)}&title=${encodeURIComponent(m.tenBN)}`;
    }
    return '';
  }

  // =========================================================================
  // CHURCHES VIEW
  // =========================================================================

  function renderChurches() {
    let list = state.churches || [];
    if (state.searchChurch) {
      const q = state.searchChurch.toLowerCase();
      list = list.filter(c => 
        (c.tenHT || '').toLowerCase().includes(q) ||
        (c.maHT || '').toLowerCase().includes(q) ||
        (c.mucSu || '').toLowerCase().includes(q) ||
        (c.tinhThanh || '').toLowerCase().includes(q)
      );
    }

    const badge = document.getElementById('churches-count-badge');
    if (badge) badge.textContent = `Tổng cộng: ${list.length} Hội Thánh`;

    const container = document.getElementById('churches-grid-container');
    if (!container) return;

    if (list.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 glass-card rounded-3xl p-12 text-center text-xs text-text-secondary space-y-3">
          <span class="material-symbols-outlined text-4xl text-primary/60">church</span>
          <p class="font-medium text-sm text-white">Chưa có Hội Thánh nào</p>
          <p>Bấm nút <strong>"+ Thêm Hội Thánh Mới"</strong> để bắt đầu tạo Hội Thánh.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = list.map(c => `
      <div class="glass-card rounded-3xl p-5 border border-white/10 hover:border-primary/40 flex flex-col justify-between shadow-lg transition-all duration-200 group">
        <div>
          <div class="flex justify-between items-start gap-2 mb-3">
            <div class="w-11 h-11 rounded-2xl bg-primary-container/20 border border-primary-container/30 text-primary flex items-center justify-center font-bold shrink-0">
              <span class="material-symbols-outlined text-2xl">church</span>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="openEditChurchModal('${c.id}')" class="p-2 text-text-secondary hover:text-white rounded-full hover:bg-white/5 transition-colors" title="Sửa"><span class="material-symbols-outlined text-[18px]">edit</span></button>
              <button onclick="deleteChurch('${c.id}')" class="p-2 text-text-secondary hover:text-rose-400 rounded-full hover:bg-white/5 transition-colors" title="Xóa"><span class="material-symbols-outlined text-[18px]">delete</span></button>
            </div>
          </div>

          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-white/5 text-primary border border-white/10 inline-block mb-1">${c.maHT || 'HT_CODE'}</span>
          <h3 class="text-base font-bold text-white leading-snug group-hover:text-primary transition-colors">${c.tenHT}</h3>
          <p class="text-xs text-text-secondary mt-1 flex items-center gap-1">
            <span class="material-symbols-outlined text-[14px]">person</span>
            <span>${c.mucSu || 'Chưa có Quản nhiệm'}</span>
          </p>

          <div class="mt-4 pt-3 border-t border-white/5 space-y-1.5 text-[11px] text-text-secondary">
            ${c.diaChi ? `<div class="flex items-center gap-1.5 truncate"><span class="material-symbols-outlined text-[14px]">location_on</span><span>${c.diaChi}, ${c.tinhThanh || ''}</span></div>` : ''}
            ${c.sdt ? `<div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[14px]">call</span><span>${c.sdt}</span></div>` : ''}
          </div>
        </div>

        <div class="mt-5 pt-3 border-t border-white/10 flex justify-between items-center">
          <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-secondary-container/20 text-secondary border border-secondary-container/30">
            ${c.soLuongBanNganh || 0} ban ngành
          </span>
          <button onclick="navigateTo('ministries', { hoiThanhId: '${c.id}' })" class="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-primary text-xs font-semibold flex items-center gap-1 transition-all">
            <span>Xem ban ngành</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </div>
      </div>
    `).join('');
  }

  function openAddChurchModal() {
    document.getElementById('form-church').reset();
    document.getElementById('church-id').value = '';
    document.getElementById('modal-church-title').innerHTML = `<span class="material-symbols-outlined text-primary">add_home</span> Thêm Hội Thánh Mới`;
    openModal('modal-church');
  }

  function openEditChurchModal(id) {
    const c = state.churches.find(item => String(item.id) === String(id));
    if (!c) return;

    document.getElementById('church-id').value = c.id;
    document.getElementById('church-ten').value = c.tenHT || '';
    document.getElementById('church-ma').value = c.maHT || '';
    document.getElementById('church-mucsu').value = c.mucSu || '';
    document.getElementById('church-diachi').value = c.diaChi || '';
    document.getElementById('church-quanhuyen').value = c.quanHuyen || '';
    document.getElementById('church-tinhthanh').value = c.tinhThanh || '';
    document.getElementById('church-sdt').value = c.sdt || '';
    document.getElementById('church-email').value = c.email || '';
    document.getElementById('church-ngaythanhlap').value = c.ngayThanhLap || '';
    document.getElementById('church-trangthai').value = c.trangThai || 'active';
    document.getElementById('church-ghichu').value = c.ghiChu || '';

    document.getElementById('modal-church-title').innerHTML = `<span class="material-symbols-outlined text-primary">edit</span> Cập Nhật Hội Thánh`;
    openModal('modal-church');
  }

  async function handleSaveChurch(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('church-id').value || null,
      tenHT: document.getElementById('church-ten').value.trim(),
      maHT: document.getElementById('church-ma').value.trim(),
      mucSu: document.getElementById('church-mucsu').value.trim(),
      diaChi: document.getElementById('church-diachi').value.trim(),
      quanHuyen: document.getElementById('church-quanhuyen').value.trim(),
      tinhThanh: document.getElementById('church-tinhthanh').value.trim(),
      sdt: document.getElementById('church-sdt').value.trim(),
      email: document.getElementById('church-email').value.trim(),
      ngayThanhLap: document.getElementById('church-ngaythanhlap').value.trim(),
      trangThai: document.getElementById('church-trangthai').value,
      ghiChu: document.getElementById('church-ghichu').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiSaveChurch', payload);
      if (res && res.success) {
        showToast(res.message || 'Lưu Hội Thánh thành công!', 'success');
        closeModal('modal-church');
        const saved = (res.data && res.data.id) ? res.data : { ...payload, id: (res.data && res.data.id) || payload.id || ('HT_' + Date.now()) };
        upsertById(state.churches, saved);
        state.kpis.total_churches = state.churches.length;
        renderChurches();
        renderDashboard();
      } else {
        showToast(res.message || 'Lỗi khi lưu Hội Thánh', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function deleteChurch(id) {
    if (!confirm('Bạn có chắc muốn xóa Hội Thánh này?')) return;
    showLoading(true);
    try {
      const res = await runGAS('apiDeleteChurch', id);
      if (res && res.success) {
        showToast('Đã xóa Hội Thánh!', 'info');
        removeById(state.churches, id);
        state.kpis.total_churches = state.churches.length;
        renderChurches();
        renderDashboard();
      } else {
        showToast(res.message || 'Không thể xóa', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  // =========================================================================
  // MINISTRIES VIEW
  // =========================================================================

  function renderMinistries() {
    const fChurch = document.getElementById('min-filter-church');
    const mChurch = document.getElementById('min-hoithanh-id');
    const opts = (state.churches || []).map(c => `<option value="${c.id}">${c.tenHT}</option>`).join('');

    if (fChurch) fChurch.innerHTML = `<option value="all">Tất cả Hội Thánh</option>` + opts;
    if (mChurch) mChurch.innerHTML = opts || `<option value="">Chưa có Hội Thánh nào</option>`;

    if (fChurch && state.filterMinChurch) fChurch.value = state.filterMinChurch;

    let list = state.ministries || [];
    if (state.filterMinChurch !== 'all') {
      list = list.filter(m => String(m.hoiThanhId) === String(state.filterMinChurch));
    }
    if (state.filterMinType !== 'all') {
      list = list.filter(m => m.loaiBN === state.filterMinType);
    }
    if (state.searchMin) {
      const q = state.searchMin.toLowerCase();
      list = list.filter(m => 
        (m.tenBN || '').toLowerCase().includes(q) ||
        (m.maBN || '').toLowerCase().includes(q) ||
        (m.truongBan || '').toLowerCase().includes(q) ||
        (m.tenHoiThanh || '').toLowerCase().includes(q)
      );
    }

    const badge = document.getElementById('min-count-badge');
    if (badge) badge.textContent = `Tổng cộng: ${list.length} Ban Ngành`;

    const container = document.getElementById('ministries-grid-container');
    if (!container) return;

    if (list.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 glass-card rounded-3xl p-12 text-center text-xs text-text-secondary space-y-3">
          <span class="material-symbols-outlined text-4xl text-secondary/60">groups</span>
          <p class="font-medium text-sm text-white">Không tìm thấy Ban Ngành nào</p>
          <p>Bấm nút <strong>"+ Thêm Ban Ngành Mới"</strong> để tạo ban ngành.</p>
        </div>
      `;
      return;
    }

    const typeIcons = {
      THANH_TRANG: { icon: 'diversity_3', color: 'text-primary' },
      THANH_NIEN: { icon: 'local_fire_department', color: 'text-sky-400' },
      THIEU_NHI: { icon: 'child_care', color: 'text-pink-400' },
      PHU_NU: { icon: 'favorite', color: 'text-pink-500' },
      NAM_GIOI: { icon: 'shield', color: 'text-emerald-400' },
      LAO_NIEN: { icon: 'elderly', color: 'text-amber-400' }
    };

    container.innerHTML = list.map(m => {
      const hasSheet = !!m.spreadsheetId;
      const webUrl = getMinistryWebAppUrl(m);
      const tInfo = typeIcons[m.loaiBN] || { icon: 'groups', color: 'text-primary' };

      return `
        <div class="glass-card rounded-3xl p-5 border border-white/10 hover:border-secondary/40 flex flex-col justify-between shadow-lg transition-all duration-200 group">
          <div>
            <div class="flex justify-between items-start gap-2 mb-3">
              <div class="flex items-center gap-2 min-w-0">
                <div class="w-10 h-10 rounded-2xl bg-surface-elevated border border-white/10 ${tInfo.color} flex items-center justify-center font-bold shrink-0">
                  <span class="material-symbols-outlined text-xl">${tInfo.icon}</span>
                </div>
                <div class="min-w-0">
                  <span class="text-[10px] font-semibold text-primary block truncate">${m.tenHoiThanh || ''}</span>
                  <h3 class="text-sm font-bold text-white group-hover:text-secondary transition-colors truncate">${m.tenBN}</h3>
                </div>
              </div>
              
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="openEditMinistryModal('${m.id}')" class="p-1.5 text-text-secondary hover:text-white rounded-full hover:bg-white/5 transition-colors" title="Sửa"><span class="material-symbols-outlined text-[16px]">edit</span></button>
                <button onclick="deleteMinistry('${m.id}')" class="p-1.5 text-text-secondary hover:text-rose-400 rounded-full hover:bg-white/5 transition-colors" title="Xóa"><span class="material-symbols-outlined text-[16px]">delete</span></button>
              </div>
            </div>

            <div class="space-y-1 text-[11px] text-text-secondary pt-1">
              ${m.truongBan ? `<div><span class="text-text-secondary/70">Trưởng ban:</span> <span class="text-white font-medium">${m.truongBan}</span></div>` : ''}
              ${m.thuky ? `<div><span class="text-text-secondary/70">Thư ký:</span> <span class="text-white font-medium">${m.thuky}</span></div>` : ''}
              ${m.sdtLienHe ? `<div><span class="text-text-secondary/70">SĐT:</span> <span class="text-white font-mono">${m.sdtLienHe}</span></div>` : ''}
            </div>

            <!-- GSheet Info Card -->
            <div class="mt-4 p-3 rounded-2xl ${hasSheet ? 'bg-emerald-950/20 border border-emerald-500/20' : 'bg-amber-950/20 border border-warning-amber/20'} flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <span class="material-symbols-outlined text-base ${hasSheet ? 'text-emerald-400' : 'text-warning-amber'} shrink-0">${hasSheet ? 'table_chart' : 'warning'}</span>
                <span class="text-[11px] font-semibold ${hasSheet ? 'text-emerald-400' : 'text-warning-amber'} truncate">${hasSheet ? 'Đã tạo Google Sheet' : 'Chưa có Google Sheet'}</span>
              </div>
              ${hasSheet ? `<a href="${m.spreadsheetUrl || ('https://docs.google.com/spreadsheets/d/' + m.spreadsheetId + '/edit')}" target="_blank" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-300 text-[10px] font-bold flex items-center gap-1 transition-colors shrink-0"><span>Mở Sheet</span><span class="material-symbols-outlined text-xs">open_in_new</span></a>` : ''}
            </div>
          </div>

          <!-- Bottom Action Buttons -->
          <div class="mt-5 pt-3 border-t border-white/10 flex flex-col gap-2">
            ${hasSheet ? `
              <div class="flex items-center justify-between gap-2">
                <button onclick="openLinkSheetModal('${m.id}')" class="text-[11px] text-text-secondary hover:text-white flex items-center gap-1"><span class="material-symbols-outlined text-xs">edit</span> Đổi Sheet ID</button>
                
                ${webUrl ? `
                  <a href="${webUrl}" target="_blank" class="flex-1 py-2 px-3 rounded-xl bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-lg active:scale-95 transition-all">
                    <span class="material-symbols-outlined text-[16px]">rocket_launch</span>
                    <span>Mở Web App Ban Ngành</span>
                  </a>
                ` : `
                  <button onclick="navigateTo('settings')" class="flex-1 py-2 px-3 rounded-xl bg-surface-elevated hover:bg-white/10 text-pink-300 text-[11px] font-bold flex items-center justify-center gap-1 border border-pink-500/30">
                    <span class="material-symbols-outlined text-xs">settings</span>
                    <span>Cấu hình Web App URL</span>
                  </button>
                `}
              </div>
            ` : `
              <div class="flex items-center gap-2 w-full justify-between">
                <button onclick="autoCreateMinistrySheet('${m.id}')" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-md active:scale-95 transition-all">
                  <span class="material-symbols-outlined text-[16px]">add_circle</span>
                  <span>Tạo Sheet Tự Động</span>
                </button>
                <button onclick="openLinkSheetModal('${m.id}')" class="py-2.5 px-3 rounded-xl glass-card hover:bg-white/10 text-white text-xs font-semibold flex items-center gap-1 transition-all" title="Gán ID có sẵn">
                  <span class="material-symbols-outlined text-[16px]">link</span>
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }).join('');
  }

  function openAddMinistryModal() {
    document.getElementById('form-ministry').reset();
    document.getElementById('min-id').value = '';
    document.getElementById('modal-min-title').innerHTML = `<span class="material-symbols-outlined text-secondary">groups</span> Thêm Ban Ngành Mới`;
    openModal('modal-ministry');
  }

  function openEditMinistryModal(id) {
    const m = state.ministries.find(item => String(item.id) === String(id));
    if (!m) return;

    document.getElementById('min-id').value = m.id;
    document.getElementById('min-hoithanh-id').value = m.hoiThanhId || '';
    document.getElementById('min-ten').value = m.tenBN || '';
    document.getElementById('min-loai').value = m.loaiBN || 'THANH_TRANG';
    document.getElementById('min-truongban').value = m.truongBan || '';
    document.getElementById('min-thuky').value = m.thuky || '';
    document.getElementById('min-sdt').value = m.sdtLienHe || '';
    document.getElementById('min-ghichu').value = m.ghiChu || '';

    document.getElementById('modal-min-title').innerHTML = `<span class="material-symbols-outlined text-secondary">edit</span> Cập Nhật Ban Ngành`;
    openModal('modal-ministry');
  }

  async function handleSaveMinistry(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('min-id').value || null,
      hoiThanhId: document.getElementById('min-hoithanh-id').value,
      tenBN: document.getElementById('min-ten').value.trim(),
      loaiBN: document.getElementById('min-loai').value,
      truongBan: document.getElementById('min-truongban').value.trim(),
      thuky: document.getElementById('min-thuky').value.trim(),
      sdtLienHe: document.getElementById('min-sdt').value.trim(),
      ghiChu: document.getElementById('min-ghichu').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiSaveMinistry', payload);
      if (res && res.success) {
        showToast(res.message || 'Lưu Ban Ngành thành công!', 'success');
        closeModal('modal-ministry');
        const church = (state.churches || []).find(c => String(c.id) === String(payload.hoiThanhId));
        const saved = (res.data && res.data.id) ? res.data : { ...payload, id: (res.data && res.data.id) || payload.id || ('BN_' + Date.now()), tenHoiThanh: church ? church.tenHT : '' };
        upsertById(state.ministries, saved);
        state.kpis.total_ministries = state.ministries.length;
        renderMinistries();
        renderDashboard();
      } else {
        showToast(res.message || 'Lỗi lưu Ban Ngành', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function deleteMinistry(id) {
    if (!confirm('Bạn có chắc muốn xóa Ban Ngành này?')) return;
    showLoading(true);
    try {
      const res = await runGAS('apiDeleteMinistry', id);
      if (res && res.success) {
        showToast('Đã xóa Ban Ngành', 'info');
        removeById(state.ministries, id);
        state.kpis.total_ministries = state.ministries.length;
        renderMinistries();
        renderDashboard();
      } else {
        showToast(res.message || 'Không thể xóa', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function autoCreateMinistrySheet(id) {
    const m = state.ministries.find(item => String(item.id) === String(id));
    if (!m) return;

    if (!confirm(`Hệ thống sẽ tự động tạo file Google Sheet mới cho "${m.tenBN}" trên Google Drive và nạp sẵn 10 bảng dữ liệu chuẩn. Tiếp tục?`)) return;

    showLoading(true);
    try {
      const res = await runGAS('apiCreateMinistrySheet', id);
      if (res && res.success) {
        showToast(res.message || 'Tạo Sheet thành công!', 'success');
        if (res.data && res.data.sheetId) {
          m.spreadsheetId = res.data.sheetId;
          m.spreadsheetUrl = res.data.url;
          m.webAppUrl = res.data.webAppUrl;
          renderMinistries();
          renderDashboard();
        } else {
          await initApp();
        }
        if (res.data && res.data.webAppUrl) {
          if (confirm(`Đã tạo Sheet và tạo Link Web App cho "${m.tenBN}". Bạn có muốn mở Web App của ban ngành ngay không?`)) {
            window.open(res.data.webAppUrl, '_blank');
          }
        } else if (res.data && res.data.url) {
          window.open(res.data.url, '_blank');
        }
      } else {
        showToast(res.message || 'Lỗi tạo Sheet', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function openLinkSheetModal(id) {
    const m = state.ministries.find(item => String(item.id) === String(id));
    if (!m) return;

    document.getElementById('link-min-id').value = m.id;
    document.getElementById('link-min-name').textContent = `${m.tenBN} (${m.tenHoiThanh || ''})`;
    document.getElementById('link-sheet-id').value = m.spreadsheetId || '';
    openModal('modal-link-sheet');
  }

  async function handleSaveLinkedSheet(e) {
    e.preventDefault();
    const banNganhId = document.getElementById('link-min-id').value;
    const rawSheet = document.getElementById('link-sheet-id').value.trim();
    if (!rawSheet) return;

    showLoading(true);
    try {
      const res = await runGAS('apiLinkMinistrySheet', banNganhId, rawSheet);
      if (res && res.success) {
        showToast(res.message || 'Gán Sheet thành công!', 'success');
        closeModal('modal-link-sheet');
        const m = (state.ministries || []).find(item => String(item.id) === String(banNganhId));
        if (m) {
          m.spreadsheetId = res.data && res.data.sheetId ? res.data.sheetId : rawSheet;
          m.spreadsheetUrl = res.data && res.data.spreadsheetUrl ? res.data.spreadsheetUrl : `https://docs.google.com/spreadsheets/d/${m.spreadsheetId}/edit`;
          m.webAppUrl = res.data && res.data.webAppUrl ? res.data.webAppUrl : '';
          renderMinistries();
          renderDashboard();
        } else {
          await initApp();
        }
      } else {
        showToast(res.message || 'Lỗi gán Sheet', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  // =========================================================================
  // SETTINGS VIEW
  // =========================================================================

  function renderSettings() {
    const driveInput = document.getElementById('cfg-drive-folder-id');
    const driveStatus = document.getElementById('cfg-drive-status-name');
    const driveLink = document.getElementById('cfg-drive-status-link');

    if (state.driveFolder.id && driveInput) driveInput.value = state.driveFolder.id;
    if (driveStatus) driveStatus.textContent = 'Đã kết nối: ' + (state.driveFolder.name || 'HOI THANH');
    if (driveLink && state.driveFolder.url) driveLink.href = state.driveFolder.url;

    const masterInput = document.getElementById('cfg-master-sheet-id');
    const masterStatus = document.getElementById('cfg-master-status-name');
    const masterLink = document.getElementById('cfg-master-status-link');

    if (state.masterSpreadsheet.id && masterInput) masterInput.value = state.masterSpreadsheet.id;
    if (masterStatus) masterStatus.textContent = 'Đã kết nối: ' + (state.masterSpreadsheet.name || 'QLHT');
    if (masterLink && state.masterSpreadsheet.url) masterLink.href = state.masterSpreadsheet.url;

    const webAppInput = document.getElementById('cfg-bannganh-webapp-url');
    if (webAppInput && state.banNganhWebAppUrl) {
      webAppInput.value = state.banNganhWebAppUrl;
    }
  }

  async function handleSaveDriveFolder() {
    const folderId = document.getElementById('cfg-drive-folder-id').value.trim();
    if (!folderId) return;

    showLoading(true);
    try {
      const res = await runGAS('apiSaveSettings', folderId, null, null);
      if (res && res.success) {
        showToast('Lưu thư mục Google Drive thành công!', 'success');
        await initApp();
      } else {
        showToast(res.message || 'Lỗi lưu thư mục', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function handleSaveMasterSheet() {
    const sheetId = document.getElementById('cfg-master-sheet-id').value.trim();
    if (!sheetId) return;

    showLoading(true);
    try {
      const res = await runGAS('apiSaveSettings', null, sheetId, null);
      if (res && res.success) {
        showToast('Lưu kết nối Google Sheet Master thành công!', 'success');
        await initApp();
      } else {
        showToast(res.message || 'Lỗi lưu kết nối', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function handleSaveBanNganhWebAppUrl() {
    const webAppUrl = document.getElementById('cfg-bannganh-webapp-url').value.trim();

    showLoading(true);
    try {
      const res = await runGAS('apiSaveSettings', null, null, webAppUrl);
      if (res && res.success) {
        showToast('Đã lưu & đồng bộ đường dẫn Web App Ban Ngành thành công!', 'success');
        await initApp();
      } else {
        showToast(res.message || 'Lỗi lưu URL', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  // =========================================================================
  // MODAL & TOAST HELPERS
  // =========================================================================

  function openModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.remove('hidden');
      el.classList.add('flex');
      document.body.style.overflow = 'hidden';
      state.activeModal = modalId;
    }
  }

  function closeModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.add('hidden');
      el.classList.remove('flex');
      document.body.style.overflow = '';
      if (state.activeModal === modalId) state.activeModal = null;
    }
  }

  function closeAllModals() {
    document.querySelectorAll('.app-modal').forEach(m => {
      m.classList.add('hidden');
      m.classList.remove('flex');
    });
    document.body.style.overflow = '';
    state.activeModal = null;
  }

  function showLoading(show) {
    const loader = document.getElementById('global-loading-indicator');
    if (loader) {
      if (show) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  }

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const bgColors = {
      success: 'bg-emerald-600/90 border-emerald-400/50 text-white',
      error: 'bg-rose-600/90 border-rose-400/50 text-white',
      info: 'bg-surface-elevated/90 border-primary/40 text-on-surface',
      warning: 'bg-amber-600/90 border-amber-400/50 text-white'
    };
    const icons = {
      success: 'check_circle',
      error: 'error',
      info: 'info',
      warning: 'warning'
    };

    toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl transition-all duration-300 transform translate-y-4 opacity-0 ${bgColors[type] || bgColors.info}`;
    toast.innerHTML = `
      <span class="material-symbols-outlined text-[20px]">${icons[type] || 'info'}</span>
      <span class="font-medium text-sm">${message}</span>
    `;

    container.appendChild(toast);

    setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-x-full');
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }

  // =========================================================================
  // BOOTSTRAP RUNNER
  // =========================================================================

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAllModals();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
</script>
