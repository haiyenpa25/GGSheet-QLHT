<script>
  // =========================================================================
  // GLOBAL STATE & RUNNER
  // =========================================================================
  var state = {
    kpis: { total_churches: 0, total_ministries: 0, connected_sheets: 0, pending_sheets: 0 },
    churches: [],
    ministries: [],
    driveFolder: { id: '', name: 'HOI THANH', url: '' },
    masterSpreadsheet: { id: '', name: 'QLHT', url: '' },
    banNganhWebAppUrl: 'https://script.google.com/macros/s/AKfycbyzVgom-BMZOadYkoYOQRZ3W7lLZRRGc2ofU1rbqQWTxD7x-QD8UXDW33vuuNsJxViYvw/exec',
    currentView: 'dashboard',
    searchChurch: '',
    searchMin: '',
    filterMinChurch: 'all',
    filterMinType: 'all',
    activeModal: null
  };

  // =========================================================================
  // HIGH-PERFORMANCE IN-MEMORY STATE HELPERS
  // =========================================================================
  function upsertById(collection, record) {
    if (!collection || !record) return;
    const recId = String(record.id || record.ID || '');
    const index = collection.findIndex(item => String(item.id || item.ID || '') === recId);
    if (index === -1) {
      collection.unshift(record);
    } else {
      collection[index] = { ...collection[index], ...record };
    }
  }

  function removeById(collection, id) {
    if (!collection || id === undefined || id === null) return;
    const targetId = String(id);
    const index = collection.findIndex(item => String(item.id || item.ID || '') === targetId);
    if (index !== -1) {
      collection.splice(index, 1);
    }
  }

  function runGAS(functionName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        console.warn('Google Script Environment Unavailable. Mocking result.');
        resolve({ success: false, message: 'Google Script Environment Unavailable' });
        return;
      }

      var runner = google.script.run
        .withSuccessHandler(function(res) {
          console.log('GAS Success [' + functionName + ']:', res);
          resolve(res);
        })
        .withFailureHandler(function(err) {
          console.error('GAS Error [' + functionName + ']:', err);
          showToast('Lỗi máy chủ: ' + (err.message || err), 'error');
          resolve({ success: false, message: err.message || String(err) });
        });

      runner[functionName].apply(runner, args);
    });
  }

  const AUTH_SESSION_KEY = 'qlht_auth_session';

  // =========================================================================
  // AUTHENTICATION & SESSION MANAGEMENT WITH AUTH GATE
  // =========================================================================

  function loadAuthSession() {
    try {
      const raw = localStorage.getItem(AUTH_SESSION_KEY) || sessionStorage.getItem(AUTH_SESSION_KEY);
      if (raw) {
        const session = JSON.parse(raw);
        if (session && session.user) {
          state.currentUser = session.user;
          updateAuthUI();
          return session.user;
        }
      }
    } catch (e) {}
    state.currentUser = null;
    updateAuthUI();
    return null;
  }

  function saveAuthSession(user, token, remember = true) {
    const session = { user, token, timestamp: Date.now() };
    state.currentUser = user;
    if (remember) {
      localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(session));
    } else {
      sessionStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(session));
    }
    updateAuthUI();
  }

  function clearAuthSession() {
    state.currentUser = null;
    localStorage.removeItem(AUTH_SESSION_KEY);
    sessionStorage.removeItem(AUTH_SESSION_KEY);
    updateAuthUI();
  }

  function updateAuthUI() {
    const authGate = document.getElementById('auth-gate-screen-master');
    const appWrapper = document.getElementById('app-main-wrapper');
    const uHeader = document.getElementById('user-profile-header');
    const btnLogin = document.getElementById('btn-show-login');
    const uAvatar = document.getElementById('header-user-avatar');
    const uName = document.getElementById('header-user-name');
    const uRole = document.getElementById('header-user-role');
    const dropFullName = document.getElementById('dropdown-user-fullname');
    const dropEmail = document.getElementById('dropdown-user-email');
    const dropBadge = document.getElementById('dropdown-user-badge');

    if (state.currentUser) {
      if (authGate) authGate.classList.add('hidden');
      if (appWrapper) appWrapper.classList.remove('hidden');

      if (uHeader) uHeader.classList.remove('hidden'), uHeader.classList.add('flex');
      if (btnLogin) btnLogin.classList.add('hidden');

      const initial = (state.currentUser.fullName || state.currentUser.username || 'A')[0].toUpperCase();
      if (uAvatar) uAvatar.textContent = initial;
      if (uName) uName.textContent = state.currentUser.fullName || state.currentUser.username;
      const roleLabel = state.currentUser.role === 'SUPER_ADMIN' ? 'Super Admin' : 'Quản Nhiệm';
      if (uRole) uRole.textContent = roleLabel;
      if (dropFullName) dropFullName.textContent = state.currentUser.fullName || state.currentUser.username;
      if (dropEmail) dropEmail.textContent = state.currentUser.email || (state.currentUser.username + '@hoithanh.vn');
      if (dropBadge) dropBadge.textContent = roleLabel;
    } else {
      if (authGate) authGate.classList.remove('hidden');
      if (appWrapper) appWrapper.classList.add('hidden');

      if (uHeader) uHeader.classList.add('hidden'), uHeader.classList.remove('flex');
      if (btnLogin) btnLogin.classList.remove('hidden');
    }
  }

  function fillPresetAccountMaster(user, pass) {
    const uInput = document.getElementById('gate-login-username');
    const pInput = document.getElementById('gate-login-password');
    if (uInput) uInput.value = user;
    if (pInput) pInput.value = pass;
  }

  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    const icon = btn.querySelector('.material-symbols-outlined');
    if (icon) icon.textContent = isPass ? 'visibility_off' : 'visibility';
  }

  async function handleAuthGateLogin(e) {
    e.preventDefault();
    const uInput = document.getElementById('gate-login-username').value.trim();
    const pInput = document.getElementById('gate-login-password').value;
    const remember = document.getElementById('gate-login-remember').checked;

    if (!uInput || !pInput) return;

    const submitBtn = document.getElementById('btn-gate-login-submit');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-base">progress_activity</span><span>Đang xác thực...</span>`;
    }

    try {
      const res = await runGAS('apiLogin', { username: uInput, password: pInput });
      if (res && res.success && res.user) {
        saveAuthSession(res.user, res.token, remember);
        showToast(`Xin chào ${res.user.fullName || res.user.username}! Đăng nhập thành công.`, 'success');
        await initApp();
      } else {
        showToast((res && res.message) || 'Tên đăng nhập hoặc mật khẩu không chính xác!', 'error');
      }
    } catch (err) {
      showToast('Lỗi đăng nhập: ' + err.message, 'error');
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-base">login</span><span>Đăng Nhập Vào Hệ Thống</span>`;
      }
    }
  }

  function toggleUserDropdown() {
    const menu = document.getElementById('user-dropdown-menu');
    if (menu) menu.classList.toggle('hidden');
  }

  document.addEventListener('click', function(e) {
    const menu = document.getElementById('user-dropdown-menu');
    const uHeader = document.getElementById('user-profile-header');
    if (menu && !menu.classList.contains('hidden') && uHeader && !uHeader.contains(e.target)) {
      menu.classList.add('hidden');
    }
  });

  function openLoginModal() {
    openModal('modal-login');
  }

  async function handleLoginSubmit(e) {
    e.preventDefault();
    const uInput = document.getElementById('login-username').value.trim();
    const pInput = document.getElementById('login-password').value;
    const remember = document.getElementById('login-remember').checked;

    if (!uInput || !pInput) return;

    const submitBtn = document.getElementById('btn-login-submit');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-base">progress_activity</span><span>Đang xác thực...</span>`;
    }

    try {
      const res = await runGAS('apiLogin', { username: uInput, password: pInput });
      if (res && res.success && res.user) {
        saveAuthSession(res.user, res.token, remember);
        closeModal('modal-login');
        showToast(`Xin chào ${res.user.fullName || res.user.username}! Đăng nhập thành công.`, 'success');
        await initApp();
      } else {
        showToast((res && res.message) || 'Tên đăng nhập hoặc mật khẩu không chính xác!', 'error');
      }
    } catch (err) {
      showToast('Lỗi đăng nhập: ' + err.message, 'error');
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-base">login</span><span>Đăng Nhập Hệ Thống</span>`;
      }
    }
  }

  async function handleChangePasswordSubmit(e) {
    e.preventDefault();
    if (!state.currentUser) return;
    const oldPass = document.getElementById('chg-old-password').value;
    const newPass = document.getElementById('chg-new-password').value;
    const confirmPass = document.getElementById('chg-confirm-password').value;

    if (newPass !== confirmPass) {
      showToast('Mật khẩu mới và xác nhận mật khẩu không khớp!', 'error');
      return;
    }

    showLoading(true);
    try {
      const res = await runGAS('apiChangePassword', {
        userId: state.currentUser.id || state.currentUser.username,
        oldPassword: oldPass,
        newPassword: newPass
      });
      if (res && res.success) {
        showToast('Đổi mật khẩu thành công!', 'success');
        closeModal('modal-change-password');
        document.getElementById('form-change-password').reset();
      } else {
        showToast((res && res.message) || 'Đổi mật khẩu thất bại!', 'error');
      }
    } catch (err) {
      showToast('Lỗi: ' + err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function handleLogout() {
    const menu = document.getElementById('user-dropdown-menu');
    if (menu) menu.classList.add('hidden');
    clearAuthSession();
    showToast('Đã đăng xuất khỏi hệ thống!', 'info');
  }

  // =========================================================================
  // APP INITIALIZATION & NAVIGATION
  // =========================================================================

  async function initApp() {
    loadAuthSession();
    if (!state.currentUser) {
      return; // Dừng nạp dữ liệu cho đến khi đăng nhập
    }

    showLoading(true);
    try {
      const res = await runGAS('apiGetInitialData');
      if (res && res.success && res.data) {
        state.kpis = res.data.kpis || state.kpis;
        state.churches = res.data.churches || [];
        state.ministries = res.data.ministries || [];
        state.driveFolder = res.data.driveFolder || state.driveFolder;
        state.masterSpreadsheet = res.data.masterSpreadsheet || state.masterSpreadsheet;
        state.banNganhWebAppUrl = res.data.banNganhWebAppUrl || state.banNganhWebAppUrl;
        renderAll();
      } else {
        showToast('Không thể tải dữ liệu: ' + (res.message || 'Lỗi không xác định'), 'error');
      }
    } catch (e) {
      console.error('initApp Error:', e);
      showToast('Lỗi khởi động: ' + e.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function navigateTo(viewName, params = {}) {
    state.currentView = viewName;
    document.querySelectorAll('.app-view').forEach(el => el.classList.add('hidden'));

    const target = document.getElementById('view-' + viewName);
    if (target) {
      target.classList.remove('hidden');
      target.classList.add('animate-fade-in');
    }

    document.querySelectorAll('.nav-link-btn').forEach(btn => {
      if (btn.getAttribute('data-page') === viewName) {
        btn.className = 'nav-link-btn px-4 py-2 rounded-full text-xs font-bold bg-primary-container/20 text-primary border border-primary-container/40 transition-all';
      } else {
        btn.className = 'nav-link-btn px-4 py-2 rounded-full text-xs font-semibold text-text-secondary hover:text-white hover:bg-white/5 transition-all border border-transparent';
      }
    });

    document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
      const isCurrent = btn.getAttribute('data-page') === viewName;
      btn.className = isCurrent 
        ? 'bottom-nav-btn flex flex-col items-center justify-center text-primary drop-shadow-[0_0_8px_rgba(255,181,152,0.5)] active:scale-90 transition-transform'
        : 'bottom-nav-btn flex flex-col items-center justify-center text-text-secondary hover:text-white active:scale-90 transition-transform';
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (viewName === 'ministries' && params.hoiThanhId) {
      state.filterMinChurch = params.hoiThanhId;
      const fChurch = document.getElementById('min-filter-church');
      if (fChurch) fChurch.value = params.hoiThanhId;
      renderMinistries();
    }
  }

  function renderAll() {
    renderDashboard();
    renderChurches();
    renderMinistries();
    renderSettings();
  }

  // =========================================================================
  // DASHBOARD VIEW
  // =========================================================================

  function renderDashboard() {
    document.getElementById('dash-kpi-churches').textContent = state.churches.length;
    document.getElementById('dash-kpi-ministries').textContent = state.ministries.length;
    const connCount = state.ministries.filter(m => !!m.spreadsheetId).length;
    document.getElementById('dash-kpi-connected').textContent = connCount;
    document.getElementById('dash-kpi-pending').textContent = state.ministries.length - connCount;

    if (state.driveFolder.name) {
      document.getElementById('dash-drive-name').textContent = state.driveFolder.name;
    }
    if (state.driveFolder.url) {
      document.getElementById('dash-drive-link').href = state.driveFolder.url;
    }

    if (state.masterSpreadsheet.name) {
      document.getElementById('dash-master-name').textContent = state.masterSpreadsheet.name;
    }
    if (state.masterSpreadsheet.url) {
      document.getElementById('dash-master-link').href = state.masterSpreadsheet.url;
    }

    // Recent Churches
    const churchesEl = document.getElementById('dash-recent-churches');
    if (state.churches.length > 0) {
      churchesEl.innerHTML = state.churches.slice(0, 5).map(c => `
        <div onclick="navigateTo('ministries', { hoiThanhId: '${c.id}' })" class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 hover:border-primary/30 flex items-center justify-between cursor-pointer transition-all">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-primary-container/15 text-primary flex items-center justify-center font-bold text-xs">
              <span class="material-symbols-outlined text-base">church</span>
            </div>
            <div>
              <h4 class="text-xs font-bold text-white">${c.tenHT}</h4>
              <p class="text-[11px] text-text-secondary">${c.mucSu || c.tinhThanh || 'Chưa cập nhật'}</p>
            </div>
          </div>
          <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-primary-container/20 text-primary border border-primary-container/30">
            ${c.soLuongBanNganh || 0} ban ngành
          </span>
        </div>
      `).join('');
    } else {
      churchesEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có Hội Thánh nào</div>`;
    }

    // Recent Ministries
    const minEl = document.getElementById('dash-recent-ministries');
    if (state.ministries.length > 0) {
      minEl.innerHTML = state.ministries.slice(0, 6).map(m => {
        const hasSheet = !!m.spreadsheetId;
        const webUrl = getMinistryWebAppUrl(m);

        return `
          <div class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 hover:border-secondary/30 flex items-center justify-between gap-3 transition-all">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-9 h-9 rounded-xl bg-secondary-container/15 text-secondary flex items-center justify-center font-bold text-xs shrink-0">
                <span class="material-symbols-outlined text-base">groups</span>
              </div>
              <div class="min-w-0">
                <h4 class="text-xs font-bold text-white truncate">${m.tenBN}</h4>
                <p class="text-[11px] text-text-secondary truncate">${m.tenHoiThanh || ''}</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${hasSheet ? `
                <a href="${m.spreadsheetUrl || ('https://docs.google.com/spreadsheets/d/' + m.spreadsheetId + '/edit')}" target="_blank" class="p-2 rounded-xl bg-white/5 hover:bg-emerald-500/20 text-emerald-400 transition-colors" title="Mở Google Sheet">
                  <span class="material-symbols-outlined text-[17px]">table_chart</span>
                </a>
                ${webUrl ? `
                  <a href="${webUrl}" target="_blank" class="px-2.5 py-1.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-[11px] font-bold flex items-center gap-1 shadow-md transition-all">
                    <span>Mở App</span>
                    <span class="material-symbols-outlined text-xs">rocket_launch</span>
                  </a>
                ` : ''}
              ` : `
                <span class="text-[10px] text-warning-amber font-semibold bg-amber-500/10 px-2 py-0.5 rounded-full">Chưa có Sheet</span>
              `}
            </div>
          </div>
        `;
      }).join('');
    } else {
      minEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có Ban Ngành nào</div>`;
    }
  }

  function getMinistryWebAppUrl(m) {
    if (m.webAppUrl && !m.webAppUrl.includes('script.google.com')) return m.webAppUrl;
    if (m.spreadsheetId) {
      return `https://haiyenpa25.github.io/GGSheet-QLHT/ban-nganh.html?sheetId=${encodeURIComponent(m.spreadsheetId)}&banNganhId=${encodeURIComponent(m.id)}&title=${encodeURIComponent(m.tenBN || 'Ban Ngành')}`;
    }
    if (state.banNganhWebAppUrl) {
      return `${state.banNganhWebAppUrl}?sheetId=${encodeURIComponent(m.spreadsheetId || '')}&banNganhId=${encodeURIComponent(m.id)}&title=${encodeURIComponent(m.tenBN || '')}`;
    }
    return '';
  }

  // =========================================================================
  // CHURCHES VIEW
  // =========================================================================

  function renderChurches() {
    let list = state.churches || [];
    if (state.searchChurch) {
      const q = state.searchChurch.toLowerCase();
      list = list.filter(c => 
        (c.tenHT || '').toLowerCase().includes(q) ||
        (c.maHT || '').toLowerCase().includes(q) ||
        (c.mucSu || '').toLowerCase().includes(q) ||
        (c.tinhThanh || '').toLowerCase().includes(q)
      );
    }

    const badge = document.getElementById('churches-count-badge');
    if (badge) badge.textContent = `Tổng cộng: ${list.length} Hội Thánh`;

    const container = document.getElementById('churches-grid-container');
    if (!container) return;

    if (list.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 glass-card rounded-3xl p-12 text-center text-xs text-text-secondary space-y-3">
          <span class="material-symbols-outlined text-4xl text-primary/60">church</span>
          <p class="font-medium text-sm text-white">Chưa có Hội Thánh nào</p>
          <p>Bấm nút <strong>"+ Thêm Hội Thánh Mới"</strong> để bắt đầu tạo Hội Thánh.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = list.map(c => `
      <div class="glass-card rounded-3xl p-5 border border-white/10 hover:border-primary/40 flex flex-col justify-between shadow-lg transition-all duration-200 group">
        <div>
          <div class="flex justify-between items-start gap-2 mb-3">
            <div class="w-11 h-11 rounded-2xl bg-primary-container/20 border border-primary-container/30 text-primary flex items-center justify-center font-bold shrink-0">
              <span class="material-symbols-outlined text-2xl">church</span>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="openEditChurchModal('${c.id}')" class="p-2 text-text-secondary hover:text-white rounded-full hover:bg-white/5 transition-colors" title="Sửa"><span class="material-symbols-outlined text-[18px]">edit</span></button>
              <button onclick="deleteChurch('${c.id}')" class="p-2 text-text-secondary hover:text-rose-400 rounded-full hover:bg-white/5 transition-colors" title="Xóa"><span class="material-symbols-outlined text-[18px]">delete</span></button>
            </div>
          </div>

          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-white/5 text-primary border border-white/10 inline-block mb-1">${c.maHT || 'HT_CODE'}</span>
          <h3 class="text-base font-bold text-white leading-snug group-hover:text-primary transition-colors">${c.tenHT}</h3>
          <p class="text-xs text-text-secondary mt-1 flex items-center gap-1">
            <span class="material-symbols-outlined text-[14px]">person</span>
            <span>${c.mucSu || 'Chưa có Quản nhiệm'}</span>
          </p>

          <div class="mt-4 pt-3 border-t border-white/5 space-y-1.5 text-[11px] text-text-secondary">
            ${c.diaChi ? `<div class="flex items-center gap-1.5 truncate"><span class="material-symbols-outlined text-[14px]">location_on</span><span>${c.diaChi}, ${c.tinhThanh || ''}</span></div>` : ''}
            ${c.sdt ? `<div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[14px]">call</span><span>${c.sdt}</span></div>` : ''}
          </div>
        </div>

        <div class="mt-5 pt-3 border-t border-white/10 flex justify-between items-center">
          <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-secondary-container/20 text-secondary border border-secondary-container/30">
            ${c.soLuongBanNganh || 0} ban ngành
          </span>
          <button onclick="navigateTo('ministries', { hoiThanhId: '${c.id}' })" class="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-primary text-xs font-semibold flex items-center gap-1 transition-all">
            <span>Xem ban ngành</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </div>
      </div>
    `).join('');
  }

  function openAddChurchModal() {
    document.getElementById('form-church').reset();
    document.getElementById('church-id').value = '';
    document.getElementById('modal-church-title').innerHTML = `<span class="material-symbols-outlined text-primary">add_home</span> Thêm Hội Thánh Mới`;
    openModal('modal-church');
  }

  function openEditChurchModal(id) {
    const c = state.churches.find(item => String(item.id) === String(id));
    if (!c) return;

    document.getElementById('church-id').value = c.id;
    document.getElementById('church-ten').value = c.tenHT || '';
    document.getElementById('church-ma').value = c.maHT || '';
    document.getElementById('church-mucsu').value = c.mucSu || '';
    document.getElementById('church-diachi').value = c.diaChi || '';
    document.getElementById('church-quanhuyen').value = c.quanHuyen || '';
    document.getElementById('church-tinhthanh').value = c.tinhThanh || '';
    document.getElementById('church-sdt').value = c.sdt || '';
    document.getElementById('church-email').value = c.email || '';
    document.getElementById('church-ngaythanhlap').value = c.ngayThanhLap || '';
    document.getElementById('church-trangthai').value = c.trangThai || 'active';
    document.getElementById('church-ghichu').value = c.ghiChu || '';

  async function autoCreateMinistrySheet(id) {
    const m = state.ministries.find(item => String(item.id) === String(id));
    if (!m) return;

    if (!confirm(`Hệ thống sẽ tự động tạo file Google Sheet mới cho "${m.tenBN}" trên Google Drive và nạp sẵn 10 bảng dữ liệu chuẩn. Tiếp tục?`)) return;

    showLoading(true);
    try {
      const res = await runGAS('apiCreateMinistrySheet', id);
      if (res && res.success) {
        showToast(res.message || 'Tạo Sheet thành công!', 'success');
        if (res.data && res.data.sheetId) {
          m.spreadsheetId = res.data.sheetId;
          m.spreadsheetUrl = res.data.url;
          m.webAppUrl = res.data.webAppUrl;
          renderMinistries();
          renderDashboard();
        } else {
          await initApp();
        }
        if (res.data && res.data.webAppUrl) {
          if (confirm(`Đã tạo Sheet và tạo Link Web App cho "${m.tenBN}". Bạn có muốn mở Web App của ban ngành ngay không?`)) {
            window.open(res.data.webAppUrl, '_blank');
          }
        } else if (res.data && res.data.url) {
          window.open(res.data.url, '_blank');
        }
      } else {
        showToast(res.message || 'Lỗi tạo Sheet', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  // =========================================================================

  function openModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.remove('hidden');
      el.classList.add('flex');
      document.body.style.overflow = 'hidden';
      state.activeModal = modalId;
    }
  }

  function closeModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.add('hidden');
      el.classList.remove('flex');
      document.body.style.overflow = '';
      if (state.activeModal === modalId) state.activeModal = null;
    }
  }

  function closeAllModals() {
    document.querySelectorAll('.app-modal').forEach(m => {
      m.classList.add('hidden');
      m.classList.remove('flex');
    });
    document.body.style.overflow = '';
    state.activeModal = null;
  }

  function showLoading(show) {
    const loader = document.getElementById('global-loading-indicator');
    if (loader) {
      if (show) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  }

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const bgColors = {
      success: 'bg-emerald-600/90 border-emerald-400/50 text-white',
      error: 'bg-rose-600/90 border-rose-400/50 text-white',
      info: 'bg-surface-elevated/90 border-primary/40 text-on-surface',
      warning: 'bg-amber-600/90 border-amber-400/50 text-white'
    };
    const icons = {
      success: 'check_circle',
      error: 'error',
      info: 'info',
      warning: 'warning'
    };

    toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl transition-all duration-300 transform translate-y-4 opacity-0 ${bgColors[type] || bgColors.info}`;
    toast.innerHTML = `
      <span class="material-symbols-outlined text-[20px]">${icons[type] || 'info'}</span>
      <span class="font-medium text-sm">${message}</span>
    `;

    container.appendChild(toast);

    setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-x-full');
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }

  let currentQrMinistry = null;

  function openMinistryQrModal(minId) {
    const m = state.ministries.find(item => String(item.id) === String(minId));
    if (!m) return;
    currentQrMinistry = m;

    const webUrl = getMinistryWebAppUrl(m);
    const modalTitle = document.getElementById('qr-modal-title');
    const modalSubtitle = document.getElementById('qr-modal-subtitle');
    const footerName = document.getElementById('qr-modal-footer-name');
    const footerUrl = document.getElementById('qr-modal-footer-url');
    const img = document.getElementById('qr-code-img');

    if (modalTitle) modalTitle.textContent = `Mã QR: ${m.tenBN}`;
    if (modalSubtitle) modalSubtitle.textContent = m.tenHoiThanh || 'Hội Thánh Tin Lành';
    if (footerName) footerName.textContent = m.tenBN;
    if (footerUrl) footerUrl.textContent = webUrl;

    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=350x350&margin=10&data=${encodeURIComponent(webUrl)}`;
    if (img) img.src = qrApiUrl;

    openModal('modal-ministry-qr');
  }

  function downloadQrCode() {
    if (!currentQrMinistry) return;
    const img = document.getElementById('qr-code-img');
    if (!img || !img.src) return;

    const a = document.createElement('a');
    a.href = img.src;
    a.download = `QR_${currentQrMinistry.tenBN || 'BanNganh'}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('Đã bắt đầu tải ảnh QR Code!', 'success');
  }

  function printQrCode() {
    if (!currentQrMinistry) return;
    const webUrl = getMinistryWebAppUrl(currentQrMinistry);
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=15&data=${encodeURIComponent(webUrl)}`;

    const printWin = window.open('', '_blank');
    if (!printWin) {
      showToast('Vui lòng cho phép mở cửa sổ popup để in!', 'warning');
      return;
    }

    printWin.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <title>Mã QR - ${currentQrMinistry.tenBN}</title>
        <style>
          body { font-family: 'Times New Roman', serif; text-align: center; padding: 40px; }
          .card { max-width: 450px; margin: 0 auto; border: 2px solid #000; padding: 30px; border-radius: 20px; }
          h2 { margin: 0 0 5px 0; font-size: 24px; text-transform: uppercase; }
          h3 { margin: 0 0 20px 0; font-size: 18px; color: #444; }
          img { width: 280px; height: 280px; margin: 15px auto; }
          p { font-size: 14px; margin: 5px 0; font-family: sans-serif; }
          .url { font-family: monospace; font-size: 13px; font-weight: bold; color: #0066cc; }
          @media print { body { padding: 0; } }
        </style>
      </head>
      <body>
        <div class="card">
          <h2>HỘI THÁNH TIN LÀNH</h2>
          <h3>${currentQrMinistry.tenHoiThanh || ''} &bull; ${currentQrMinistry.tenBN}</h3>
          <img src="${qrApiUrl}" alt="QR" />
          <p><strong>QUÉT MÃ ĐỂ TRUY CẬP ỨNG DỤNG BAN NGÀNH</strong></p>
          <p class="url">${webUrl}</p>
        </div>
      </body>
      </html>
    `);
    printWin.document.close();
    setTimeout(() => {
      printWin.focus();
      printWin.print();
    }, 250);
  }

  // =========================================================================
  // PWA INSTALL BANNER & NETWORK STATUS
  // =========================================================================
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const banner = document.getElementById('pwa-install-banner');
    if (banner && !sessionStorage.getItem('pwa_dismissed')) {
      banner.classList.remove('hidden');
    }
  });

  async function triggerPwaInstall() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if (choice.outcome === 'accepted') {
        showToast('Cảm ơn bạn đã cài đặt ứng dụng!', 'success');
      }
      deferredPrompt = null;
      dismissPwaBanner();
    } else {
      showToast('Trên iPhone: Bấm nút Chia sẻ (Share) ➔ Chọn "Thêm vào MH chính"', 'info');
    }
  }

  function dismissPwaBanner() {
    const banner = document.getElementById('pwa-install-banner');
    if (banner) banner.classList.add('hidden');
    sessionStorage.setItem('pwa_dismissed', 'true');
  }

  function updateNetworkStatus() {
    const badge = document.getElementById('network-status-badge');
    const text = document.getElementById('network-status-text');
    if (!badge || !text) return;

    if (navigator.onLine) {
      badge.className = 'hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30';
      text.textContent = 'Trực tuyến';
    } else {
      badge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30';
      text.textContent = 'Ngoại tuyến (Cache)';
      showToast('Đang chạy ở chế độ ngoại tuyến (dữ liệu từ bộ nhớ đệm)!', 'warning');
    }
  }

  window.addEventListener('online', updateNetworkStatus);
  window.addEventListener('offline', updateNetworkStatus);
  updateNetworkStatus();

  // =========================================================================
  // THEME MODE ENGINE (LIGHT / DARK THEME)
  // =========================================================================
  const THEME_STORAGE_KEY = 'qlht_theme_mode';

  function initThemeMode() {
    const saved = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';
    applyThemeMode(saved);
  }

  function applyThemeMode(theme) {
    const icon = document.getElementById('theme-toggle-icon');
    if (theme === 'light') {
      document.body.classList.add('theme-light');
      if (icon) icon.textContent = 'dark_mode';
    } else {
      document.body.classList.remove('theme-light');
      if (icon) icon.textContent = 'light_mode';
    }
  }

  function toggleThemeMode() {
    const isLight = document.body.classList.contains('theme-light');
    const nextTheme = isLight ? 'dark' : 'light';
    localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
    applyThemeMode(nextTheme);
    showToast(`Đã chuyển sang giao diện ${nextTheme === 'light' ? 'Sáng ☀️' : 'Tối 🌙'}`, 'info');
  }

  // =========================================================================
  // GLOBAL SEARCH (COMMAND BAR CTRL+K)
  // =========================================================================
  function openGlobalSearchModal() {
    const inp = document.getElementById('global-search-input');
    if (inp) inp.value = '';
    handleGlobalSearch('');
    openModal('modal-global-search');
    setTimeout(() => {
      if (inp) inp.focus();
    }, 100);
  }

  function handleGlobalSearch(q) {
    const resBox = document.getElementById('global-search-results');
    if (!resBox) return;

    q = (q || '').trim().toLowerCase();
    if (!q || q.length < 1) {
      resBox.innerHTML = `<div class="text-center py-6 text-text-secondary">Nhập tên Hội Thánh, Ban Ngành, Quản nhiệm, SĐT... để tìm nhanh</div>`;
      return;
    }

    const churches = (state.churches || []).filter(c => 
      (c.tenHT || '').toLowerCase().includes(q) ||
      (c.mucSu || '').toLowerCase().includes(q) ||
      (c.sdt || '').includes(q)
    );

    const ministries = (state.ministries || []).filter(m => 
      (m.tenBN || '').toLowerCase().includes(q) ||
      (m.tenHoiThanh || '').toLowerCase().includes(q) ||
      (m.truongBan || '').toLowerCase().includes(q)
    );

    if (churches.length === 0 && ministries.length === 0) {
      resBox.innerHTML = `<div class="text-center py-6 text-text-secondary">Không tìm thấy kết quả phù hợp với "<strong>${q}</strong>"</div>`;
      return;
    }

    let html = '';
    if (churches.length > 0) {
      html += `<div class="font-bold text-primary text-[11px] uppercase tracking-wider mb-1">Hội Thánh (${churches.length})</div>`;
      html += churches.map(c => `
        <div onclick="closeModal('modal-global-search'); navigateTo('ministries', { hoiThanhId: '${c.id}' });" class="p-2.5 rounded-xl bg-white/5 hover:bg-primary/20 border border-white/5 cursor-pointer transition-colors flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-base">church</span>
            <div>
              <div class="font-bold text-white">${c.tenHT}</div>
              <div class="text-[10px] text-text-secondary">${c.mucSu || 'Chưa có quản nhiệm'} &bull; ${c.tinhThanh || ''}</div>
            </div>
          </div>
          <span class="material-symbols-outlined text-sm text-text-secondary">arrow_forward</span>
        </div>
      `).join('');
    }

    if (ministries.length > 0) {
      html += `<div class="font-bold text-secondary text-[11px] uppercase tracking-wider mt-3 mb-1">Ban Ngành (${ministries.length})</div>`;
      html += ministries.map(m => `
        <div onclick="closeModal('modal-global-search'); navigateTo('ministries', { hoiThanhId: '${m.hoiThanhId}' });" class="p-2.5 rounded-xl bg-white/5 hover:bg-secondary/20 border border-white/5 cursor-pointer transition-colors flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-secondary text-base">groups</span>
            <div>
              <div class="font-bold text-white">${m.tenBN}</div>
              <div class="text-[10px] text-text-secondary">${m.tenHoiThanh || ''} &bull; ${m.truongBan || 'Chưa có trưởng ban'}</div>
            </div>
          </div>
          <span class="material-symbols-outlined text-sm text-text-secondary">arrow_forward</span>
        </div>
      `).join('');
    }

    resBox.innerHTML = html;
  }

  // Keyboard shortcut: Ctrl + K / Cmd + K
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openGlobalSearchModal();
    }
  });

  // =========================================================================
  // BOOTSTRAP RUNNER
  // =========================================================================

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAllModals();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      initThemeMode();
      initApp();
    });
  } else {
    initThemeMode();
    initApp();
  }

  // PWA Service Worker Registration
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=2').then(reg => {
        console.log('PWA ServiceWorker registered with scope:', reg.scope);
      }).catch(err => {
        console.warn('PWA ServiceWorker registration failed:', err);
      });
    });
  }
</script>
