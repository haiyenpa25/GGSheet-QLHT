<style>
  body {
    background-color: #0b1326;
    color: #dae2fd;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .glass-card {
    background: rgba(29, 41, 69, 0.65);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .glass-card-solid {
    background: rgba(23, 31, 51, 0.96);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .glass-input {
    background: rgba(11, 19, 38, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #dae2fd;
    transition: all 0.2s ease;
  }
  .glass-input:focus {
    border-color: rgba(16, 185, 129, 0.8);
    box-shadow: 0 0 14px rgba(16, 185, 129, 0.3);
    outline: none;
  }
  .ambient-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    z-index: -1;
    pointer-events: none;
    animation: floatAmbient 16s ease-in-out infinite;
  }
  @keyframes floatAmbient {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
    50% { transform: translateY(-25px) scale(1.08); opacity: 0.35; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @media print {
    body {
      background: white !important;
      color: black !important;
    }
    .no-print, header, nav, #toast-container {
      display: none !important;
    }
    .print-only {
      display: block !important;
    }
  }
</style>
