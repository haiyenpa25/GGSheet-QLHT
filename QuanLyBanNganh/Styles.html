<style>
  body {
    background-color: #0b1326;
    color: #dae2fd;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .glass-card {
    background: rgba(29, 41, 69, 0.65);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .glass-card-solid {
    background: rgba(23, 31, 51, 0.96);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .glass-input {
    background: rgba(11, 19, 38, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #dae2fd;
    transition: all 0.2s ease;
  }
  .glass-input:focus {
    border-color: rgba(16, 185, 129, 0.8);
    box-shadow: 0 0 14px rgba(16, 185, 129, 0.3);
    outline: none;
  }
  .ambient-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    z-index: -1;
    pointer-events: none;
    animation: floatAmbient 16s ease-in-out infinite;
  }
  @keyframes floatAmbient {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
    50% { transform: translateY(-25px) scale(1.08); opacity: 0.35; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  
  /* Custom Switch Toggle */
  .switch-toggle {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
  }
  .switch-toggle input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(255, 255, 255, 0.1);
    transition: .3s;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .switch-slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 2px;
    bottom: 2px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .switch-slider-green {
    background-color: #10b981;
    border-color: #059669;
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
  }
  input:checked + .switch-slider-blue {
    background-color: #0284c7;
    border-color: #0369a1;
    box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
  }
  input:checked + .switch-slider:before {
    transform: translateX(20px);
  }

  /* Schedule Table Styling */
  .schedule-custom-table th, 
  .schedule-custom-table td {
    vertical-align: middle;
  }

  /* Printable Dedicated Container */
  .print-only-container {
    display: none;
  }

  /* Professional Church Print Stylesheet for A4 (Landscape / Portrait) & A5 */
  @media print {
    @page {
      size: auto;
      margin: 8mm 10mm 8mm 10mm;
    }

    html, body {
      background: #ffffff !important;
      color: #0f172a !important;
      font-family: "Times New Roman", Times, "Liberation Serif", serif !important;
      font-size: 9pt !important;
      line-height: 1.25 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Ẩn hoàn toàn tất cả giao diện ứng dụng web */
    body > *:not(.print-only-container) {
      display: none !important;
    }

    .no-print, header, nav, footer, #toast-container, .bottom-nav-btn, .modal-backdrop, .app-modal,
    .ambient-glow, .app-view, button, input, select, textarea {
      display: none !important;
    }

    /* Hiển thị container in chuyên biệt */
    .print-only-container {
      display: block !important;
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      background: #ffffff !important;
      color: #0f172a !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .church-print-header {
      display: flex !important;
      justify-content: space-between !important;
      align-items: flex-start !important;
      border-bottom: 2px solid #0f172a !important;
      padding-bottom: 6px !important;
      margin-bottom: 8px !important;
    }

    .church-print-theme-box {
      background: #f8fafc !important;
      border: 1.5px solid #334155 !important;
      padding: 6px 10px !important;
      margin-bottom: 10px !important;
      border-radius: 4px !important;
      text-align: center !important;
    }

    .church-print-table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin-bottom: 10px !important;
    }

    .church-print-table th {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
      font-weight: bold !important;
      border: 1px solid #334155 !important;
      padding: 5px 3px !important;
      text-align: center !important;
      font-size: 8.5pt !important;
      text-transform: uppercase !important;
    }

    .church-print-table td {
      border: 1px solid #475569 !important;
      padding: 4.5px 3.5px !important;
      font-size: 8pt !important;
      color: #0f172a !important;
      vertical-align: middle !important;
    }

    .church-print-table tr:nth-child(even) td {
      background-color: #fafafa !important;
    }

    .church-print-table tr.event-row td {
      background-color: #fef3c7 !important;
      font-weight: bold !important;
      text-align: center !important;
      color: #92400e !important;
    }

    .church-print-footer {
      page-break-inside: avoid !important;
      margin-top: 10px !important;
      padding-top: 6px !important;
    }

    .church-signature-space {
      height: 55px !important;
    }
  }

  /* =========================================================================
     LIGHT MODE THEME ENGINE
     ========================================================================= */
  body.theme-light {
    background-color: #f1f5f9;
    color: #0f172a;
  }
  body.theme-light #app-top-header {
    background-color: rgba(255, 255, 255, 0.95);
    border-color: rgba(226, 232, 240, 0.9);
    box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
  }
  body.theme-light .glass-card {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(226, 232, 240, 0.9);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
  }
  body.theme-light .glass-card-solid {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
  }
  body.theme-light .glass-input {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #0f172a;
  }
  body.theme-light .glass-input:focus {
    border-color: #10b981;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
  }
  body.theme-light .text-white {
    color: #0f172a !important;
  }
  body.theme-light .text-text-secondary {
    color: #475569 !important;
  }
  body.theme-light .text-text-secondary\/70 {
    color: #64748b !important;
  }
  body.theme-light .bg-surface-elevated {
    background-color: #f8fafc !important;
  }
  body.theme-light .bg-surface-elevated\/80 {
    background-color: rgba(248, 250, 252, 0.95) !important;
  }
  body.theme-light .bg-surface-elevated\/70 {
    background-color: rgba(248, 250, 252, 0.9) !important;
  }
  body.theme-light .bg-surface-elevated\/60 {
    background-color: rgba(248, 250, 252, 0.85) !important;
  }
  body.theme-light .bg-surface-container {
    background-color: #e2e8f0 !important;
  }
  body.theme-light .bg-surface-container-low\/90 {
    background-color: rgba(255, 255, 255, 0.95) !important;
  }
  body.theme-light .bg-surface-container-low\/60 {
    background-color: rgba(248, 250, 252, 0.95) !important;
  }
  body.theme-light .bg-white\/5 {
    background-color: rgba(0, 0, 0, 0.04) !important;
  }
  body.theme-light .bg-white\/10 {
    background-color: rgba(0, 0, 0, 0.07) !important;
  }
  body.theme-light .bg-white\/20 {
    background-color: rgba(0, 0, 0, 0.12) !important;
  }
  body.theme-light .border-white\/10,
  body.theme-light .border-white\/5,
  body.theme-light .border-white\/15,
  body.theme-light .border-white\/20 {
    border-color: rgba(226, 232, 240, 0.9) !important;
  }
  body.theme-light .ambient-glow {
    opacity: 0.12 !important;
  }
  body.theme-light #app-bottom-nav {
    background-color: rgba(255, 255, 255, 0.95);
    border-color: #e2e8f0;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06);
  }
</style>
