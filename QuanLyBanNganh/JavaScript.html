<script>
  // =========================================================================
  // GLOBAL STATE & RUNNER
  // =========================================================================
  var state = {
    activeSheetId: '',
    banNganhTitle: '',
    banNganhId: '',
    kpis: { total_members: 0, active_members: 0, group_count: 0, total_balance: 0, total_attendance_records: 0, total_visits: 0 },
    theme: { chuDe: '', cauGoc: '', noiDungCauGoc: '' },
    members: [],
    groups: [],
    funds: [],
    transactions: [],
    attendances: [],
    visits: [],
    schedules: [],
    themes: [],
    templates: [],
    spreadsheet: { id: '', name: 'Google Sheet', url: '' },
    currentView: 'dashboard',
    searchMember: '',
    filterMemberGroup: 'all',
    searchFinance: '',
    activeModal: null
  };

  // Safe Accessor Helpers
  function getMemberName(m) {
    if (!m) return 'Đoàn viên';
    return m.hoTen || m.HoTen || m.hoten || m.fullName || m.fullname || m.name || m['Họ và tên'] || m['Họ Tên'] || m['Họ và Tên'] || m['Họ tên'] || 'Chưa đặt tên';
  }

  function getMemberPhone(m) {
    if (!m) return '';
    return m.sdt || m.SDT || m.dienthoai || m.phone || m.phoneNumber || m['Số điện thoại'] || m['SĐT'] || '';
  }

  function getMemberCode(m) {
    if (!m) return 'TV';
    return m.maTV || m.MaTV || m.matv || m.code || m['Mã TV'] || 'TV';
  }

  function getMemberRole(m) {
    if (!m) return 'Đoàn viên';
    return m.chucVu || m.ChucVu || m.role || m['Chức vụ'] || 'Đoàn viên';
  }

  function getMemberAddress(m) {
    if (!m) return '';
    return m.diaChi || m.DiaChi || m.address || m['Địa chỉ'] || '';
  }

  function getGroupName(g) {
    if (!g) return 'Tổ nhóm';
    return g.tenTo || g.TenTo || g.tento || g.name || g['Tên tổ'] || g['Tổ'] || 'Tổ nhóm';
  }

  function runGAS(functionName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        console.warn('Google Script Environment Unavailable. Mocking result.');
        resolve({ success: false, message: 'Google Script Environment Unavailable' });
        return;
      }

      var runner = google.script.run
        .withSuccessHandler(function(res) {
          console.log('GAS Success [' + functionName + ']:', res);
          resolve(res);
        })
        .withFailureHandler(function(err) {
          console.error('GAS Error [' + functionName + ']:', err);
          showToast('Lỗi máy chủ: ' + (err.message || err), 'error');
          resolve({ success: false, message: err.message || String(err) });
        });

      runner[functionName].apply(runner, args);
    });
  }

  // =========================================================================
  // INITIALIZATION & NAVIGATION
  // =========================================================================

  async function initApp() {
    // Đọc tham số URL
    try {
      const urlParams = new URLSearchParams(window.location.search);
      state.activeSheetId = urlParams.get('sheetId') || '';
      state.banNganhTitle = urlParams.get('title') || '';
      state.banNganhId = urlParams.get('banNganhId') || '';

      if (state.banNganhTitle) {
        document.title = 'Quản Lý ' + state.banNganhTitle;
        const brandHeader = document.querySelector('header h1');
        if (brandHeader) brandHeader.textContent = state.banNganhTitle;
      }
    } catch (e) {}

    showLoading(true);
    try {
      const res = await runGAS('apiGetInitialData', state.activeSheetId);
      if (res && res.success && res.data) {
        state.kpis = res.data.kpis || state.kpis;
        state.theme = res.data.theme || state.theme;
        state.members = res.data.members || [];
        state.groups = res.data.groups || [];
        state.funds = res.data.funds || [];
        state.transactions = res.data.transactions || [];
        state.attendances = res.data.attendances || [];
        state.visits = res.data.visits || [];
        state.schedules = res.data.schedules || [];
        state.themes = res.data.themes || [];
        state.templates = res.data.templates || [];
        state.spreadsheet = res.data.spreadsheet || state.spreadsheet;

        renderAll();
      } else {
        showToast('Chưa kết nối dữ liệu: ' + (res.message || 'Vui lòng kiểm tra cài đặt Sheet'), 'warning');
      }
    } catch (e) {
      console.error('initApp Error:', e);
      showToast('Lỗi nạp dữ liệu: ' + e.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function navigateTo(viewName) {
    state.currentView = viewName;
    document.querySelectorAll('.app-view').forEach(el => el.classList.add('hidden'));

    const target = document.getElementById('view-' + viewName);
    if (target) {
      target.classList.remove('hidden');
      target.classList.add('animate-fade-in');
    }

    document.querySelectorAll('.nav-link-btn').forEach(btn => {
      if (btn.getAttribute('data-page') === viewName) {
        btn.className = 'nav-link-btn px-3.5 py-1.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 transition-all';
      } else {
        btn.className = 'nav-link-btn px-3.5 py-1.5 rounded-full text-xs font-semibold text-text-secondary hover:text-white hover:bg-white/5 transition-all border border-transparent';
      }
    });

    document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
      const isCurrent = btn.getAttribute('data-page') === viewName;
      btn.className = isCurrent 
        ? 'bottom-nav-btn flex flex-col items-center justify-center text-emerald-400 drop-shadow-[0_0_8px_rgba(78,222,163,0.5)] active:scale-90 transition-transform'
        : 'bottom-nav-btn flex flex-col items-center justify-center text-text-secondary hover:text-white active:scale-90 transition-transform';
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderAll() {
    renderDashboard();
    renderMembers();
    renderGroups();
    renderAttendance();
    renderFinance();
    renderSchedule();
    renderVisitations();
    renderSettings();
  }

  // =========================================================================
  // 1. DASHBOARD
  // =========================================================================

  function renderDashboard() {
    document.getElementById('dash-kpi-members').textContent = state.kpis.total_members;
    document.getElementById('dash-kpi-groups').textContent = state.kpis.group_count;
    document.getElementById('dash-kpi-balance').textContent = Number(state.kpis.total_balance || 0).toLocaleString('vi-VN') + ' đ';
    document.getElementById('dash-kpi-attendance').textContent = state.kpis.total_attendance_records;

    if (state.theme) {
      document.getElementById('dash-theme-title').textContent = state.theme.chuDe || 'KỶ LUẬT THUỘC LINH';
      document.getElementById('dash-theme-verse').textContent = state.theme.cauGoc || 'I Ti-mô-thê 4:7-8';
      document.getElementById('dash-theme-content').textContent = state.theme.noiDungCauGoc || 'Hãy tập tành sự tin kính...';
    }

    if (state.spreadsheet && state.spreadsheet.name) {
      document.getElementById('dash-sheet-name').textContent = state.spreadsheet.name;
      document.getElementById('dash-sheet-link').href = state.spreadsheet.url || ('https://docs.google.com/spreadsheets/d/' + state.activeSheetId + '/edit');
    }

    // Recent Members
    const rMembersEl = document.getElementById('dash-recent-members');
    if (state.members.length > 0) {
      rMembersEl.innerHTML = state.members.slice(0, 5).map(m => {
        const name = getMemberName(m);
        const phone = getMemberPhone(m);
        const role = getMemberRole(m);
        const code = getMemberCode(m);

        return `
          <div class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center font-bold text-xs">
                <span class="material-symbols-outlined text-base">person</span>
              </div>
              <div>
                <h4 class="text-xs font-bold text-white">${name}</h4>
                <p class="text-[11px] text-text-secondary">${role} &bull; ${phone || 'Chưa có SĐT'}</p>
              </div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-400">
              ${code}
            </span>
          </div>
        `;
      }).join('');
    } else {
      rMembersEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có đoàn viên nào</div>`;
    }

    // Recent Transactions
    const rFinanceEl = document.getElementById('dash-recent-finance');
    if (state.transactions.length > 0) {
      rFinanceEl.innerHTML = state.transactions.slice(0, 5).map(t => {
        const hm = t.hangMuc || t.HangMuc || t.noidung || 'Giao dịch';
        const st = Number(t.soTien || t.SoTien || 0);
        const loai = t.loaiGD || t.LoaiGD || 'THU';
        const ngay = t.ngayGD || t.NgayGD || '';
        const nguoi = t.nguoiNopNhan || t.NguoiNopNhan || '';

        return `
          <div class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 flex items-center justify-between">
            <div>
              <h4 class="text-xs font-bold text-white">${hm}</h4>
              <p class="text-[11px] text-text-secondary">${ngay} &bull; ${nguoi}</p>
            </div>
            <span class="text-xs font-bold ${loai === 'THU' ? 'text-emerald-400' : 'text-rose-400'}">
              ${loai === 'THU' ? '+' : '-'}${st.toLocaleString('vi-VN')} đ
            </span>
          </div>
        `;
      }).join('');
    } else {
      rFinanceEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có giao dịch nào</div>`;
    }
  }

  // =========================================================================
  // 2. MEMBERS VIEW
  // =========================================================================

  function renderMembers() {
    let list = state.members || [];
    if (state.filterMemberGroup !== 'all') {
      list = list.filter(m => String(m.toId) === String(state.filterMemberGroup));
    }
    if (state.searchMember) {
      const q = state.searchMember.toLowerCase();
      list = list.filter(m => 
        getMemberName(m).toLowerCase().includes(q) ||
        getMemberCode(m).toLowerCase().includes(q) ||
        getMemberPhone(m).toLowerCase().includes(q) ||
        getMemberRole(m).toLowerCase().includes(q)
      );
    }

    const countBadge = document.getElementById('members-count-badge');
    if (countBadge) countBadge.textContent = `Tổng cộng: ${list.length} Đoàn Viên`;

    const fGroup = document.getElementById('member-filter-group');
    const mGroup = document.getElementById('member-modal-group');
    const groupOpts = (state.groups || []).map(g => `<option value="${g.id}">${getGroupName(g)}</option>`).join('');
    if (fGroup) fGroup.innerHTML = `<option value="all">Tất cả Tổ Nhóm</option>` + groupOpts;
    if (mGroup) mGroup.innerHTML = `<option value="">-- Không thuộc tổ --</option>` + groupOpts;
    if (fGroup && state.filterMemberGroup) fGroup.value = state.filterMemberGroup;

    const container = document.getElementById('members-grid-container');
    if (!container) return;

    if (list.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 glass-card rounded-3xl p-12 text-center text-xs text-text-secondary space-y-3">
          <span class="material-symbols-outlined text-4xl text-emerald-400/60">person</span>
          <p class="font-medium text-sm text-white">Chưa có đoàn viên nào</p>
          <p>Bấm nút <strong>"+ Thêm Đoàn Viên Mới"</strong> để tạo hồ sơ.</p>
        </div>
      `;
      return;
    }

    const groupMap = {};
    state.groups.forEach(g => { groupMap[g.id] = getGroupName(g); });

    container.innerHTML = list.map(m => {
      const name = getMemberName(m);
      const phone = getMemberPhone(m);
      const role = getMemberRole(m);
      const code = getMemberCode(m);
      const address = getMemberAddress(m);
      const dob = m.ngaySinh || m.NgaySinh || '';

      return `
        <div class="glass-card rounded-3xl p-5 border border-white/10 hover:border-emerald-400/40 flex flex-col justify-between shadow-lg transition-all duration-200 group">
          <div>
            <div class="flex justify-between items-start gap-2 mb-3">
              <div class="w-11 h-11 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 flex items-center justify-center font-bold shrink-0">
                <span class="material-symbols-outlined text-2xl">person</span>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="openEditMemberModal('${m.id}')" class="p-2 text-text-secondary hover:text-white rounded-full hover:bg-white/5 transition-colors" title="Sửa"><span class="material-symbols-outlined text-[18px]">edit</span></button>
                <button onclick="deleteMember('${m.id}')" class="p-2 text-text-secondary hover:text-rose-400 rounded-full hover:bg-white/5 transition-colors" title="Xóa"><span class="material-symbols-outlined text-[18px]">delete</span></button>
              </div>
            </div>

            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-white/5 text-emerald-400 border border-white/10 inline-block mb-1">${code}</span>
            <h3 class="text-base font-bold text-white leading-snug group-hover:text-emerald-400 transition-colors">${name}</h3>
            <p class="text-xs text-text-secondary mt-1 flex items-center gap-1">
              <span class="material-symbols-outlined text-[14px]">badge</span>
              <span>${role} &bull; ${groupMap[m.toId] || 'Chưa vào tổ'}</span>
            </p>

            <div class="mt-4 pt-3 border-t border-white/5 space-y-1.5 text-[11px] text-text-secondary">
              ${phone ? `<div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[14px]">call</span><span>${phone}</span></div>` : ''}
              ${address ? `<div class="flex items-center gap-1.5 truncate"><span class="material-symbols-outlined text-[14px]">location_on</span><span>${address}</span></div>` : ''}
              ${dob ? `<div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[14px]">cake</span><span>${dob}</span></div>` : ''}
            </div>
          </div>

          <div class="mt-5 pt-3 border-t border-white/5 flex justify-between items-center text-[10px] text-text-secondary">
            <span>Trạng thái: <strong class="text-emerald-400 font-semibold">${(m.trangThai || 'active') === 'active' ? 'Đang sinh hoạt' : 'Tạm ngưng'}</strong></span>
            <button onclick="openVisitationForMember('${m.id}')" class="text-emerald-400 hover:underline flex items-center gap-1 font-semibold">
              <span>Thăm viếng</span>
              <span class="material-symbols-outlined text-xs">arrow_forward</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  function openAddMemberModal() {
    document.getElementById('form-member').reset();
    document.getElementById('member-id').value = '';
    document.getElementById('modal-member-title').innerHTML = `<span class="material-symbols-outlined text-emerald-400">person_add</span> Thêm Đoàn Viên Mới`;
    openModal('modal-member');
  }

  function openEditMemberModal(id) {
    const m = state.members.find(item => String(item.id) === String(id));
    if (!m) return;

    document.getElementById('member-id').value = m.id;
    document.getElementById('member-hoten').value = getMemberName(m);
    document.getElementById('member-matv').value = getMemberCode(m);
    document.getElementById('member-sdt').value = getMemberPhone(m);
    document.getElementById('member-ngaysinh').value = m.ngaySinh || m.NgaySinh || '';
    document.getElementById('member-gioitinh').value = m.gioiTinh || m.GioiTinh || 'Nam';
    document.getElementById('member-modal-group').value = m.toId || '';
    document.getElementById('member-chucvu').value = getMemberRole(m);
    document.getElementById('member-diachi').value = getMemberAddress(m);
    document.getElementById('member-trangthai').value = m.trangThai || 'active';
    document.getElementById('member-ghichu').value = m.ghiChu || m.GhiChu || '';

    document.getElementById('modal-member-title').innerHTML = `<span class="material-symbols-outlined text-emerald-400">edit</span> Cập Nhật Đoàn Viên`;
    openModal('modal-member');
  }

  async function handleSaveMember(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('member-id').value || null,
      hoTen: document.getElementById('member-hoten').value.trim(),
      maTV: document.getElementById('member-matv').value.trim(),
      sdt: document.getElementById('member-sdt').value.trim(),
      ngaySinh: document.getElementById('member-ngaysinh').value.trim(),
      gioiTinh: document.getElementById('member-gioitinh').value,
      toId: document.getElementById('member-modal-group').value,
      chucVu: document.getElementById('member-chucvu').value.trim(),
      diaChi: document.getElementById('member-diachi').value.trim(),
      trangThai: document.getElementById('member-trangthai').value,
      ghiChu: document.getElementById('member-ghichu').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiSaveMember', payload, state.activeSheetId);
      if (res && res.success) {
        showToast(res.message || 'Lưu đoàn viên thành công!', 'success');
        closeModal('modal-member');
        await initApp();
      } else {
        showToast(res.message || 'Lỗi lưu đoàn viên', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function deleteMember(id) {
    if (!confirm('Bạn có chắc muốn xóa đoàn viên này?')) return;
    showLoading(true);
    try {
      const res = await runGAS('apiDeleteMember', id, state.activeSheetId);
      if (res && res.success) {
        showToast('Đã xóa đoàn viên!', 'info');
        await initApp();
      } else {
        showToast(res.message || 'Không thể xóa', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  // =========================================================================
  // 3. GROUPS VIEW
  // =========================================================================

  function renderGroups() {
    const container = document.getElementById('groups-grid-container');
    if (!container) return;

    if (state.groups.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 glass-card rounded-3xl p-12 text-center text-xs text-text-secondary space-y-3">
          <span class="material-symbols-outlined text-4xl text-emerald-400/60">groups</span>
          <p class="font-medium text-sm text-white">Chưa có tổ nhóm nào</p>
          <p>Bấm nút <strong>"+ Thêm Tổ Mới"</strong> để phân tổ sinh hoạt.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = state.groups.map(g => {
      const count = state.members.filter(m => String(m.toId) === String(g.id)).length;
      const gName = getGroupName(g);
      const gCode = g.maTo || g.MaTo || 'TO';
      const toTruong = g.toTruong || g.ToTruong || 'Chưa gán';
      const toPho = g.toPho || g.ToPho || 'Chưa gán';
      const lich = g.lichSinhHoat || g.LichSinhHoat || 'Chưa cập nhật';

      return `
        <div class="glass-card rounded-3xl p-5 border border-white/10 hover:border-emerald-400/40 flex flex-col justify-between shadow-lg transition-all duration-200">
          <div>
            <div class="flex justify-between items-start gap-2 mb-3">
              <div class="w-10 h-10 rounded-2xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center font-bold shrink-0">
                <span class="material-symbols-outlined text-xl">groups</span>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="openEditGroupModal('${g.id}')" class="p-1.5 text-text-secondary hover:text-white rounded-full hover:bg-white/5"><span class="material-symbols-outlined text-[16px]">edit</span></button>
                <button onclick="deleteGroup('${g.id}')" class="p-1.5 text-text-secondary hover:text-rose-400 rounded-full hover:bg-white/5"><span class="material-symbols-outlined text-[16px]">delete</span></button>
              </div>
            </div>

            <span class="text-[10px] font-mono font-bold text-emerald-400 block">${gCode}</span>
            <h3 class="text-base font-bold text-white">${gName}</h3>
            
            <div class="mt-3 space-y-1 text-[11px] text-text-secondary pt-2 border-t border-white/5">
              <div><span class="text-text-secondary/70">Tổ trưởng:</span> <strong class="text-white">${toTruong}</strong></div>
              <div><span class="text-text-secondary/70">Tổ phó:</span> <strong class="text-white">${toPho}</strong></div>
              <div><span class="text-text-secondary/70">Lịch nhóm:</span> <span>${lich}</span></div>
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-white/5 flex justify-between items-center">
            <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-400">
              ${count} đoàn viên
            </span>
            <button onclick="state.filterMemberGroup = '${g.id}'; navigateTo('members');" class="text-xs text-emerald-400 hover:underline flex items-center gap-1 font-semibold">
              <span>Xem đoàn viên</span>
              <span class="material-symbols-outlined text-xs">arrow_forward</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  function openAddGroupModal() {
    document.getElementById('form-group').reset();
    document.getElementById('group-id').value = '';
    openModal('modal-group');
  }

  function openEditGroupModal(id) {
    const g = state.groups.find(item => String(item.id) === String(id));
    if (!g) return;

    document.getElementById('group-id').value = g.id;
    document.getElementById('group-tento').value = getGroupName(g);
    document.getElementById('group-mato').value = g.maTo || g.MaTo || '';
    document.getElementById('group-totruong').value = g.toTruong || g.ToTruong || '';
    document.getElementById('group-topho').value = g.toPho || g.ToPho || '';
    document.getElementById('group-lichnhom').value = g.lichSinhHoat || g.LichSinhHoat || '';
    document.getElementById('group-diadiem').value = g.diaDiem || g.DiaDiem || '';
    document.getElementById('group-ghichu').value = g.ghiChu || g.GhiChu || '';
    openModal('modal-group');
  }

  async function handleSaveGroup(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('group-id').value || null,
      tenTo: document.getElementById('group-tento').value.trim(),
      maTo: document.getElementById('group-mato').value.trim(),
      toTruong: document.getElementById('group-totruong').value.trim(),
      toPho: document.getElementById('group-topho').value.trim(),
      lichSinhHoat: document.getElementById('group-lichnhom').value.trim(),
      diaDiem: document.getElementById('group-diadiem').value.trim(),
      ghiChu: document.getElementById('group-ghichu').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiSaveGroup', payload, state.activeSheetId);
      if (res && res.success) {
        showToast('Lưu tổ nhóm thành công!', 'success');
        closeModal('modal-group');
        await initApp();
      } else {
        showToast(res.message || 'Lỗi lưu tổ nhóm', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {

      });
    });

    showLoading(true);
    try {
      const res = await runGAS('apiSaveAttendance', {
        ngayDiemDanh: dateVal,
        records: records,

  // =========================================================================
  // MODALS & TOAST
  // =========================================================================

  function openModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.remove('hidden');
      el.classList.add('flex');
      document.body.style.overflow = 'hidden';
      state.activeModal = modalId;
    }
  }

  function closeModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.add('hidden');
      el.classList.remove('flex');
      document.body.style.overflow = '';
      if (state.activeModal === modalId) state.activeModal = null;
    }
  }

  function closeAllModals() {
    document.querySelectorAll('.app-modal').forEach(m => {
      m.classList.add('hidden');
      m.classList.remove('flex');
    });
    document.body.style.overflow = '';
    state.activeModal = null;
  }

  function showLoading(show) {
    const loader = document.getElementById('global-loading-indicator');
    if (loader) {
      if (show) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  }

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const bgColors = {
      success: 'bg-emerald-600/90 border-emerald-400/50 text-white',
      error: 'bg-rose-600/90 border-rose-400/50 text-white',
      info: 'bg-surface-elevated/90 border-emerald-400/40 text-on-surface',
      warning: 'bg-amber-600/90 border-amber-400/50 text-white'
    };
    const icons = {
      success: 'check_circle',
      error: 'error',
      info: 'info',
      warning: 'warning'
    };

    toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl transition-all duration-300 transform translate-y-4 opacity-0 ${bgColors[type] || bgColors.info}`;
    toast.innerHTML = `
      <span class="material-symbols-outlined text-[20px]">${icons[type] || 'info'}</span>
      <span class="font-medium text-sm">${message}</span>
    `;

    container.appendChild(toast);

    setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-x-full');
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }

  // =========================================================================
  // BOOTSTRAP RUNNER
  // =========================================================================

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAllModals();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
</script>
