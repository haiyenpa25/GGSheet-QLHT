<script>
  // =========================================================================
  // GLOBAL STATE & INSTANT LOCAL CACHE ENGINE
  // =========================================================================
  var state = {
    activeSheetId: '',
    banNganhTitle: '',
    banNganhId: '',
    kpis: { total_members: 0, active_members: 0, group_count: 0, total_balance: 0, total_attendance_records: 0, total_visits: 0 },
    theme: { chuDe: 'KỶ LUẬT THUỘC LINH', cauGoc: 'I Ti-mô-thê 4:7-8', noiDungCauGoc: 'Hãy tập tành sự tin kính...' },
    members: [],
    groups: [],
    funds: [],
    transactions: [],
    attendances: [],
    visits: [],
    schedules: [],
    themes: [],
    templates: [],
    spreadsheet: { id: '', name: 'Google Sheet Ban Ngành', url: '' },
    currentView: 'dashboard',
    searchMember: '',
    filterMemberGroup: 'all',
    sortMemberMode: 'name_asc',
    filterMemberGender: 'all',
    memberViewMode: 'cards',
    selectedMemberIds: new Set(),
    searchFinance: '',
    activeModal: null,

    // Smart Attendance state
    liveAttendance: {},
    attendanceFilterGroup: 'all',

    // Schedule state
    selectedScheduleQuarter: 'all',
    selectedScheduleYear: new Date().getFullYear(),
    searchSchedule: ''
  };

  const CACHE_PREFIX = 'qlnb_cache_';

  // Safe Accessor Helpers (Chuẩn hóa thuật ngữ Tin Lành)
  function getMemberName(m) {
    if (!m) return 'Ban viên';
    return m.hoTen || m.HoTen || m.hoten || m.fullName || m.fullname || m.name || m['Họ và tên'] || m['Họ Tên'] || m['Họ và Tên'] || m['Họ tên'] || 'Chưa đặt tên';
  }

  function getMemberPhone(m) {
    if (!m) return '';
    return String(m.sdt || m.SDT || m.dienthoai || m.phone || m.phoneNumber || m['Số điện thoại'] || m['SĐT'] || '').trim();
  }

  function cleanPhoneNumber(p) {
    if (!p) return '';
    let num = p.replace(/[^0-9]/g, '');
    if (num.startsWith('84')) num = '0' + num.substring(2);
    return num;
  }

  function getMemberCode(m) {
    if (!m) return 'BV';
    return m.maTV || m.MaTV || m.matv || m.code || m['Mã TV'] || m['Mã BV'] || 'BV';
  }

  function getMemberRole(m) {
    if (!m) return 'Ban viên';
    return m.chucVu || m.ChucVu || m.role || m['Chức vụ'] || 'Ban viên';
  }

  function getMemberAddress(m) {
    if (!m) return '';
    return m.diaChi || m.DiaChi || m.address || m['Địa chỉ'] || '';
  }

  function getGroupName(g) {
    if (!g) return 'Tổ nhóm';
    return g.tenTo || g.TenTo || g.tento || g.name || g['Tên tổ'] || g['Tổ'] || 'Tổ nhóm';
  }

  // =========================================================================
  // HIGH-PERFORMANCE IN-MEMORY STATE HELPERS
  // =========================================================================
  function upsertById(collection, record) {
    if (!collection || !record) return;
    const recId = String(record.id || record.ID || '');
    const index = collection.findIndex(item => String(item.id || item.ID || '') === recId);
    if (index === -1) {
      collection.unshift(record);
    } else {
      collection[index] = { ...collection[index], ...record };
    }
  }

  function removeById(collection, id) {
    if (!collection || id === undefined || id === null) return;
    const targetId = String(id);
    const index = collection.findIndex(item => String(item.id || item.ID || '') === targetId);
    if (index !== -1) {
      collection.splice(index, 1);
    }
  }

  // =========================================================================
  // GAS RUNNER WITH AUTOMATIC DUAL-MODE REST FALLBACK
  // =========================================================================
  const BAN_NGANH_API_FALLBACK_URL = 'https://script.google.com/macros/s/AKfycbzA9hu94R8otpipHPtw_52Fimf22HIgxIH02YVdisQU6D3KgCVlltjW0QjuD0KGwdYL/exec';

  async function runGAS(functionName) {
    var args = Array.prototype.slice.call(arguments, 1);

    // 1. First priority: Native google.script.run inside Google Apps Script iframe
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      return new Promise(function(resolve) {
        var runner = google.script.run
          .withSuccessHandler(function(res) {
            console.log('GAS Success [' + functionName + ']:', res);
            resolve(res);
          })
          .withFailureHandler(function(err) {
            console.warn('GAS Failure Handler [' + functionName + '], attempting REST fallback:', err);
            fetchRestFallback(functionName, args).then(resolve);
          });

        try {
          if (typeof runner[functionName] === 'function') {
            runner[functionName].apply(runner, args);
          } else {
            runner[functionName].apply(runner, args);
          }
        } catch (callErr) {
          console.warn('GAS Invoke catch [' + functionName + '], attempting REST fallback:', callErr);
          fetchRestFallback(functionName, args).then(resolve);
        }
      });
    }

    // 2. Second priority: REST API fetch fallback
    return fetchRestFallback(functionName, args);
  }

  async function fetchRestFallback(action, args) {
    try {
      const sheetId = state.activeSheetId || '1GkrK5hZdRArVkB125GEpKdbFgxglZP0IMRae27M9dBQ';
      let payload = { action: action, sheetId: sheetId, customSheetId: sheetId };

      if (action === 'apiGetInitialData') {
        payload.customSheetId = args[0] || sheetId;
      } else if (args.length === 1) {
        if (typeof args[0] === 'object') {
          payload.data = args[0];
        } else {
          payload.id = args[0];
        }
      } else if (args.length >= 2) {
        payload.data = args[0];
        payload.sheetId = args[1] || sheetId;
      }

      const res = await fetch(BAN_NGANH_API_FALLBACK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error('HTTP status ' + res.status);
      const json = await res.json();
      return json;
    } catch (e) {
      console.error('REST Fallback Error [' + action + ']:', e);
      return { success: false, message: e.message || String(e) };
    }
  }

  // =========================================================================
  // INITIALIZATION & STALE-WHILE-REVALIDATE CACHE
  // =========================================================================

  async function initApp() {
    try {
      const serverCfg = window.SERVER_CONFIG || {};
      let urlParams = null;
      try {
        urlParams = new URLSearchParams(window.location.search);
      } catch (e) {}

      state.activeSheetId = (urlParams ? urlParams.get('sheetId') : '') || serverCfg.sheetId || '1GkrK5hZdRArVkB125GEpKdbFgxglZP0IMRae27M9dBQ';
      state.banNganhTitle = (urlParams ? urlParams.get('title') : '') || serverCfg.banNganhTitle || 'Ban Thanh Tráng';
      state.banNganhId = (urlParams ? urlParams.get('banNganhId') : '') || serverCfg.banNganhId || 'id_41451e0a';

      if (state.banNganhTitle) {
        document.title = 'Quản Lý ' + state.banNganhTitle;
        const brandH1 = document.getElementById('brand-title');
        const schBanner = document.getElementById('sch-banner-title');
        if (brandH1) brandH1.textContent = 'Quản Lý ' + state.banNganhTitle;
        if (schBanner) schBanner.textContent = 'CHƯƠNG TRÌNH THỜ PHƯỢNG CHÚA & SINH HOẠT ' + state.banNganhTitle.toUpperCase();
      }

      // Default attendance date: current Sunday
      const attDateInput = document.getElementById('attendance-date');
      if (attDateInput && !attDateInput.value) {
        attDateInput.value = new Date().toISOString().split('T')[0];
      }
    } catch (e) {}

    initRoleAndScope();

    // 1. TẢI TỪ LOCAL CACHE (NẾU CÓ DỮ LIỆU CỦA ĐÚNG SHEET ID NÀY)
    loadFromLocalCache();

    // Render ngay giao diện mặc định/cache để tránh màn hình --
    renderCurrentView();

    // 2. TẢI DỮ LIỆU MỚI NHẤT TỪ GOOGLE SHEET VỚI LOADING CHỈ BÁO
    await refreshData(true);
  }

  function getCacheKey() {
    return CACHE_PREFIX + (state.activeSheetId || 'default');
  }

  function loadFromLocalCache() {
    try {
      const key = getCacheKey();
      const raw = localStorage.getItem(key);
      if (raw) {
        const cached = JSON.parse(raw);
        if (cached && cached.data) {
          applyData(cached.data);
          renderAll();
        }
      }
    } catch (e) {
      console.warn('Cache load error:', e);
    }
  }

  function saveToLocalCache(data) {
    try {
      const key = getCacheKey();
      localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), data: data }));
    } catch (e) {}
  }

  function clearLocalCache() {
    try {
      const key = getCacheKey();
      localStorage.removeItem(key);
      showToast('Đã xóa bộ nhớ đệm cache!', 'success');
      refreshData(true);
    } catch (e) {}
  }

  function applyData(data) {
    state.kpis = data.kpis || state.kpis;
    state.theme = data.theme || state.theme;
    state.members = data.members || [];
    state.groups = data.groups || [];
    state.funds = data.funds || [];
    state.transactions = data.transactions || [];
    state.attendances = data.attendances || [];
    state.visits = data.visits || [];
    state.schedules = data.schedules || [];
    state.themes = data.themes || [];
    state.templates = data.templates || [];
    state.spreadsheet = data.spreadsheet || state.spreadsheet;

    // Reset Live Attendance State
    initAttendanceState();
    initRoleAndScope();
    updateNotificationBadge();
  }

  async function refreshData(showLoader) {
    const refreshIcon = document.getElementById('btn-refresh-icon');
    if (refreshIcon) refreshIcon.classList.add('animate-spin');
    if (showLoader) showLoading(true);

    try {
      const res = await runGAS('apiGetInitialData', state.activeSheetId);
      if (res && res.success && res.data) {
        applyData(res.data);
        saveToLocalCache(res.data);
        renderCurrentView();
        if (showLoader) showToast('Đồng bộ dữ liệu thành công!', 'success');
      } else {
        if (!state.members.length) {
          showToast('Chưa kết nối dữ liệu: ' + (res.message || 'Vui lòng kiểm tra cài đặt Sheet'), 'warning');
        }
      }
    } catch (e) {
      console.error('refreshData Error:', e);
      if (showLoader) showToast('Lỗi nạp dữ liệu: ' + e.message, 'error');
    } finally {
      if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      if (showLoader) showLoading(false);
    }
  }

  function navigateTo(viewName) {
    state.currentView = viewName;
    document.querySelectorAll('.app-view').forEach(el => el.classList.add('hidden'));

    const target = document.getElementById('view-' + viewName);
    if (target) {
      target.classList.remove('hidden');
      target.classList.add('animate-fade-in');
    }

    document.querySelectorAll('.nav-link-btn').forEach(btn => {
      if (btn.getAttribute('data-page') === viewName) {
        btn.className = 'nav-link-btn px-3.5 py-1.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 transition-all';
      } else {
        btn.className = 'nav-link-btn px-3.5 py-1.5 rounded-full text-xs font-semibold text-text-secondary hover:text-white hover:bg-white/5 transition-all border border-transparent';
      }
    });

    document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
      const isCurrent = btn.getAttribute('data-page') === viewName;
      btn.className = isCurrent 
        ? 'bottom-nav-btn flex flex-col items-center justify-center text-emerald-400 drop-shadow-[0_0_8px_rgba(78,222,163,0.5)] active:scale-90 transition-transform'
        : 'bottom-nav-btn flex flex-col items-center justify-center text-text-secondary hover:text-white active:scale-90 transition-transform';
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderCurrentView();
  }

  function renderCurrentView() {
    switch (state.currentView) {
      case 'dashboard':
        renderDashboard();
        renderBirthdays();
        renderAbsenceWarnings();
        break;
      case 'members':
        renderMembers();
        break;
      case 'groups':
        renderGroups();
        break;
      case 'attendance':
        renderAttendance();
        break;
      case 'finance':
        renderFinance();
        break;
      case 'schedule':
        renderSchedule();
        break;
      case 'visitations':
        renderVisitations();
        break;
      case 'settings':
        renderSettings();
        break;
      default:
        renderDashboard();
        break;
    }
  }

  function renderAll() {
    renderDashboard();
    renderBirthdays();
    renderAbsenceWarnings();
    renderMembers();
    renderGroups();
    renderAttendance();
    renderFinance();
    renderSchedule();
    renderVisitations();
    renderSettings();
  }

  // =========================================================================
  // 1. DASHBOARD & SMART WIDGETS
  // =========================================================================

  function renderDashboard() {
    try {
      const kpiMembers = document.getElementById('dash-kpi-members');
      const kpiGroups = document.getElementById('dash-kpi-groups');
      const kpiBalance = document.getElementById('dash-kpi-balance');
      const kpiAtt = document.getElementById('dash-kpi-attendance');

      if (kpiMembers) kpiMembers.textContent = state.kpis ? state.kpis.total_members : 0;
      if (kpiGroups) kpiGroups.textContent = state.kpis ? state.kpis.group_count : 0;
      if (kpiBalance) kpiBalance.textContent = Number(state.kpis ? state.kpis.total_balance : 0).toLocaleString('vi-VN') + ' đ';
      if (kpiAtt) kpiAtt.textContent = state.kpis ? state.kpis.total_attendance_records : 0;

      if (state.theme) {
        const themeTitle = document.getElementById('dash-theme-title');
        const themeVerse = document.getElementById('dash-theme-verse');
        const themeContent = document.getElementById('dash-theme-content');
        if (themeTitle) themeTitle.textContent = state.theme.chuDe || 'KỶ LUẬT THUỘC LINH';
        if (themeVerse) themeVerse.textContent = state.theme.cauGoc || 'I Ti-mô-thê 4:7-8';
        if (themeContent) themeContent.textContent = state.theme.noiDungCauGoc || 'Hãy tập tành sự tin kính...';
      }

      if (state.spreadsheet && state.spreadsheet.name) {
        const sheetNameEl = document.getElementById('dash-sheet-name');
        const sheetLinkEl = document.getElementById('dash-sheet-link');
        if (sheetNameEl) sheetNameEl.textContent = state.spreadsheet.name;
        if (sheetLinkEl) sheetLinkEl.href = state.spreadsheet.url || ('https://docs.google.com/spreadsheets/d/' + state.activeSheetId + '/edit');
      }

      // Recent Members
      const rMembersEl = document.getElementById('dash-recent-members');
      if (rMembersEl) {
        if (state.members && state.members.length > 0) {
          rMembersEl.innerHTML = state.members.slice(0, 5).map(m => {
            const name = getMemberName(m);
            const phone = getMemberPhone(m);
            const role = getMemberRole(m);
            const code = getMemberCode(m);

            return `
              <div class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center font-bold text-xs">
                    <span class="material-symbols-outlined text-base">person</span>
                  </div>
                  <div>
                    <h4 class="text-xs font-bold text-white">${name}</h4>
                    <p class="text-[11px] text-text-secondary">${role} &bull; ${phone || 'Chưa có SĐT'}</p>
                  </div>
                </div>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-400">
                  ${code}
                </span>
              </div>
            `;
          }).join('');
        } else {
          rMembersEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có ban viên nào</div>`;
        }
      }

      // Recent Transactions
      const rFinanceEl = document.getElementById('dash-recent-finance');
      if (rFinanceEl) {
        if (state.transactions && state.transactions.length > 0) {
          rFinanceEl.innerHTML = state.transactions.slice(0, 5).map(t => {
            const hm = t.hangMuc || t.HangMuc || t.noidung || 'Giao dịch';
            const st = Number(t.soTien || t.SoTien || 0);
            const loai = t.loaiGD || t.LoaiGD || 'THU';
            const ngay = t.ngayGD || t.NgayGD || '';
            const nguoi = t.nguoiNopNhan || t.NguoiNopNhan || '';

            return `
              <div class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 flex items-center justify-between">
                <div>
                  <h4 class="text-xs font-bold text-white">${hm}</h4>
                  <p class="text-[11px] text-text-secondary">${ngay} &bull; ${nguoi}</p>
                </div>
                <span class="text-xs font-bold ${loai === 'THU' ? 'text-emerald-400' : 'text-rose-400'}">
                  ${loai === 'THU' ? '+' : '-'}${st.toLocaleString('vi-VN')} đ
                </span>
              </div>
            `;
          }).join('');
        } else {
          rFinanceEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có giao dịch nào</div>`;
        }
      }
    } catch (e) {
      console.error('renderDashboard Error:', e);
    }
  }

  // WIDGET: SINH NHẬT THÁNG NÀY
  function renderBirthdays() {
    const container = document.getElementById('dash-birthday-container');
    const badge = document.getElementById('dash-birthday-badge');
    if (!container) return;

    const currentMonth = new Date().getMonth() + 1;
    const birthdayList = [];

    (state.members || []).forEach(m => {
      const dobStr = m.ngaySinh || m.NgaySinh || '';
      if (!dobStr) return;

      let bMonth = null;
      let bDay = null;

      if (dobStr.includes('/')) {
        const parts = dobStr.split('/');
        bDay = parseInt(parts[0], 10);
        bMonth = parseInt(parts[1], 10);
      } else if (dobStr.includes('-')) {
        const parts = dobStr.split('-');
        bMonth = parseInt(parts[1], 10);
        bDay = parseInt(parts[2], 10);
      }

      if (bMonth === currentMonth) {
        birthdayList.push({ member: m, day: bDay, raw: dobStr });
      }
    });

    birthdayList.sort((a, b) => (a.day || 0) - (b.day || 0));

    if (badge) badge.textContent = `${birthdayList.length} người trong tháng ${currentMonth}`;

    if (birthdayList.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 text-center py-6 text-xs text-text-secondary">
          <span class="material-symbols-outlined text-2xl text-pink-400/50 block mb-1">cake</span>
          Không có ban viên nào sinh nhật trong tháng ${currentMonth}.
        </div>
      `;
      return;
    }

    container.innerHTML = birthdayList.map(item => {
      const m = item.member;
      const name = getMemberName(m);
      const phone = getMemberPhone(m);
      const cleanPhone = cleanPhoneNumber(phone);
      const role = getMemberRole(m);

      const zaloBtnHtml = cleanPhone
        ? '<a href="https://zalo.me/' + cleanPhone + '" target="_blank" class="px-2.5 py-1.5 rounded-xl bg-sky-600/30 hover:bg-sky-600/50 text-sky-300 text-[11px] font-bold flex items-center gap-1 transition-all" title="Gửi lời chúc mừng qua Zalo"><span class="material-symbols-outlined text-sm">cake</span><span>Chúc Zalo</span></a>'
        : '<span class="text-[10px] text-text-secondary italic">Chưa có SĐT</span>';

      return `
        <div class="p-3 rounded-2xl bg-surface-elevated/80 border border-pink-500/20 flex items-center justify-between gap-2 shadow-sm">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-pink-500/20 text-pink-300 font-bold flex flex-col items-center justify-center shrink-0 border border-pink-500/30">
              <span class="text-[9px] uppercase font-semibold leading-none">Ngày</span>
              <span class="text-sm font-extrabold leading-none mt-0.5">${item.day || '--'}</span>
            </div>
            <div class="min-w-0">
              <h4 class="text-xs font-bold text-white truncate">${name}</h4>
              <p class="text-[10px] text-text-secondary truncate">${role} &bull; ${item.raw}</p>
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            ${zaloBtnHtml}
          </div>
        </div>
      `;
    }).join('');
  }

  // WIDGET: CẢNH BÁO VẮNG NHÓM & CẦN THĂM VIẾNG
  function renderAbsenceWarnings() {
    const container = document.getElementById('dash-absence-container');
    const badge = document.getElementById('dash-absence-badge');
    if (!container) return;

    const allAtt = state.attendances || [];
    const dateMap = {};
    allAtt.forEach(a => {
      if (a.ngayDiemDanh) dateMap[a.ngayDiemDanh] = true;
    });
    const sortedDates = Object.keys(dateMap).sort().reverse();
    const recentDates = sortedDates.slice(0, 3);

    const absenceList = [];

    if (recentDates.length >= 2) {
      (state.members || []).forEach(m => {
        if ((m.trangThai || 'active') !== 'active') return;
        let consecutiveAbsences = 0;

        for (let d of recentDates) {
          const rec = allAtt.find(a => a.ngayDiemDanh === d && String(a.thanhVienId) === String(m.id));
          if (!rec || rec.coMat === 'VANG' || rec.coMat === false || rec.coMat === 'false') {
            consecutiveAbsences++;
          } else {
            break;
          }
        }

        if (consecutiveAbsences >= 2) {
          absenceList.push({ member: m, absences: consecutiveAbsences });
        }
      });
    }

    if (badge) badge.textContent = `${absenceList.length} người cần chăm sóc`;

    if (absenceList.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 text-center py-6 text-xs text-text-secondary">
          <span class="material-symbols-outlined text-2xl text-emerald-400/50 block mb-1">verified</span>
          Tất cả ban viên đều duy trì sinh hoạt đều đặn!
        </div>
      `;
      return;
    }

    container.innerHTML = absenceList.map(item => {
      const m = item.member;
      const name = getMemberName(m);
      const phone = getMemberPhone(m);
      const cleanPhone = cleanPhoneNumber(phone);

      const phoneBtnsHtml = cleanPhone
        ? '<a href="tel:' + cleanPhone + '" class="p-1.5 rounded-lg bg-white/5 hover:bg-emerald-500/20 text-emerald-400 transition-colors" title="Gọi điện"><span class="material-symbols-outlined text-base">call</span></a><a href="https://zalo.me/' + cleanPhone + '" target="_blank" class="p-1.5 rounded-lg bg-white/5 hover:bg-sky-500/20 text-sky-400 transition-colors" title="Zalo"><span class="material-symbols-outlined text-base">chat</span></a>'
        : '';

      return `
        <div class="p-3 rounded-2xl bg-surface-elevated/80 border border-amber-500/25 flex items-center justify-between gap-2 shadow-sm">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-warning-amber font-bold flex flex-col items-center justify-center shrink-0 border border-amber-500/30">
              <span class="material-symbols-outlined text-base">person_alert</span>
              <span class="text-[9px] font-bold leading-none mt-0.5">Vắng ${item.absences}T</span>
            </div>
            <div class="min-w-0">
              <h4 class="text-xs font-bold text-white truncate">${name}</h4>

  function extractVietnameseFirstName(fullName) {
    if (!fullName) return '';
    const parts = fullName.trim().split(/\s+/);
    return parts[parts.length - 1] || fullName;
  }

  function parseDateForSort(dateStr) {
    if (!dateStr) return 0;
    const parts = String(dateStr).trim().split(/[\/\-\.]/);
    if (parts.length === 3) {
      const d = parseInt(parts[0], 10) || 1;
      const m = parseInt(parts[1], 10) || 1;
      let y = parseInt(parts[2], 10) || 1900;
      if (y < 100) y += 1900;
      return new Date(y, m - 1, d).getTime();
    }
    return 0;
  }

  function getFilteredMembers() {
    let list = state.members || [];

    // 0. Scope Filter for Tổ Trưởng
    if (state.currentRole === 'to_truong' && state.roleScopeGroupId && state.roleScopeGroupId !== 'all') {
      list = list.filter(m => String(m.toId) === String(state.roleScopeGroupId));
    }

    // 1. Filter by Group
    if (state.filterMemberGroup === 'unassigned') {
      list = list.filter(m => !m.toId || m.toId === '' || m.toId === 'null');
    } else if (state.filterMemberGroup === 'assigned') {
      list = list.filter(m => m.toId && m.toId !== '' && m.toId !== 'null');
    } else if (state.filterMemberGroup && state.filterMemberGroup !== 'all') {
      list = list.filter(m => String(m.toId) === String(state.filterMemberGroup));
    }

    // 2. Filter by Gender
    if (state.filterMemberGender && state.filterMemberGender !== 'all') {
      list = list.filter(m => String(m.gioiTinh || 'Nam').toLowerCase() === state.filterMemberGender.toLowerCase());
    }

    // 3. Search query
    if (state.searchMember) {
      const q = state.searchMember.toLowerCase().trim();
      list = list.filter(m => 
        getMemberName(m).toLowerCase().includes(q) ||
        getMemberCode(m).toLowerCase().includes(q) ||
        getMemberPhone(m).toLowerCase().includes(q) ||
        getMemberRole(m).toLowerCase().includes(q) ||
        getMemberAddress(m).toLowerCase().includes(q)
      );
    }

    // 4. Sort Algorithm (Chuẩn tiếng Việt với Intl.Collator)
    const collator = new Intl.Collator('vi', { sensitivity: 'base', numeric: true });
    const sortMode = state.sortMemberMode || 'name_asc';

    list = [...list].sort((a, b) => {
      const nameA = getMemberName(a);
      const nameB = getMemberName(b);
      const firstNameA = extractVietnameseFirstName(nameA);
      const firstNameB = extractVietnameseFirstName(nameB);

      switch (sortMode) {
        case 'name_asc': {
          const cmp = collator.compare(firstNameA, firstNameB);
          return cmp !== 0 ? cmp : collator.compare(nameA, nameB);
        }
        case 'name_desc': {
          const cmp = collator.compare(firstNameB, firstNameA);
          return cmp !== 0 ? cmp : collator.compare(nameB, nameA);
        }
        case 'fullname_asc':
          return collator.compare(nameA, nameB);
        case 'code_asc':
          return collator.compare(getMemberCode(a), getMemberCode(b));
        case 'dob_desc':
          return parseDateForSort(b.ngaySinh || b.NgaySinh) - parseDateForSort(a.ngaySinh || a.NgaySinh);
        case 'dob_asc':
          return parseDateForSort(a.ngaySinh || a.NgaySinh) - parseDateForSort(b.ngaySinh || b.NgaySinh);
        case 'group': {
          const gA = a.toId || 'ZZZ';
          const gB = b.toId || 'ZZZ';
          const gCmp = collator.compare(gA, gB);
          return gCmp !== 0 ? gCmp : collator.compare(firstNameA, firstNameB);
        }
        default:
          return 0;
      }
    });

    return list;
  }

  function exportMembersToExcel() {
    const list = getFilteredMembers();
    if (list.length === 0) {
      showToast('Không có ban viên nào để xuất file', 'warning');
      return;
    }

    const groupMap = {};
    state.groups.forEach(g => { groupMap[g.id] = getGroupName(g); });

    const headers = ['STT', 'Mã Ban Viên', 'Họ và Tên', 'Số Điện Thoại', 'Ngày Sinh', 'Giới Tính', 'Tổ Nhóm', 'Chức Vụ', 'Địa Chỉ', 'Trạng Thái'];
    const rows = list.map((m, idx) => [
      idx + 1,
      `"${getMemberCode(m)}"`,
      `"${getMemberName(m)}"`,
      `"${getMemberPhone(m)}"`,
      `"${m.ngaySinh || m.NgaySinh || ''}"`,
      `"${m.gioiTinh || 'Nam'}"`,
      `"${groupMap[m.toId] || 'Chưa phân tổ'}"`,
      `"${getMemberRole(m)}"`,
      `"${(getMemberAddress(m) || '').replace(/"/g, '""')}"`,
      `"${m.trangThai || 'active'}"`
    ]);

    const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const safeTitle = (state.banNganhTitle || 'BanThanhTrang').replace(/\s+/g, '_');
    const dateStr = new Date().toISOString().split('T')[0];
    link.setAttribute('href', url);
    link.setAttribute('download', `Danh_Sach_Ban_Vien_${safeTitle}_${dateStr}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    showToast(`Đã xuất danh sách ${list.length} ban viên thành công!`, 'success');
  }

  function openMemberProfileModal(memberId) {
    const m = (state.members || []).find(item => String(item.id) === String(memberId));
    if (!m) return;

    const name = getMemberName(m);
    const code = getMemberCode(m);
    const phone = getMemberPhone(m);
    const cleanPhone = cleanPhoneNumber(phone);
    const role = getMemberRole(m);
    const address = getMemberAddress(m);
    const dob = m.ngaySinh || m.NgaySinh || '--';
    const gender = m.gioiTinh || 'Nam';
    const isFemale = (gender === 'Nữ' || gender === 'Nu');

    const groupMap = {};
    state.groups.forEach(g => { groupMap[g.id] = getGroupName(g); });
    const toName = groupMap[m.toId] || 'Chưa phân tổ';

    // Calculate Spiritual Stats
    const memberAtts = (state.attendances || []).filter(a => String(a.thanhVienId) === String(m.id));
    const totalRecordedSessions = memberAtts.length;
    const presentCount = memberAtts.filter(a => (a.coMat === 'CO_MAT' || a.coMat === true || a.coMat === '1' || a.coMat === 'TRUE')).length;
    const verseCount = memberAtts.filter(a => (a.thuocCauGoc === 'THUOC' || a.thuocCauGoc === true || a.thuocCauGoc === '1' || a.thuocCauGoc === 'TRUE')).length;

  function parseBulkMembersText(rawText) {
    if (!rawText) return [];
    const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    const parsed = [];
    const defaultGroupId = (document.getElementById('bulk-default-group') || {}).value || '';

    lines.forEach((line, idx) => {
      // Bỏ qua dòng tiêu đề nếu người dùng copy cả header từ Excel
      const low = line.toLowerCase();
      if (low.includes('họ và tên') || low.includes('ho va ten') || low.includes('full name') || low.includes('fullname')) return;

      let parts = line.split('\t');
      if (parts.length === 1) parts = line.split(',');
      if (parts.length === 1) parts = line.split(';');

      let stt = '', hoTen = '', ngaySinh = '', diaChi = '', sdt = '', toName = '', toId = defaultGroupId;

      if (parts.length >= 6) {
        stt = parts[0].trim();
        hoTen = parts[1].trim();
        ngaySinh = parts[2].trim();
        diaChi = parts[3].trim();
        sdt = cleanPhoneNumber(parts[4].trim());
        toName = parts[5].trim();
      } else if (parts.length === 5) {
        stt = parts[0].trim();
        hoTen = parts[1].trim();
        ngaySinh = parts[2].trim();
        diaChi = parts[3].trim();
        sdt = cleanPhoneNumber(parts[4].trim());
      } else if (parts.length === 4) {
        hoTen = parts[0].trim();
        ngaySinh = parts[1].trim();
        diaChi = parts[2].trim();
        sdt = cleanPhoneNumber(parts[3].trim());
      } else if (parts.length >= 2) {
        hoTen = parts[0].trim();
        sdt = cleanPhoneNumber(parts[1].trim());
      } else {
        hoTen = line.trim();
      }

      if (!hoTen) return;

      // Tìm tên tổ nếu có toId
      if (!toName && toId) {
        const found = (state.groups || []).find(g => g.id === toId);
        if (found) toName = found.tenTo || found.name;
      }

      parsed.push({
        stt: stt || String(idx + 1),
        hoTen: hoTen,
        ngaySinh: ngaySinh,
        diaChi: diaChi,
        sdt: sdt,
        to: toName || '',
        toId: toId
      });
    });

    return parsed;
  }

  function getQuarterFromMonth(m) {
    const num = parseInt(m, 10);
    if (num >= 1 && num <= 3) return 'I';
    if (num >= 4 && num <= 6) return 'II';
    if (num >= 7 && num <= 9) return 'III';
    return 'IV';
  }

  function getMonthsForQuarter(q) {
    if (q === 'I') return [1, 2, 3];
    if (q === 'II') return [4, 5, 6];
    if (q === 'III') return [7, 8, 9];
    return [10, 11, 12];
  }

  function parseSessionDate(dateStr) {
    if (!dateStr) return null;
    const str = String(dateStr).trim();
    const parts = str.split(/[\/\-\.]/);
    if (parts.length === 3) {
      let d, m, y;
      if (parts[0].length === 4) {
        // YYYY-MM-DD
        y = parseInt(parts[0], 10);
        m = parseInt(parts[1], 10);
        d = parseInt(parts[2], 10);
      } else {
        // DD/MM/YYYY
        d = parseInt(parts[0], 10);
        m = parseInt(parts[1], 10);
        y = parseInt(parts[2], 10);
      }
      if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
        const dStr = String(d).padStart(2, '0');
        const mStr = String(m).padStart(2, '0');
        return {
          day: d,
          month: m,
          year: y,
          formatted: `${dStr}/${mStr}/${y}`,
          iso: `${y}-${mStr}-${dStr}`
        };
      }
    }
    return null;
  }

  function normalizeDateStr(dateStr) {
    const p = parseSessionDate(dateStr);
    return p ? p.formatted : String(dateStr || '').trim();
  }

    // 1. Populate Year Select
    if (yearSelect) {
      const yearsSet = new Set();
      const curYear = new Date().getFullYear();
      yearsSet.add(curYear);
      yearsSet.add(curYear - 1);
      yearsSet.add(curYear + 1);
      (state.schedules || []).forEach(s => {
        const p = parseSessionDate(s.ngayNhom);
        if (p) yearsSet.add(p.year);
      });
      const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);
      yearSelect.innerHTML = sortedYears.map(y => `<option value="${y}" ${y === state.attendanceFilter.year ? 'selected' : ''}>Năm ${y}</option>`).join('');
    }

    // 2. Render Quarters Tabs (Quý I, II, III, IV)
    if (quarterTabs) {
      const quarters = ['I', 'II', 'III', 'IV'];
      quarterTabs.innerHTML = quarters.map(q => {
        const isActive = q === state.attendanceFilter.quarter;
        return `
          <button onclick="handleAttQuarterChange('${q}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shrink-0 ${
            isActive 
              ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/25 ring-2 ring-emerald-400' 
              : 'glass-card text-text-secondary hover:text-white hover:bg-white/10'
          }">
            Quý ${q}
          </button>
        `;
      }).join('');
    }

    // 3. Render Month Pills for Active Quarter
    if (monthPills) {
      const months = getMonthsForQuarter(state.attendanceFilter.quarter);
      if (!months.includes(state.attendanceFilter.month)) {
        state.attendanceFilter.month = months[0];
      }

      monthPills.innerHTML = months.map(m => {
        const isActive = m === state.attendanceFilter.month;
        const count = (state.schedules || []).filter(s => {
          const p = parseSessionDate(s.ngayNhom);
          return p && p.year === state.attendanceFilter.year && p.month === m;
        }).length;

        return `
          <button onclick="handleAttMonthChange(${m})" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${
            isActive 
              ? 'bg-gradient-to-r from-sky-600 to-blue-600 text-white shadow-md ring-2 ring-sky-400' 
              : 'bg-surface-elevated/80 border border-white/5 text-text-secondary hover:text-white hover:bg-white/10'
          }">
            <span class="material-symbols-outlined text-[14px]">calendar_month</span>
            <span>Tháng ${m}</span>
            <span class="px-1.5 py-0.2 rounded-full text-[10px] ${isActive ? 'bg-white/20 text-white' : 'bg-white/5 text-text-secondary'}">${count}</span>
          </button>
        `;
      }).join('');
    }
  }

  function getSessionsForCurrentFilter() {
    const targetYear = parseInt(state.attendanceFilter.year, 10);
    const targetMonth = parseInt(state.attendanceFilter.month, 10);

    return (state.schedules || []).filter(s => {
      const p = parseSessionDate(s.ngayNhom);
      if (!p) return false;
      return p.year === targetYear && p.month === targetMonth;
    }).sort((a, b) => {
      const pa = parseSessionDate(a.ngayNhom);
      const pb = parseSessionDate(b.ngayNhom);
      if (!pa || !pb) return 0;
      return pa.day - pb.day;
    });
  }

  function renderMonthlySessions() {
    const container = document.getElementById('att-monthly-sessions-container');
    const countEl = document.getElementById('att-month-session-count');
    if (!container) return;

    const sessions = getSessionsForCurrentFilter();
    if (countEl) countEl.textContent = `${sessions.length} buổi nhóm trong Tháng ${state.attendanceFilter.month}/${state.attendanceFilter.year}`;

    if (sessions.length === 0) {
      container.innerHTML = `
        <div class="col-span-full glass-card rounded-2xl p-6 text-center space-y-3 border border-white/10">
          <span class="material-symbols-outlined text-3xl text-emerald-400/60 block">calendar_today</span>
          <p class="text-xs font-semibold text-white">Chưa có lịch sinh hoạt cho Tháng ${state.attendanceFilter.month}/${state.attendanceFilter.year}</p>
          <p class="text-[11px] text-text-secondary">Bạn có thể tạo tự động 52 buổi nhóm cho cả năm, thêm buổi nhóm mới hoặc điểm danh theo ngày tự do.</p>
          <div class="flex items-center justify-center gap-2 flex-wrap pt-2">
            <button onclick="openGenerateYearlyModal()" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1 shadow-md active:scale-95 transition-all">
              <span class="material-symbols-outlined text-sm">bolt</span>
              <span>⚡ Tạo Lịch 52 Buổi Cả Năm</span>
            </button>
            <button onclick="openAddScheduleModal()" class="px-3.5 py-2 rounded-xl glass-card hover:bg-white/10 text-emerald-400 border border-emerald-500/30 text-xs font-bold flex items-center gap-1 transition-all">
              <span class="material-symbols-outlined text-sm">add</span>
              <span>+ Thêm Buổi Nhóm</span>
            </button>
            <button onclick="openCustomDateAttendanceModal()" class="px-3.5 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-text-secondary hover:text-white text-xs font-semibold flex items-center gap-1 transition-all">
              <span class="material-symbols-outlined text-sm">calendar_month</span>
              <span>Điểm Danh Ngày Tự Do</span>
            </button>
          </div>
        </div>
      `;
      if (!state.attendanceFilter.selectedDate) {
        state.attendanceFilter.selectedScheduleId = null;
        state.liveAttendance = {};
      }
      return;
    }

    const currentSelectedId = state.attendanceFilter.selectedScheduleId;
    const exists = sessions.some(s => String(s.id) === String(currentSelectedId));
    if (!exists) {
      const now = new Date();
      let bestSession = sessions[0];
      let minDiff = Infinity;
      sessions.forEach(s => {
        const p = parseSessionDate(s.ngayNhom);
        if (p) {
          const sDate = new Date(p.year, p.month - 1, p.day);
          const diff = Math.abs(sDate.getTime() - now.getTime());
          if (diff < minDiff) {
            minDiff = diff;
            bestSession = s;
          }
        }
      });
      state.attendanceFilter.selectedScheduleId = bestSession.id;
      state.attendanceFilter.selectedDate = bestSession.ngayNhom;
      loadAttendanceForSessionDate(bestSession.ngayNhom);
    }

    const activeMembersCount = (state.members || []).filter(m => (m.trangThai || 'active') === 'active').length;

    container.innerHTML = sessions.map(s => {
      const isSelected = String(s.id) === String(state.attendanceFilter.selectedScheduleId);
      const sDateObj = parseSessionDate(s.ngayNhom);
      const formattedDate = sDateObj ? sDateObj.formatted : s.ngayNhom;

      const dateAtts = (state.attendances || []).filter(a => normalizeDateStr(a.ngayDiemDanh) === formattedDate);
      const hasAttended = dateAtts.length > 0;
      const presentCount = dateAtts.filter(a => (a.coMat === 'CO_MAT' || a.coMat === true || a.coMat === '1' || a.coMat === 'TRUE')).length;
      const pct = activeMembersCount > 0 ? Math.round((presentCount / activeMembersCount) * 100) : 0;

      return `
        <div onclick="selectAttendanceSession('${s.id}')" class="glass-card rounded-2xl p-3.5 border cursor-pointer transition-all duration-200 active:scale-95 group relative ${
          isSelected 
            ? 'border-emerald-500/80 bg-emerald-950/30 ring-2 ring-emerald-400 shadow-xl shadow-emerald-500/10' 
            : 'border-white/10 hover:border-emerald-500/40 bg-surface-elevated/70'
        }">
          <div class="flex justify-between items-start gap-1 mb-1.5">
            <span class="text-xs font-mono font-bold ${isSelected ? 'text-emerald-400 font-extrabold' : 'text-white'} flex items-center gap-1">
              <span class="material-symbols-outlined text-sm text-emerald-400">event</span>
              <span>${formattedDate}</span>
            </span>
            ${hasAttended ? `
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0">
                🟢 ${presentCount}/${activeMembersCount} (${pct}%)
              </span>
            ` : `
              <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-white/5 text-text-secondary/70 border border-white/5 shrink-0">
                Chưa ĐD
              </span>
            `}
          </div>

          <h4 class="text-xs font-bold text-white line-clamp-1 group-hover:text-emerald-300 transition-colors">${s.deTai || 'Sinh Hoạt Thờ Phượng'}</h4>
          <p class="text-[11px] text-text-secondary line-clamp-1 mt-1">
            ${s.huongDan ? `HCDT: <span class="text-white">${s.huongDan}</span>` : ''}
            ${s.toPhuTrach ? ` &bull; <span class="text-emerald-400">${s.toPhuTrach}</span>` : ''}
          </p>
        </div>
      `;
    }).join('');
  }

  function selectAttendanceSession(scheduleId) {
    const s = (state.schedules || []).find(item => String(item.id) === String(scheduleId));
    if (!s) return;

    state.attendanceFilter.selectedScheduleId = s.id;
    state.attendanceFilter.selectedDate = s.ngayNhom;
    loadAttendanceForSessionDate(s.ngayNhom);

    renderMonthlySessions();
    renderActiveSessionBanner();
    renderAttendanceList();
  }

  function loadAttendanceForSessionDate(dateStr) {
    state.liveAttendance = {};
    const formattedTarget = normalizeDateStr(dateStr);
    const existing = (state.attendances || []).filter(a => normalizeDateStr(a.ngayDiemDanh) === formattedTarget);

    if (existing.length > 0) {
      existing.forEach(a => {
        state.liveAttendance[a.thanhVienId] = {
          coMat: (a.coMat === 'CO_MAT' || a.coMat === true || a.coMat === '1' || a.coMat === 'TRUE'),
          thuocCauGoc: (a.thuocCauGoc === 'THUOC' || a.thuocCauGoc === true || a.thuocCauGoc === '1' || a.thuocCauGoc === 'TRUE'),
          soCauKT: parseInt(a.soCauKT, 10) || 0,
          ghiChu: a.ghiChu || ''
        };
      });
    } else {
      (state.members || []).forEach(m => {
        state.liveAttendance[m.id] = {
          coMat: true,
          thuocCauGoc: false,
          soCauKT: 0,
          ghiChu: ''
        };
      });
    }
  }

  function renderActiveSessionBanner() {
    const dateBadge = document.getElementById('att-active-date-badge');
    const bDate = document.getElementById('att-banner-date');
    const bStatus = document.getElementById('att-banner-status-badge');
    const bDetai = document.getElementById('att-banner-detai');
    const bHuongDan = document.getElementById('att-banner-huongdan');
    const bTo = document.getElementById('att-banner-tophutrach');
    const bDoKT = document.getElementById('att-banner-dokt');
    const bPhuTrach = document.getElementById('att-banner-phutrach');
    const bottomSaveText = document.getElementById('att-bottom-save-text');

    const curDate = state.attendanceFilter && state.attendanceFilter.selectedDate;
    if (!curDate) {
      if (dateBadge) dateBadge.textContent = 'Chưa chọn buổi nhóm';
      if (bDate) bDate.textContent = '--/--/----';
      if (bStatus) {
        bStatus.textContent = 'Chưa chọn';
        bStatus.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-white/10 text-white';
      }
      if (bDetai) bDetai.textContent = 'Vui lòng chọn 1 buổi nhóm ở danh sách phía trên';
      return;
    }

    const sDateObj = parseSessionDate(curDate);
    const formattedDate = sDateObj ? sDateObj.formatted : curDate;
    const s = (state.schedules || []).find(item => String(item.id) === String(state.attendanceFilter.selectedScheduleId)) || {
      deTai: 'Điểm danh ngày ' + formattedDate,
      ngayNhom: formattedDate,
      huongDan: 'Tự do',
      toPhuTrach: 'Tất cả',
      doKT: 'Tự do',
      phuTrach: 'BĐH'
    };

    if (dateBadge) dateBadge.textContent = `Buổi Nhóm ${formattedDate}`;
    if (bDate) bDate.textContent = `Chúa Nhật, ${formattedDate}`;
    if (bDetai) bDetai.textContent = s.deTai || 'Sinh Hoạt Thờ Phượng';
    if (bHuongDan) bHuongDan.textContent = s.huongDan || '--';
    if (bTo) bTo.textContent = s.toPhuTrach || '--';
    if (bDoKT) bDoKT.textContent = [s.doKT, s.nguoiDoKT].filter(Boolean).join(' - ') || '--';
    if (bPhuTrach) bPhuTrach.textContent = s.phuTrach || '--';
    if (bottomSaveText) bottomSaveText.textContent = `💾 Lưu Điểm Danh Buổi Nhóm Ngày ${formattedDate}`;

    // Status
    const dateAtts = (state.attendances || []).filter(a => normalizeDateStr(a.ngayDiemDanh) === formattedDate);
    if (bStatus) {
      if (dateAtts.length > 0) {
        const presentCount = dateAtts.filter(a => (a.coMat === 'CO_MAT' || a.coMat === true || a.coMat === '1' || a.coMat === 'TRUE')).length;
        bStatus.textContent = `🟢 Đã Lưu: ${presentCount} có mặt`;
        bStatus.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
      } else {
        bStatus.textContent = `⚪ Chưa Điểm Danh`;
        bStatus.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-white/10 text-white border border-white/10';
      }
    }
  }

  function renderAttendanceFilterGroup() {
    const fGroup = document.getElementById('attendance-filter-group');
    if (!fGroup) return;
    fGroup.innerHTML = `<option value="all">Tất cả tổ nhóm</option>` + 
      (state.groups || []).map(g => `<option value="${g.id}">${getGroupName(g)}</option>`).join('');
  }

  function handleAttYearChange(y) {
    state.attendanceFilter.year = parseInt(y, 10);
    renderAttendance();
  }

  function handleAttQuarterChange(q) {
    state.attendanceFilter.quarter = q;
    state.attendanceFilter.month = getMonthsForQuarter(q)[0];
    renderAttendance();
  }

  function handleAttMonthChange(m) {
    state.attendanceFilter.month = parseInt(m, 10);
    renderAttendance();
  }

  function handleAttendanceSearch(q) {
    state.attendanceFilter.searchMember = (q || '').trim();
    renderAttendanceList();
  }

  function selectNearestSession() {
    if (!state.schedules || state.schedules.length === 0) {
      showToast('Chưa có danh sách buổi nhóm nào trong năm', 'warning');
      return;
    }

    const now = new Date();
    let bestSession = state.schedules[0];
    let minDiff = Infinity;

    state.schedules.forEach(s => {
      const p = parseSessionDate(s.ngayNhom);
      if (p) {
        const sDate = new Date(p.year, p.month - 1, p.day);
        const diff = Math.abs(sDate.getTime() - now.getTime());
        if (diff < minDiff) {
          minDiff = diff;
          bestSession = s;
        }
      }
    });

    const pBest = parseSessionDate(bestSession.ngayNhom);
    if (pBest) {
      state.attendanceFilter.year = pBest.year;
      state.attendanceFilter.quarter = getQuarterFromMonth(pBest.month);
      state.attendanceFilter.month = pBest.month;
      state.attendanceFilter.selectedScheduleId = bestSession.id;
      state.attendanceFilter.selectedDate = bestSession.ngayNhom;
      loadAttendanceForSessionDate(bestSession.ngayNhom);
      renderAttendance();
      showToast(`Đã chuyển đến buổi nhóm ngày ${pBest.formatted}!`, 'success');
    }
  }

  function copyCurrentSessionZalo() {
    if (state.attendanceFilter && state.attendanceFilter.selectedScheduleId) {
      copyZaloTemplate(state.attendanceFilter.selectedScheduleId);
    } else {
      showToast('Vui lòng chọn 1 buổi nhóm trước khi sao chép mẫu Zalo', 'warning');
    }
  }

  function openCustomDateAttendanceModal() {
    const raw = prompt('Nhập ngày điểm danh (Định dạng DD/MM/YYYY hoặc YYYY-MM-DD):', new Date().toISOString().split('T')[0]);
    if (!raw) return;
    const p = parseSessionDate(raw);
    if (!p) {
      showToast('Định dạng ngày không hợp lệ. Vui lòng nhập DD/MM/YYYY!', 'error');
      return;
    }

    state.attendanceFilter.year = p.year;
    state.attendanceFilter.quarter = getQuarterFromMonth(p.month);
    state.attendanceFilter.month = p.month;
    state.attendanceFilter.selectedScheduleId = null;
    state.attendanceFilter.selectedDate = p.formatted;
    loadAttendanceForSessionDate(p.formatted);
    renderAttendance();
  }

  function setAllAttendance(coMatVal, thuocCauGocVal) {
    let list = getFilteredAttendanceMembers();
    list.forEach(m => {
      if (!state.liveAttendance[m.id]) {
        state.liveAttendance[m.id] = { coMat: false, thuocCauGoc: false, soCauKT: 0, ghiChu: '' };
      }
      if (coMatVal !== null && coMatVal !== undefined) {
        state.liveAttendance[m.id].coMat = coMatVal;
      }
      if (thuocCauGocVal !== null && thuocCauGocVal !== undefined) {
        state.liveAttendance[m.id].thuocCauGoc = thuocCauGocVal;
      }
    });

    renderAttendanceList();
  }

  function getFilteredAttendanceMembers() {
    let list = (state.members || []).filter(m => (m.trangThai || 'active') === 'active');

    // 0. Scope Filter for Tổ Trưởng
    if (state.currentRole === 'to_truong' && state.roleScopeGroupId && state.roleScopeGroupId !== 'all') {
      list = list.filter(m => String(m.toId) === String(state.roleScopeGroupId));
    }

    const fGroup = document.getElementById('attendance-filter-group');
    const groupVal = fGroup ? fGroup.value : 'all';
    if (groupVal !== 'all') {
      list = list.filter(m => String(m.toId) === String(groupVal));
    }
    const q = (state.attendanceFilter && state.attendanceFilter.searchMember) ? state.attendanceFilter.searchMember.toLowerCase() : '';
    if (q) {
      list = list.filter(m => 
        getMemberName(m).toLowerCase().includes(q) ||
        getMemberPhone(m).includes(q) ||
        getMemberCode(m).toLowerCase().includes(q)
      );
    }
    return list;
  }

  function renderAttendanceList() {
    const container = document.getElementById('attendance-members-list');
    if (!container) return;

    const list = getFilteredAttendanceMembers();
    const groupMap = {};
    state.groups.forEach(g => { groupMap[g.id] = getGroupName(g); });

    if (list.length === 0) {
      container.innerHTML = `<div class="text-center py-12 text-xs text-text-secondary">Không tìm thấy ban viên nào theo bộ lọc.</div>`;
      updateAttendanceStats(0, 0, 0);
      return;
    }

    let presentCount = 0;
    let verseCount = 0;

    container.innerHTML = list.map((m, idx) => {
      const att = state.liveAttendance[m.id] || { coMat: false, thuocCauGoc: false, soCauKT: 0, ghiChu: '' };
      if (att.coMat) presentCount++;
      if (att.thuocCauGoc) verseCount++;

      const name = getMemberName(m);
      const role = getMemberRole(m);
      const toName = groupMap[m.toId] || 'Chưa phân tổ';

      return `
        <div class="glass-card rounded-2xl p-3.5 sm:p-4 border ${att.coMat ? 'border-emerald-500/40 bg-emerald-950/15' : 'border-white/5 bg-surface-elevated/40'} flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition-all">
          <div class="flex items-center gap-3 min-w-0">
            <span class="w-7 h-7 rounded-xl bg-white/5 text-text-secondary flex items-center justify-center text-xs font-mono font-bold shrink-0">${idx + 1}</span>
            <div class="min-w-0">
              <h4 class="text-sm font-bold text-white truncate">${name}</h4>
              <p class="text-[11px] text-text-secondary">${role} &bull; <span class="text-emerald-400 font-medium">${toName}</span></p>
            </div>
          </div>

          <!-- Controls: Có mặt, Thuộc câu gốc, Số câu KT đáp, Ghi chú -->
          <div class="flex items-center gap-3.5 flex-wrap sm:flex-nowrap justify-between sm:justify-end">
            <!-- Có Mặt Toggle -->
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <span class="text-xs font-semibold ${att.coMat ? 'text-emerald-400 font-bold' : 'text-text-secondary'}">Có mặt</span>
              <div class="switch-toggle">
                <input type="checkbox" ${att.coMat ? 'checked' : ''} onchange="handleToggleLiveAttendance('${m.id}', 'coMat', this.checked)" />
                <span class="switch-slider switch-slider-green"></span>
              </div>
            </label>

            <!-- Thuộc Câu Gốc Toggle -->
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <span class="text-xs font-semibold ${att.thuocCauGoc ? 'text-sky-400 font-bold' : 'text-text-secondary'}">Thuộc câu gốc</span>
              <div class="switch-toggle">
                <input type="checkbox" ${att.thuocCauGoc ? 'checked' : ''} onchange="handleToggleLiveAttendance('${m.id}', 'thuocCauGoc', this.checked)" />
                <span class="switch-slider switch-slider-blue"></span>
              </div>
            </label>

            <!-- Số Câu KT Đáp (Điền số) -->
            <div class="flex items-center gap-1.5 bg-surface-elevated/90 px-2 py-1 rounded-xl border border-white/10" title="Số câu Kinh Thánh đáp trong giờ đố KT">
              <span class="text-[11px] font-bold text-amber-400 flex items-center gap-0.5">
                <span class="material-symbols-outlined text-[13px]">help</span>
                <span>Đáp KT:</span>
              </span>
              <input
                type="number"
                min="0"
                max="99"
                value="${att.soCauKT || 0}"
                onchange="handleLiveAttendanceSoCauKT('${m.id}', this.value)"
                class="glass-input text-center w-11 rounded-lg py-0.5 px-1 text-xs font-bold text-amber-300 font-mono"
              />
            </div>

            <!-- Ghi Chú Input -->
            <input
              type="text"
              placeholder="Ghi chú..."
              value="${att.ghiChu || ''}"
              onchange="handleLiveAttendanceNote('${m.id}', this.value)"
              class="glass-input rounded-xl px-2.5 py-1 text-xs w-full sm:w-28 text-text-secondary"
            />
          </div>
        </div>
      `;
    }).join('');

    updateAttendanceStats(presentCount, verseCount, list.length);
  }

  function handleToggleLiveAttendance(memberId, field, val) {
    if (!state.liveAttendance[memberId]) {
      state.liveAttendance[memberId] = { coMat: false, thuocCauGoc: false, soCauKT: 0, ghiChu: '' };
    }
    state.liveAttendance[memberId][field] = val;

    const list = getFilteredAttendanceMembers();
    let presentCount = 0;
    let verseCount = 0;
    list.forEach(m => {
      const att = state.liveAttendance[m.id] || { coMat: false, thuocCauGoc: false };
      if (att.coMat) presentCount++;
      if (att.thuocCauGoc) verseCount++;
    });
    updateAttendanceStats(presentCount, verseCount, list.length);
  }

  function handleLiveAttendanceSoCauKT(memberId, val) {
    if (!state.liveAttendance[memberId]) {
      state.liveAttendance[memberId] = { coMat: false, thuocCauGoc: false, soCauKT: 0, ghiChu: '' };
    }
    state.liveAttendance[memberId].soCauKT = Math.max(0, parseInt(val, 10) || 0);
  }

  function handleLiveAttendanceNote(memberId, val) {
    if (!state.liveAttendance[memberId]) {
      state.liveAttendance[memberId] = { coMat: false, thuocCauGoc: false, soCauKT: 0, ghiChu: '' };
    }
    state.liveAttendance[memberId].ghiChu = val;
  }

  function updateAttendanceStats(present, verse, total) {
    const pPct = total > 0 ? Math.round((present / total) * 100) : 0;
    const vPct = total > 0 ? Math.round((verse / total) * 100) : 0;

    const elPText = document.getElementById('att-live-present');
    const elPBar = document.getElementById('att-bar-present');
    const elVText = document.getElementById('att-live-verse');
    const elVBar = document.getElementById('att-bar-verse');

    if (elPText) elPText.textContent = `${present} / ${total} (${pPct}%)`;
    if (elPBar) elPBar.style.width = `${pPct}%`;
    if (elVText) elVText.textContent = `${verse} / ${total} (${vPct}%)`;
    if (elVBar) elVBar.style.width = `${vPct}%`;
  }

  async function handleSaveAttendance() {
    const rawDate = state.attendanceFilter && state.attendanceFilter.selectedDate;
    if (!rawDate) {
      showToast('Vui lòng chọn 1 buổi nhóm để điểm danh!', 'warning');
      return;
    }

    const dateObj = parseSessionDate(rawDate);
    const formattedDate = dateObj ? dateObj.formatted : normalizeDateStr(rawDate);

    const allActiveMembers = (state.members || []).filter(m => (m.trangThai || 'active') === 'active');
    const records = allActiveMembers.map(m => {
      const att = state.liveAttendance[m.id] || { coMat: false, thuocCauGoc: false, soCauKT: 0, ghiChu: '' };
      return {
        thanhVienId: m.id,
        coMat: att.coMat,
        thuocCauGoc: att.thuocCauGoc,
        soCauKT: att.soCauKT || 0,
        ghiChu: att.ghiChu || ''
      };
    });

    if (records.length === 0) {
      showToast('Không có ban viên nào để lưu điểm danh', 'warning');
      return;
    }

    showLoading(true);
    try {
      const payload = {
        ngayDiemDanh: formattedDate,
        records: records,
        nguoiDiemDanh: 'Thư Ký'
      };

      const res = await runGAS('apiSaveAttendance', payload, state.activeSheetId);
      if (res && res.success) {
        showToast(res.message || `Đã lưu điểm danh ngày ${formattedDate} thành công!`, 'success');
        
        // In-memory state sync: Remove old records for this date and push saved records
        state.attendances = (state.attendances || []).filter(a => normalizeDateStr(a.ngayDiemDanh) !== formattedDate);
        if (res.records && Array.isArray(res.records)) {
          state.attendances.push(...res.records);
        } else {
          records.forEach(r => {
            state.attendances.push({
              id: 'att_' + Date.now() + '_' + r.thanhVienId,
              ngayDiemDanh: formattedDate,
              thanhVienId: r.thanhVienId,
              coMat: r.coMat ? 'CO_MAT' : 'VANG',
              thuocCauGoc: r.thuocCauGoc ? 'THUOC' : 'CHUA_THUOC',
              soCauKT: r.soCauKT || 0,
              ghiChu: r.ghiChu || ''
            });
          });
        }

        state.kpis.total_attendance_records = state.attendances.length;
        renderMonthlySessions();
        renderActiveSessionBanner();
        renderDashboard();
      } else {
        showToast(res.message || 'Lỗi lưu điểm danh', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function renderAttendanceReport() {
    const container = document.getElementById('attendance-report-content');
    if (!container) return;

    const select = document.getElementById('report-att-quarter');
    let qVal = select ? select.value : 'current';
    if (qVal === 'current') {
      qVal = state.attendanceFilter ? state.attendanceFilter.quarter : 'I';
    }

    // Filter schedules for target quarter
    let targetSchedules = [...(state.schedules || [])];
    if (qVal !== 'all') {
      targetSchedules = targetSchedules.filter(s => String(s.quy || 'I').toUpperCase() === String(qVal).toUpperCase());
    }

    const sessionDates = new Set();
    targetSchedules.forEach(s => {
      const p = parseSessionDate(s.ngayNhom);
      if (p) sessionDates.add(p.formatted);
    });

    const totalSessions = sessionDates.size || 1;

    // Filter attendances for these dates
    const relevantAtts = (state.attendances || []).filter(a => sessionDates.has(normalizeDateStr(a.ngayDiemDanh)));

    const groupMap = {};
    state.groups.forEach(g => { groupMap[g.id] = getGroupName(g); });

    // Aggregate by Member
    const memberStats = {};
    (state.members || []).filter(m => (m.trangThai || 'active') === 'active').forEach(m => {
      memberStats[m.id] = {
        member: m,
        name: getMemberName(m),
        toName: groupMap[m.toId] || 'Chưa phân tổ',
        toId: m.toId || 'unassigned',
        presentCount: 0,
        verseCount: 0,
        quizScore: 0
      };
    });

    relevantAtts.forEach(a => {
      if (memberStats[a.thanhVienId]) {
        if (a.coMat === 'CO_MAT' || a.coMat === true || a.coMat === '1' || a.coMat === 'TRUE') {
          memberStats[a.thanhVienId].presentCount++;
        }
        if (a.thuocCauGoc === 'THUOC' || a.thuocCauGoc === true || a.thuocCauGoc === '1' || a.thuocCauGoc === 'TRUE') {
          memberStats[a.thanhVienId].verseCount++;
        }
        memberStats[a.thanhVienId].quizScore += (parseInt(a.soCauKT, 10) || 0);
      }
    });

    const membersArray = Object.values(memberStats);

    // 1. Top Chuyên Cần (Sorted by presentCount desc)
    const topAttendance = [...membersArray].sort((a, b) => b.presentCount - a.presentCount).slice(0, 10);

    // 2. Top Vua Đố KT (Sorted by quizScore desc)
    const topQuiz = [...membersArray].filter(m => m.quizScore > 0).sort((a, b) => b.quizScore - a.quizScore).slice(0, 10);

    // 3. Group Ranking
    const groupStats = {};
    state.groups.forEach(g => {
      groupStats[g.id] = { id: g.id, name: getGroupName(g), totalMembers: 0, totalPresents: 0 };
    });
    membersArray.forEach(m => {
      if (groupStats[m.toId]) {
        groupStats[m.toId].totalMembers++;
        groupStats[m.toId].totalPresents += m.presentCount;
      }
    });

    const groupRankings = Object.values(groupStats).map(g => {
      const maxPossible = g.totalMembers * totalSessions;
      const pct = maxPossible > 0 ? Math.round((g.totalPresents / maxPossible) * 100) : 0;
      return { ...g, pct };
    }).sort((a, b) => b.pct - a.pct);

    container.innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <!-- Box 1: Bảng Vàng Chuyên Cần -->
        <div class="glass-card rounded-3xl p-5 border border-emerald-500/30 bg-emerald-950/15 space-y-3 shadow-lg">
          <div class="flex items-center gap-2 pb-2 border-b border-white/10">
            <span class="material-symbols-outlined text-xl text-emerald-400">workspace_premium</span>
            <h4 class="text-sm font-bold text-white">🥇 Bảng Vàng Chuyên Cần</h4>
          </div>
          <div class="space-y-2">
            ${topAttendance.length === 0 ? `<div class="text-center py-8 text-xs text-text-secondary italic">Chưa có dữ liệu điểm danh.</div>` : topAttendance.map((m, idx) => {
              const pct = Math.round((m.presentCount / totalSessions) * 100);
              const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
              return `
                <div class="flex items-center justify-between p-2 rounded-xl bg-surface-elevated/70 text-xs">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="font-bold w-6 text-center shrink-0 ${idx < 3 ? 'text-base' : 'text-text-secondary text-[11px] font-mono'}">${medal}</span>
                    <div class="min-w-0">
                      <div class="font-bold text-white truncate">${m.name}</div>
                      <div class="text-[10px] text-text-secondary">${m.toName}</div>
                    </div>
                  </div>
                  <div class="text-right shrink-0 font-mono">
                    <div class="font-bold text-emerald-400">${m.presentCount}/${totalSessions}</div>
                    <div class="text-[10px] text-text-secondary">${pct}%</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Box 2: Vua Đố Kinh Thánh -->
        <div class="glass-card rounded-3xl p-5 border border-amber-500/30 bg-amber-950/15 space-y-3 shadow-lg">
          <div class="flex items-center gap-2 pb-2 border-b border-white/10">

            ${topQuiz.length === 0 ? `<div class="text-center py-8 text-xs text-text-secondary italic">Chưa ghi nhận số câu Kinh Thánh đáp.</div>` : topQuiz.map((m, idx) => {
              const medal = idx === 0 ? '👑' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
              return `
                <div class="flex items-center justify-between p-2 rounded-xl bg-surface-elevated/70 text-xs">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="font-bold w-6 text-center shrink-0 ${idx < 3 ? 'text-base' : 'text-text-secondary text-[11px] font-mono'}">${medal}</span>

                    <div class="text-[10px] text-text-secondary">Thuộc ${m.verseCount} câu gốc</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Box 3: Thi Đua Tổ Nhóm -->
        <div class="glass-card rounded-3xl p-5 border border-sky-500/30 bg-sky-950/15 space-y-3 shadow-lg">
          <div class="flex items-center gap-2 pb-2 border-b border-white/10">
            <span class="material-symbols-outlined text-xl text-sky-400">groups_3</span>
            <h4 class="text-sm font-bold text-white">👥 Thi Đua Tổ Nhóm</h4>

          <div class="space-y-2.5">
            ${groupRankings.length === 0 ? `<div class="text-center py-8 text-xs text-text-secondary italic">Chưa có tổ nhóm.</div>` : groupRankings.map((g, idx) => {
              const medal = idx === 0 ? '🏆' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
              return `
                <div class="p-3 rounded-2xl bg-surface-elevated/70 space-y-1.5">
                  <div class="flex justify-between items-center text-xs">
                    <span class="font-bold text-white flex items-center gap-1.5">
                      <span>${medal}</span>
                      <span>${g.name}</span>

                    <span class="font-bold text-sky-400 font-mono">${g.pct}%</span>
                  </div>

                  </div>
                  <div class="flex justify-between items-center text-[10px] text-text-secondary">
                    <span>${g.totalMembers} ban viên</span>

        </div>
      </div>

  }

  async function handleSaveGroup(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('group-id').value || null,
      tenTo: document.getElementById('group-tento').value.trim(),
      maTo: document.getElementById('group-mato').value.trim(),
      toTruong: document.getElementById('group-totruong').value.trim(),
      toPho: document.getElementById('group-topho').value.trim(),
      lichSinhHoat: document.getElementById('group-lichnhom').value.trim(),
      diaDiem: document.getElementById('group-diadiem').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiSaveGroup', payload, state.activeSheetId);
      if (res && res.success) {
        showToast('Lưu tổ nhóm thành công!', 'success');
        closeModal('modal-group');
        const saved = (res.data && res.data.id) ? res.data : { ...payload, id: (res.data && res.data.id) || payload.id || ('id_' + Date.now()) };
        upsertById(state.groups, saved);
        state.kpis.group_count = state.groups.length;
        renderGroups();
        renderMembers();
        renderDashboard();
      } else {
        showToast(res.message || 'Lỗi lưu tổ', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }

    if (!confirm('Bạn có chắc muốn xóa tổ nhóm này?')) return;

    try {
      const res = await runGAS('apiDeleteGroup', id, state.activeSheetId);
      if (res && res.success) {
        showToast('Đã xóa tổ nhóm!', 'info');
        removeById(state.groups, id);

        renderGroups();

        renderDashboard();
      } else {
        showToast(res.message || 'Không thể xóa', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function openAddTransactionModal(loai) {
    document.getElementById('form-tx').reset();
    document.getElementById('tx-loai').value = loai;
    document.getElementById('modal-tx-title').innerHTML = loai === 'THU' 
      ? `<span class="material-symbols-outlined text-emerald-400">arrow_downward</span> Lập Phiếu Thu Quỹ / Dâng Hiến`
      : `<span class="material-symbols-outlined text-rose-400">arrow_upward</span> Lập Phiếu Chi Quỹ`;
    openModal('modal-transaction');
  }

  async function handleSaveTransaction(e) {
    e.preventDefault();
    const payload = {
      loaiGD: document.getElementById('tx-loai').value,
      hangMuc: document.getElementById('tx-hangmuc').value.trim(),
      soTien: document.getElementById('tx-sotien').value,
      nguoiNopNhan: document.getElementById('tx-nguoinopnhan').value.trim(),
      ghiChu: document.getElementById('tx-ghichu').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiAddTransaction', payload, state.activeSheetId);
      if (res && res.success) {
        showToast('Lưu phiếu thành công!', 'success');
        closeModal('modal-transaction');
        const saved = (res.data && res.data.id) ? res.data : { ...payload, id: (res.data && res.data.id) || ('id_' + Date.now()), ngayGD: new Date().toLocaleDateString('vi-VN') };
        upsertById(state.transactions, saved);

        let totalBalance = 0;
        state.transactions.forEach(t => {
          const amount = Number(t.soTien) || 0;
          const type = (t.loaiGD || '').toUpperCase();
          if (type === 'THU') totalBalance += amount;
          else if (type === 'CHI') totalBalance -= amount;
        });
        state.kpis.total_balance = totalBalance;
        renderFinance();
        renderDashboard();
      } else {
        showToast(res.message || 'Lỗi lưu giao dịch', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function deleteTransaction(id) {
    if (!confirm('Bạn có chắc muốn xóa giao dịch này?')) return;
    showLoading(true);
    try {
      const res = await runGAS('apiDeleteTransaction', id, state.activeSheetId);
      if (res && res.success) {
        showToast('Đã xóa giao dịch!', 'info');
        removeById(state.transactions, id);
        let totalBalance = 0;
        state.transactions.forEach(t => {
          const amount = Number(t.soTien) || 0;
          const type = (t.loaiGD || '').toUpperCase();
          if (type === 'THU') totalBalance += amount;
          else if (type === 'CHI') totalBalance -= amount;
        });
        state.kpis.total_balance = totalBalance;
        renderFinance();
        renderDashboard();
      } else {
        showToast(res.message || 'Không thể xóa', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function copyZaloTemplate(scheduleId) {
    const s = (state.schedules || []).find(item => String(item.id) === String(scheduleId));
    if (!s) {
      showToast('Không tìm thấy thông tin buổi nhóm', 'error');
      return;
    }

    const theme = getThemeForQuarter(s.quy || 'I');
    const banTitle = state.banNganhTitle || 'Thanh Tráng';
    const gioNhom = s.gioNhom || '16h00';
    const ngayNhom = s.ngayNhom || '';
    const baiHat = s.baiHatTonVinh || theme.baiHatChuDe || 'DÂNG CHÚA LỜI NGỢI CA';
    const trangPhuc = s.trangPhuc || 'Nam áo sơ mi + cavat\nNữ áo dài tự do';
    const cauGoc = s.cauGoc || theme.cauGoc || '';
    const noiDungCauGoc = s.noiDungCauGoc || theme.noiDungCauGoc || '';
    const doKtText = s.doKT ? s.doKT : 'Tự do';
    const nguoiDoKtText = s.nguoiDoKT ? `   ${s.nguoiDoKT}` : '';

    const text = `@All   📣 THÔNG BÁO SINH HOẠT 📣
Kính gửi các Anh Chị Em trong ban ${banTitle} chương trình nhóm lại
Chúa Nhật ${ngayNhom}

💒 7h30 : HỌC TRƯỜNG CHÚA NHẬT

💒 8h30 : THỜ PHƯỢNG CHÚA CHUNG HỘI THÁNH
- Ban ${banTitle} Tôn Vinh Chúa: "${baiHat}"
- Trang phục: ${trangPhuc}

💒 ${gioNhom}: CHƯƠNG TRÌNH THỜ PHƯỢNG & SINH HOẠT BAN ${banTitle.toUpperCase()}
- Chủ Đề: ${s.deTai || 'SINH HOẠT THỜ PHƯỢNG'}
- Giảng luận/Chia sẻ: ${s.dienGia || s.phuTrach || 'BĐH'}
- Tổ phụ trách: ${s.toPhuTrach || 'BĐH'}
- HĐCT: ${s.huongDan || 'Ban Điều Hành'}
- Đố Kinh Thánh: ${doKtText}${nguoiDoKtText}
${s.amNhac ? `- Âm nhạc: ${s.amNhac}\n` : ''}${s.mayChieu ? `- Máy chiếu: ${s.mayChieu}\n` : ''}${s.tiepTan ? `- Ban Tiếp tân: ${s.tiepTan}\n` : ''}- Câu gốc: ${cauGoc}
“${noiDungCauGoc}”

Kính mời Quý Anh Chị Em tham dự đầy đủ & đúng giờ! ❤️`;

    // Copy to clipboard
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Đã sao chép thông báo Zalo ngày ${ngayNhom}! Hãy dán vào Zalo ngay.`, 'success');
      }).catch(err => {
        fallbackCopyText(text, ngayNhom);
      });
    } else {
      fallbackCopyText(text, ngayNhom);
    }
  }

  function fallbackCopyText(text, ngay) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(`Đã sao chép thông báo Zalo ngày ${ngay}!`, 'success');
    } catch (e) {
      showToast('Không thể sao chép tự động, vui lòng thử lại', 'error');
    }
    document.body.removeChild(ta);
  }

  async function handleSaveSchedule(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('schedule-id').value || null,
      ngayNhom: document.getElementById('sch-ngay').value.trim(),
      quy: document.getElementById('sch-quy').value,
      gioNhom: document.getElementById('sch-gio').value.trim(),
      deTai: document.getElementById('sch-detai').value.trim(),
      cauGoc: document.getElementById('sch-caugoc').value.trim(),
      noiDungCauGoc: document.getElementById('sch-noidungcaugoc').value.trim(),
      doKT: document.getElementById('sch-dokt').value.trim(),
      nguoiDoKT: document.getElementById('sch-nguoidokt').value.trim(),
      huongDan: document.getElementById('sch-huongdan').value.trim(),
      dienGia: document.getElementById('sch-diengia').value.trim(),
      phuTrach: document.getElementById('sch-diengia').value.trim(),
      amNhac: document.getElementById('sch-amnhac').value.trim(),
      mayChieu: document.getElementById('sch-maychieu').value.trim(),
      tiepTan: document.getElementById('sch-tieptan').value.trim(),
      toPhuTrach: document.getElementById('sch-tophutrach').value.trim(),
      baiHatTonVinh: document.getElementById('sch-baihat').value.trim(),
      trangPhuc: document.getElementById('sch-trangphuc').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiSaveSchedule', payload, state.activeSheetId);
      if (res && res.success) {
        showToast('Lưu buổi sinh hoạt thành công!', 'success');
        closeModal('modal-schedule');
        const saved = (res.data && res.data.id) ? res.data : { ...payload, id: (res.data && res.data.id) || payload.id || ('sch_' + Date.now()) };
        upsertById(state.schedules, saved);
        renderSchedule();
      } else {
        showToast(res.message || 'Lỗi lưu lịch', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

      showToast(err.message, 'error');
    } finally {
      showLoading(false);

  function getPrintOptions() {
    const rangeSelect = document.getElementById('print-cfg-range');
    let range = rangeSelect ? rangeSelect.value : 'current';
    if (range === 'current') {
      range = state.selectedScheduleQuarter !== 'all' ? state.selectedScheduleQuarter : 'I';
    }

    const orientSelect = document.getElementById('print-cfg-orientation');
    const orientation = orientSelect ? orientSelect.value : 'landscape';

    const churchName = (document.getElementById('print-cfg-church-name')?.value || 'HỘI THÁNH TIN LÀNH VIỆT NAM').trim();
    const branchName = (document.getElementById('print-cfg-branch-name')?.value || `BAN ${(state.banNganhTitle || 'THANH TRÁNG').toUpperCase()} - CHI HỘI THỦ THIÊM`).trim();
    const timeStr = (document.getElementById('print-cfg-time')?.value || '16h00 Chiều Chúa Nhật').trim();
    const showTheme = document.getElementById('print-cfg-show-theme') ? document.getElementById('print-cfg-show-theme').checked : true;
    const showSignatures = document.getElementById('print-cfg-show-signatures') ? document.getElementById('print-cfg-show-signatures').checked : true;

    return { range, orientation, churchName, branchName, timeStr, showTheme, showSignatures };
  }

    const activeQ = opts.range;
    const theme = getThemeForQuarter(activeQ !== 'all' ? activeQ : 'NAM');

    const titleText = opts.range === 'all' 
      ? `LỊCH SINH HOẠT CẢ NĂM ${year}` 
      : `LỊCH SINH HOẠT QUÝ ${opts.range} - NĂM ${year}`;

    const banName = state.banNganhTitle || 'Thanh Tráng';

    let tableRowsHTML = '';

      tableRowsHTML = `<tr><td colspan="9" style="text-align:center; padding: 20px; color: #64748b; font-style: italic;">Chưa có dữ liệu buổi sinh hoạt nào cho quý này.</td></tr>`;
    } else {
      tableRowsHTML = sessions.map((s, idx) => {
        const isSpecialEvent = (s.deTai || '').toUpperCase().includes('NGHỈ') || 
                               (s.deTai || '').toUpperCase().includes('DÃ NGOẠI') || 
                               (s.deTai || '').toUpperCase().includes('LIÊN BAN');

        if (isSpecialEvent && !s.huongDan && !s.phuTrach && !s.dienGia) {

              <td style="text-align: center; font-weight: bold; border: 1px solid #475569; padding: 5px;">${idx + 1}</td>
              <td style="text-align: center; font-weight: bold; border: 1px solid #475569; padding: 5px;">${s.ngayNhom || '--'}</td>
              <td colspan="7" style="text-align: center; text-transform: uppercase; letter-spacing: 1px; color: #92400e; border: 1px solid #475569; padding: 5px;">${s.deTai}</td>
            </tr>

        const doKtFormatted = [s.doKT, s.nguoiDoKT].filter(Boolean).join(' - ') || '--';
        const dienGiaFormatted = s.dienGia || s.phuTrach || '--';

        const printRolesHtml = [
          s.amNhac ? '🎹 ' + s.amNhac : '',
          s.mayChieu ? '🎛️ ' + s.mayChieu : '',

            <td style="font-style: italic; color: #0369a1; border: 1px solid #475569; padding: 5px 4px;">${s.cauGoc || '--'}</td>
            <td style="color: #334155; border: 1px solid #475569; padding: 5px 4px;">${doKtFormatted}</td>
            <td style="border: 1px solid #475569; padding: 5px 4px;">${s.huongDan || '--'}</td>
