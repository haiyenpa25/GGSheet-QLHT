            <td style="font-size: 8pt; border: 1px solid #475569; padding: 5px 3px; color: #334155;">
              ${printRolesHtml}

          </tr>
        `;
      }).join('');

    return `

            <div style="font-size: 11pt; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; color: #0f172a;">${opts.churchName}</div>
            <div style="font-size: 11pt; font-weight: bold; color: #047857; margin-top: 2px;">${opts.branchName}</div>
          </div>
          <div style="text-align: right;">

        <!-- Khung Chủ Đề & Lời Chúa -->

            <div style="font-size: 10pt; font-weight: bold; text-transform: uppercase; color: #0f172a;">
              CHỦ ĐỀ ${activeQ !== 'all' ? `QUÝ ${activeQ}` : `NĂM ${year}`}: <span style="color: #047857; font-size: 11pt;">${theme.chuDe || 'KỶ LUẬT THUỘC LINH'}</span>
            </div>
            <div style="font-size: 9.5pt; font-style: italic; color: #334155; margin-top: 4px;">
              “${theme.noiDungCauGoc || 'Hãy tập tành sự tin kính; vì sự tập tành thân thể ích lợi ít bề, còn sự tin kính ích cho mọi sự.'}” &mdash; <strong style="color: #0f172a; font-style: normal;">${theme.cauGoc || 'I Ti-mô-thê 4:7-8'}</strong>
            </div>
          </div>
        ` : ''}

        <!-- Bảng Phân Công Lịch Sinh Hoạt -->
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 8.5pt;">
          <thead>
            <tr style="background-color: #e2e8f0; color: #0f172a;">
              <th style="border: 1px solid #334155; padding: 6px 2px; text-align: center; width: 3%;">STT</th>
              <th style="border: 1px solid #334155; padding: 6px 3px; text-align: center; width: 9%;">NGÀY</th>
              <th style="border: 1px solid #334155; padding: 6px 4px; text-align: left; width: 18%;">ĐỀ TÀI</th>
              <th style="border: 1px solid #334155; padding: 6px 4px; text-align: left; width: 14%;">CÂU GỐC</th>
              <th style="border: 1px solid #334155; padding: 6px 4px; text-align: left; width: 13%;">ĐỐ KINH THÁNH</th>
              <th style="border: 1px solid #334155; padding: 6px 4px; text-align: left; width: 11%;">HƯỚNG DẪN</th>
              <th style="border: 1px solid #334155; padding: 6px 3px; text-align: center; width: 9%;">TỔ P.TRÁCH</th>
              <th style="border: 1px solid #334155; padding: 6px 4px; text-align: left; width: 11%;">GIẢNG LUẬN</th>
              <th style="border: 1px solid #334155; padding: 6px 3px; text-align: left; width: 12%;">NHÂN SỰ PHỤC VỤ</th>
            </tr>
          </thead>
          <tbody>
            ${tableRowsHTML}
          </tbody>
        </table>

        <!-- Chân Trang & Ký Tên -->
        ${opts.showSignatures ? `
          <div style="page-break-inside: avoid; margin-top: 15px; padding-top: 8px;">
            <div style="text-align: center; font-style: italic; font-size: 9pt; color: #475569; margin-bottom: 15px;">
              “Kính chúc Quý Anh Chị Em một tuần mới tràn đầy ơn phước &amp; sự dẫn dắt của Chúa Cứu Thế Giê-xu!”
            </div>

            <div style="display: flex; justify-content: space-between; text-align: center; padding: 0 40px; font-size: 9.5pt;">
              <div>
                <div style="font-weight: bold; text-transform: uppercase;">TRƯỞNG BAN ${banName.toUpperCase()}</div>
                <div style="font-size: 8pt; color: #64748b; font-style: italic; margin-top: 2px;">(Ký &amp; ghi rõ họ tên)</div>
                <div style="height: 55px;"></div>
              </div>

              <div>
                <div style="font-weight: bold; text-transform: uppercase;">QUẢN NHIỆM HỘI THÁNH</div>
                <div style="font-size: 8pt; color: #64748b; font-style: italic; margin-top: 2px;">(Duyệt &amp; ký tên)</div>
                <div style="height: 55px;"></div>
              </div>
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }

  function updatePrintPreview() {
    const previewContainer = document.getElementById('print-preview-content');
    if (!previewContainer) return;
    const opts = getPrintOptions();
    previewContainer.innerHTML = buildPrintScheduleHTML(opts);
  }

  function triggerPrintScheduleNow() {
    const opts = getPrintOptions();
    const printContainer = document.getElementById('print-schedule-container');
    if (printContainer) {
      printContainer.innerHTML = buildPrintScheduleHTML(opts);
    }

    // Dynamic @page orientation rule
    let dynStyle = document.getElementById('dynamic-print-orientation-style');
    if (!dynStyle) {
      dynStyle = document.createElement('style');
      dynStyle.id = 'dynamic-print-orientation-style';
      document.head.appendChild(dynStyle);
    }

    if (opts.orientation === 'portrait') {
      dynStyle.innerHTML = `@media print { @page { size: portrait; margin: 8mm 10mm; } }`;
    } else if (opts.orientation === 'a5') {
      dynStyle.innerHTML = `@media print { @page { size: A5 landscape; margin: 6mm 8mm; } }`;
    } else {
      dynStyle.innerHTML = `@media print { @page { size: landscape; margin: 6mm 8mm; } }`;
    }

    closeModal('modal-print-schedule');
    setTimeout(() => {
      window.print();
    }, 200);
  }

    openPrintScheduleModal();

  function filterVisitationsByStatus(status) {
    state.filterVisStatus = status;
    document.querySelectorAll('.vis-tab-btn').forEach(btn => {
      if (btn.getAttribute('data-status') === status) {
        btn.className = 'vis-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 transition-all shrink-0';
      } else {
        btn.className = 'vis-tab-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-text-secondary hover:text-white hover:bg-white/5 border border-transparent transition-all shrink-0';
      }
    });
    renderVisitations();
  }

  function filterVisitationsByPriority(priority) {
    state.filterVisPriority = priority;
    const priSelect = document.getElementById('vis-filter-priority');
    if (priSelect) priSelect.value = priority;
    renderVisitations();
  }

  function renderVisitations() {
    const container = document.getElementById('visitations-list-container');
    const badge = document.getElementById('vis-active-count-badge');
    const memberSelect = document.getElementById('vis-thanhvien-id');
    if (memberSelect) {
      memberSelect.innerHTML = `<option value="">-- Chọn ban viên --</option>` + 
        (state.members || []).map(m => `<option value="${m.id}">${getMemberName(m)} (${getMemberRole(m)})</option>`).join('');
    }

    if (!container) return;

    let list = state.visits || [];

    // Filter by Scope (Role Tổ Trưởng)
    if (state.currentRole === 'to_truong' && state.roleScopeGroupId && state.roleScopeGroupId !== 'all') {
      const groupMemberIds = new Set((state.members || []).filter(m => String(m.toId) === String(state.roleScopeGroupId)).map(m => String(m.id)));
      list = list.filter(v => groupMemberIds.has(String(v.thanhVienId)));
    }

    // Filter by Status
    if (state.filterVisStatus && state.filterVisStatus !== 'all') {
      list = list.filter(v => (v.trangThai || 'CHUA_XU_LY').toUpperCase() === state.filterVisStatus.toUpperCase());
    }

    // Filter by Priority
    if (state.filterVisPriority && state.filterVisPriority !== 'all') {
      list = list.filter(v => (v.mucDoUuTien || 'BINH_THUONG').toUpperCase() === state.filterVisPriority.toUpperCase());
    }

    // Filter by Search Query
    if (state.searchVis) {
      const q = state.searchVis.toLowerCase();
      const memberMap = {};
      state.members.forEach(m => { memberMap[m.id] = getMemberName(m); });
      list = list.filter(v => {
        const mName = (memberMap[v.thanhVienId] || '').toLowerCase();
        return mName.includes(q) ||
          (v.nguoiTham || '').toLowerCase().includes(q) ||
          (v.noiDungCauNguyen || '').toLowerCase().includes(q) ||
          (v.ketQua || '').toLowerCase().includes(q);
      });
    }

    if (badge) badge.textContent = `${list.length} case chăm sóc`;

    if (list.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 glass-card rounded-3xl p-12 text-center text-xs text-text-secondary space-y-3">
          <span class="material-symbols-outlined text-4xl text-pink-400/60">volunteer_activism</span>
          <p class="font-medium text-sm text-white">Không có case chăm sóc nào</p>
          <p>Bấm nút <strong>"+ Tạo Case Chăm Sóc"</strong> để ghi nhận trường hợp cần quan tâm.</p>
        </div>
      `;
      return;
    }

    const memberMap = {};
    const memberPhoneMap = {};
    state.members.forEach(m => {
      memberMap[m.id] = getMemberName(m);
      memberPhoneMap[m.id] = cleanPhoneNumber(getMemberPhone(m));
    });

    container.innerHTML = list.map(v => {
      const mName = memberMap[v.thanhVienId] || 'Ban viên';
      const cleanPhone = memberPhoneMap[v.thanhVienId] || '';
      const priority = (v.mucDoUuTien || 'BINH_THUONG').toUpperCase();
      const status = (v.trangThai || 'CHUA_XU_LY').toUpperCase();

      const priorityBadge = priority === 'KHAN_CAP'
        ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-500/20 text-rose-300 border border-rose-500/40">🔴 Khẩn Cấp</span>`
        : priority === 'QUAN_TAM'
        ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-500/20 text-amber-300 border border-amber-500/40">🟡 Quan Tâm</span>`
        : `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-white/10 text-text-secondary border border-white/10">⚪ Bình Thường</span>`;

      const statusColors = {
        'CHUA_XU_LY': 'bg-rose-500/20 text-rose-300 border-rose-500/30',
        'DANG_THEO_DOI': 'bg-amber-500/20 text-amber-300 border-amber-500/30',
        'DA_CHAM_SOC': 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',
        'CAN_TAI_THAM': 'bg-purple-500/20 text-purple-300 border-purple-500/30'
      };

      const statusLabels = {
        'CHUA_XU_LY': '🔴 Chưa Xử Lý',
        'DANG_THEO_DOI': '🟡 Đang Theo Dõi',
        'DA_CHAM_SOC': '🟢 Đã Chăm Sóc',
        'CAN_TAI_THAM': '🟠 Cần Tái Thăm'
      };

      return `
        <div class="glass-card rounded-3xl p-5 border border-white/10 hover:border-pink-500/30 flex flex-col justify-between space-y-3 shadow-lg transition-all">
          <div>
            <div class="flex justify-between items-start gap-2">
              <div class="space-y-1 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  ${priorityBadge}

  async function handleQuickUpdateVisStatus(id, newStatus) {
    const v = (state.visits || []).find(item => String(item.id) === String(id));
    if (!v) return;

    v.trangThai = newStatus;
    showLoading(true);
    try {
      await runGAS('apiSaveVisitation', v, state.activeSheetId);
      showToast('Đã cập nhật trạng thái case chăm sóc!', 'success');
      renderVisitations();
      renderDashboard();
      updateNotificationBadge();

      showToast(e.message, 'error');
    } finally {
      showLoading(false);

  async function handleSaveVisitation(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('vis-id').value || null,
      thanhVienId: document.getElementById('vis-thanhvien-id').value,
      ngayTham: document.getElementById('vis-ngaytham').value,
      nguoiTham: document.getElementById('vis-nguoitham').value.trim(),
      hinhThuc: document.getElementById('vis-hinhthuc').value,
      mucDoUuTien: document.getElementById('vis-mucdouutien').value,
      trangThai: document.getElementById('vis-trangthai').value,
      hanChot: document.getElementById('vis-hanchot').value,
      noiDungCauNguyen: document.getElementById('vis-noidung').value.trim(),
      ketQua: document.getElementById('vis-ketqua').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiSaveVisitation', payload, state.activeSheetId);
      if (res && res.success) {
        showToast('Đã lưu phiếu chăm sóc thành công!', 'success');
        closeModal('modal-visitation');
        const saved = (res.data && res.data.id) ? res.data : { ...payload, id: (res.data && res.data.id) || payload.id || ('vis_' + Date.now()) };
        upsertById(state.visits, saved);
        state.kpis.total_visits = state.visits.length;
        renderVisitations();
        renderDashboard();
        updateNotificationBadge();
      } else {
        showToast(res.message || 'Lỗi lưu phiếu chăm sóc', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function deleteVisitation(id) {
    if (!confirm('Bạn có chắc muốn xóa phiếu chăm sóc này?')) return;
    showLoading(true);
    try {
      const res = await runGAS('apiDeleteVisitation', id, state.activeSheetId);
      if (res && res.success) {
        showToast('Đã xóa phiếu chăm sóc!', 'info');
        removeById(state.visits, id);
        state.kpis.total_visits = state.visits.length;
        renderVisitations();
        renderDashboard();
        updateNotificationBadge();
      } else {
        showToast(res.message || 'Không thể xóa', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function initRoleAndScope() {
    const savedRole = localStorage.getItem('qlht_user_role') || 'admin';
    state.currentRole = savedRole;
    const roleSelect = document.getElementById('user-role-select');
    if (roleSelect) roleSelect.value = savedRole;

    const groupSelect = document.getElementById('role-group-filter-select');
    if (groupSelect) {
      groupSelect.innerHTML = `<option value="all">👥 Mọi Tổ</option>` +
        (state.groups || []).map(g => `<option value="${g.id}">Tổ: ${getGroupName(g)}</option>`).join('');
      const savedGrp = localStorage.getItem('qlht_role_group_id') || 'all';
      state.roleScopeGroupId = savedGrp;
      groupSelect.value = savedGrp;

      if (savedRole === 'to_truong') {
        groupSelect.classList.remove('hidden');
      } else {
        groupSelect.classList.add('hidden');
      }
    }

    applyRoleConstraints();

  function handleRoleChange(role) {
    state.currentRole = role;
    localStorage.setItem('qlht_user_role', role);

    const groupSelect = document.getElementById('role-group-filter-select');
    if (role === 'to_truong') {
      if (groupSelect) {
        groupSelect.classList.remove('hidden');
        if (state.groups && state.groups.length > 0 && groupSelect.value === 'all') {
          groupSelect.value = state.groups[0].id;
          state.roleScopeGroupId = state.groups[0].id;
        }
      }
    } else {
      if (groupSelect) groupSelect.classList.add('hidden');
      state.roleScopeGroupId = 'all';
    }

    applyRoleConstraints();
    renderMembers();
    renderAttendanceList();
    renderVisitations();
    showToast(`Đã chuyển vai trò: ${role === 'admin' ? '👑 Trưởng Ban' : role === 'thu_ky' ? '✍️ Thư Ký' : role === 'thu_quy' ? '💰 Thủ Quỹ' : '👥 Tổ Trưởng'}`, 'info');
  }

  function handleRoleGroupFilterChange(groupId) {
    state.roleScopeGroupId = groupId;
    localStorage.setItem('qlht_role_group_id', groupId);
    renderMembers();
    renderAttendanceList();
    renderVisitations();
  }

  function applyRoleConstraints() {
    const role = state.currentRole || 'admin';
    const finNavs = document.querySelectorAll('[data-page="finance"]');
    
    if (role === 'thu_ky') {
      finNavs.forEach(el => el.classList.add('opacity-40', 'pointer-events-none'));

  function updateNotificationBadge() {
    const badge = document.getElementById('notif-badge-count');
    if (!badge) return;

    let count = 0;

    // 1. Absences >= 2
    const allAtt = state.attendances || [];
    const recentDates = [...new Set(allAtt.map(a => a.ngayDiemDanh))].sort().reverse().slice(0, 4);
    let absentCount = 0;
    if (recentDates.length >= 2) {
      (state.members || []).forEach(m => {
        if ((m.trangThai || 'active') !== 'active') return;
        let c = 0;
        for (let d of recentDates) {
          const rec = allAtt.find(a => a.ngayDiemDanh === d && String(a.thanhVienId) === String(m.id));
          if (!rec || rec.coMat === 'VANG' || rec.coMat === false) c++;
          else break;
        }
        if (c >= 2) absentCount++;
      });
    }
    count += absentCount;

    // 2. Birthdays in month
    const today = new Date();
    const curMonth = today.getMonth() + 1;
    let bdayCount = 0;
    (state.members || []).forEach(m => {
      const dob = m.ngaySinh || m.NgaySinh || '';
      if (!dob) return;
      const parts = dob.split('/');
      if (parts.length >= 2 && parseInt(parts[1], 10) === curMonth) {
        bdayCount++;
      }
    });
    count += bdayCount;

    // 3. Unresolved Care Cases
    const urgentVisits = (state.visits || []).filter(v => (v.trangThai || 'CHUA_XU_LY') === 'CHUA_XU_LY' || (v.mucDoUuTien || '') === 'KHAN_CAP');
    count += urgentVisits.length;

    badge.textContent = count;
    badge.className = count > 0 
      ? 'absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-extrabold flex items-center justify-center border-2 border-slate-900 shadow-md animate-pulse'
      : 'absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-surface-elevated text-text-secondary text-[10px] font-bold flex items-center justify-center border border-white/10';
  }

  function openSendTemplateMessageModal(memberId, templateType = 'birthday') {
    const memberSelect = document.getElementById('msg-tpl-member-select');
    if (memberSelect) {
      memberSelect.innerHTML = `<option value="">-- Chọn ban viên nhận tin --</option>` +
        (state.members || []).map(m => `<option value="${m.id}">${getMemberName(m)} (${getMemberPhone(m)})</option>`).join('');
      if (memberId) memberSelect.value = memberId;
      else if (state.members && state.members.length > 0) memberSelect.value = state.members[0].id;
    }

    const typeSelect = document.getElementById('msg-tpl-type-select');
    if (typeSelect && templateType) {
      typeSelect.value = templateType;
    }

    updateDynamicMessagePreview();
    openModal('modal-send-template-message');
  }

  function updateDynamicMessagePreview() {
    const memberId = document.getElementById('msg-tpl-member-select')?.value;
    const type = document.getElementById('msg-tpl-type-select')?.value || 'birthday';
    const previewArea = document.getElementById('msg-tpl-preview-textarea');
    if (!previewArea) return;

    const m = (state.members || []).find(item => String(item.id) === String(memberId)) || {};
    const hoTen = getMemberName(m) || 'Quý Ban Viên';
    const banTitle = (state.banNganhTitle || 'Thanh Tráng').toUpperCase();

    const groupMap = {};
    state.groups.forEach(g => { groupMap[g.id] = getGroupName(g); });
    const tenTo = groupMap[m.toId] || 'Tổ Sinh Hoạt';

    const schedules = state.schedules || [];
    const nextSession = schedules.length > 0 ? schedules[0] : {};
    const ngayNhom = nextSession.ngayNhom || 'Chúa Nhật tuần này';
    const deTai = nextSession.deTai || 'HỌC LỜI CHÚA';

    let text = '';

    if (type === 'birthday') {
      text = `🎂 KÍNH CHÚC MỪNG SINH NHẬT ${hoTen}! 🎉\n\nThay mặt Ban Điều Hành và toàn thể anh chị em BAN ${banTitle}, kính chúc bạn một tuổi mới tràn đầy phước hạnh, sức khỏe, sự bình an và niềm vui trong tình yêu thương của Chúa Cứu Thế Giê-xu!\n\n📖 "Cầu chúc linh hồn ngươi được thịnh vượng mọi bề, và ngươi được khỏe mạnh cũng như linh hồn ngươi được thạnh vượng vậy." (III Giăng 1:2)\n\nThân mến in Christ, ❤️`;
    } else if (type === 'absence_care') {
      text = `❤️ THÂN GỬI ${hoTen} (${tenTo})!\n\nChúa Nhật vừa qua trong giờ sinh hoạt của Ban ${banTitle}, các anh chị em rất nhớ và thiếu vắng sự hiện diện của bạn. Không biết sức khỏe và công việc của bạn tuần qua thế nào?\n\nBan Điều Hành và Tổ luôn sẵn sàng đồng hành và cầu thay cho bạn. Chiều Chúa Nhật tuần này lúc 16h00, rất mong được gặp lại bạn trong buổi thờ phượng và sinh hoạt nhé! 🙏`;
    } else if (type === 'schedule_duty') {
      text = `📅 THÔNG BÁO LỊCH PHÂN CÔNG CHÚA NHẬT (${ngayNhom})\n\nKính gửi ${hoTen} (${tenTo})!\n\nBan Điều Hành xin gửi thông báo phân công phục vụ cho buổi nhóm chiều Chúa Nhật tới:\n- Đề tài: ${deTai}\n- Giờ sinh hoạt: 16h00\n- Xin bạn vui lòng sắp xếp thời gian đến sớm 15 phút để cùng cầu nguyện chuẩn bị.\n\nKính chúc bạn một tuần mới tràn đầy ơn phước! ✨`;
    } else if (type === 'attendance_cheer') {
      text = `🏆 KHÍCH LỆ TINH THẦN HỌC LỜI CHÚA\n\nThân chào ${hoTen}!\n\nBan ${banTitle} trân trọng chúc mừng và khen ngợi sự trung tín của bạn trong việc đi nhóm thờ phượng và học Lời Chúa trong thời gian qua!\n\n📖 "Hãy tập tành sự tin kính; vì sự tập tành thân thể ích lợi ít bề, còn sự tin kính ích cho mọi sự..." (I Ti-mô-thê 4:7-8)\n\nCầu xin Chúa thêm sức cho bạn luôn giữ vững ngọn lửa đức tin! 🔥`;
    }

    previewArea.value = text;
  }

  function copyDynamicMessageText() {
    const previewArea = document.getElementById('msg-tpl-preview-textarea');
    if (!previewArea) return;
    navigator.clipboard.writeText(previewArea.value).then(() => {
      showToast('Đã sao chép nội dung tin nhắn vào bộ nhớ tạm!', 'success');
    });
  }

  function sendDynamicMessageZalo() {
    const memberId = document.getElementById('msg-tpl-member-select')?.value;
    const m = (state.members || []).find(item => String(item.id) === String(memberId));
    const phone = m ? cleanPhoneNumber(getMemberPhone(m)) : '';
    const text = document.getElementById('msg-tpl-preview-textarea')?.value || '';

    // Copy text first
    navigator.clipboard.writeText(text);

    if (phone) {
      window.open(`https://zalo.me/${phone}`, '_blank');
      showToast(`Đã sao chép nội dung và đang mở Zalo của ${getMemberName(m)}...`, 'success');
    } else {
      showToast('Ban viên này chưa có SĐT. Đã sao chép nội dung tin nhắn vào clipboard!', 'info');
    }
  }

  function renderSettings() {
    const input = document.getElementById('cfg-bannganh-sheet-id');
    const status = document.getElementById('cfg-bannganh-sheet-status');
    const link = document.getElementById('cfg-bannganh-sheet-link');

    if (input && state.activeSheetId) input.value = state.activeSheetId;
    if (status) status.textContent = state.spreadsheet.name ? `Đã kết nối: ${state.spreadsheet.name}` : (state.activeSheetId ? 'Đã gán ID' : 'Chưa kết nối');
    if (link && state.spreadsheet.url) link.href = state.spreadsheet.url;
  }

  async function handleSaveSheetConnection() {
    const raw = document.getElementById('cfg-bannganh-sheet-id').value.trim();
    if (!raw) return;

    state.activeSheetId = raw;
    showLoading(true);
    await refreshData(true);
    showLoading(false);
  }

  async function handleSyncDatabaseSchema() {
    showLoading(true);
    try {
      const res = await runGAS('apiSyncDatabaseSchema', state.activeSheetId);
      if (res && res.success) {
        showToast(res.message || 'Đã đồng bộ và chuẩn hóa cấu trúc Google Sheet thành công!', 'success');
        await refreshData(true);
      } else {
        showToast(res.message || 'Lỗi chuẩn hóa Sheet', 'error');
      }
    } catch (e) {
      showToast(e.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  // =========================================================================
  // MODALS & TOASTS
  // =========================================================================

  function openModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.remove('hidden');
      el.classList.add('flex');
      document.body.style.overflow = 'hidden';
      state.activeModal = modalId;
    }
  }

  function closeModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.add('hidden');
      el.classList.remove('flex');
      document.body.style.overflow = '';
      if (state.activeModal === modalId) state.activeModal = null;
    }
  }

  function closeAllModals() {
    document.querySelectorAll('.app-modal').forEach(m => {
      m.classList.add('hidden');
      m.classList.remove('flex');
    });
    document.body.style.overflow = '';
    state.activeModal = null;
  }

  function showLoading(show) {
    const loader = document.getElementById('global-loading-indicator');
    if (loader) {
      if (show) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  }

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const bgColors = {
      success: 'bg-emerald-600/90 border-emerald-400/50 text-white',
      error: 'bg-rose-600/90 border-rose-400/50 text-white',
      info: 'bg-surface-elevated/90 border-emerald-500/40 text-on-surface',
      warning: 'bg-amber-600/90 border-amber-400/50 text-white'
    };
    const icons = {
      success: 'check_circle',
      error: 'error',
      info: 'info',
      warning: 'warning'
    };

    toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl transition-all duration-300 transform translate-y-4 opacity-0 ${bgColors[type] || bgColors.info}`;
    toast.innerHTML = `
      <span class="material-symbols-outlined text-[20px]">${icons[type] || 'info'}</span>
      <span class="font-medium text-sm">${message}</span>
    `;

    container.appendChild(toast);

    setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-x-full');
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAllModals();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
</script>
