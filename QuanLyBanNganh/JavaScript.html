<script>
  // =========================================================================
  // GLOBAL STATE & INSTANT LOCAL CACHE ENGINE
  // =========================================================================
  var state = {
    activeSheetId: '',
    banNganhTitle: '',
    banNganhId: '',
    kpis: { total_members: 0, active_members: 0, group_count: 0, total_balance: 0, total_attendance_records: 0, total_visits: 0 },
    theme: { chuDe: 'KỶ LUẬT THUỘC LINH', cauGoc: 'I Ti-mô-thê 4:7-8', noiDungCauGoc: 'Hãy tập tành sự tin kính...' },
    members: [],
    groups: [],
    funds: [],
    transactions: [],
    attendances: [],
    visits: [],
    schedules: [],
    themes: [],
    templates: [],
    spreadsheet: { id: '', name: 'Google Sheet Ban Ngành', url: '' },
    currentView: 'dashboard',
    searchMember: '',
    filterMemberGroup: 'all',
    sortMemberMode: 'name_asc',
    filterMemberGender: 'all',
    memberViewMode: 'cards',
    selectedMemberIds: new Set(),
    searchFinance: '',
    activeModal: null,

    // Smart Attendance state
    liveAttendance: {},
    attendanceFilterGroup: 'all',

    // Schedule state
    selectedScheduleQuarter: 'all',
    selectedScheduleYear: new Date().getFullYear(),
    searchSchedule: ''
  };

  const CACHE_PREFIX = 'qlnb_cache_';

  // Safe Accessor Helpers (Chuẩn hóa thuật ngữ Tin Lành)
  function getMemberName(m) {
    if (!m) return 'Ban viên';
    return m.hoTen || m.HoTen || m.hoten || m.fullName || m.fullname || m.name || m['Họ và tên'] || m['Họ Tên'] || m['Họ và Tên'] || m['Họ tên'] || 'Chưa đặt tên';
  }

  function getMemberPhone(m) {
    if (!m) return '';
    return String(m.sdt || m.SDT || m.dienthoai || m.phone || m.phoneNumber || m['Số điện thoại'] || m['SĐT'] || '').trim();
  }

  function cleanPhoneNumber(p) {
    if (!p) return '';
    let num = p.replace(/[^0-9]/g, '');
    if (num.startsWith('84')) num = '0' + num.substring(2);
    return num;
  }

  function getMemberCode(m) {
    if (!m) return 'BV';
    return m.maTV || m.MaTV || m.matv || m.code || m['Mã TV'] || m['Mã BV'] || 'BV';
  }

  function getMemberRole(m) {
    if (!m) return 'Ban viên';
    return m.chucVu || m.ChucVu || m.role || m['Chức vụ'] || 'Ban viên';
  }

  function getMemberAddress(m) {
    if (!m) return '';
    return m.diaChi || m.DiaChi || m.address || m['Địa chỉ'] || '';
  }

  function getGroupName(g) {
    if (!g) return 'Tổ nhóm';
    return g.tenTo || g.TenTo || g.tento || g.name || g['Tên tổ'] || g['Tổ'] || 'Tổ nhóm';
  }

  // =========================================================================
  // HIGH-PERFORMANCE IN-MEMORY STATE HELPERS
  // =========================================================================
  function upsertById(collection, record) {
    if (!collection || !record) return;
    const recId = String(record.id || record.ID || '');
    const index = collection.findIndex(item => String(item.id || item.ID || '') === recId);
    if (index === -1) {
      collection.unshift(record);
    } else {
      collection[index] = { ...collection[index], ...record };
    }
  }

  function removeById(collection, id) {
    if (!collection || id === undefined || id === null) return;
    const targetId = String(id);
    const index = collection.findIndex(item => String(item.id || item.ID || '') === targetId);
    if (index !== -1) {
      collection.splice(index, 1);
    }
  }

  // =========================================================================
  // GAS RUNNER WITH FALLBACK
  // =========================================================================
  function runGAS(functionName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        console.warn('Google Script Environment Unavailable. Mocking result.');
        resolve({ success: false, message: 'Google Script Environment Unavailable' });
        return;
      }

      var runner = google.script.run
        .withSuccessHandler(function(res) {
          resolve(res);
        })
        .withFailureHandler(function(err) {
          console.error('GAS Error [' + functionName + ']:', err);
          showToast('Lỗi máy chủ: ' + (err.message || err), 'error');
          resolve({ success: false, message: err.message || String(err) });
        });

      if (runner && typeof runner[functionName] === 'function') {
        runner[functionName].apply(runner, args);
      } else {
        console.error('GAS Runner: Hàm ' + functionName + ' không tồn tại trên server.');
        resolve({ success: false, message: 'Hàm ' + functionName + ' chưa được định nghĩa trên server' });
      }
    });
  }

  // =========================================================================
  // INITIALIZATION & STALE-WHILE-REVALIDATE CACHE
  // =========================================================================

  async function initApp() {
    try {
      const serverCfg = window.SERVER_CONFIG || {};
      let urlParams = null;
      try {
        urlParams = new URLSearchParams(window.location.search);
      } catch (e) {}

      state.activeSheetId = serverCfg.sheetId || (urlParams ? urlParams.get('sheetId') : '') || '';
      state.banNganhTitle = serverCfg.banNganhTitle || (urlParams ? urlParams.get('title') : '') || '';
      state.banNganhId = serverCfg.banNganhId || (urlParams ? urlParams.get('banNganhId') : '') || '';

      if (state.banNganhTitle) {
        document.title = 'Quản Lý ' + state.banNganhTitle;
        const brandH1 = document.getElementById('brand-title');
        const schBanner = document.getElementById('sch-banner-title');
        if (brandH1) brandH1.textContent = 'Quản Lý ' + state.banNganhTitle;
        if (schBanner) schBanner.textContent = 'CHƯƠNG TRÌNH THỜ PHƯỢNG CHÚA & SINH HOẠT ' + state.banNganhTitle.toUpperCase();
      }

      // Default attendance date: current Sunday
      const attDateInput = document.getElementById('attendance-date');
      if (attDateInput && !attDateInput.value) {
        attDateInput.value = new Date().toISOString().split('T')[0];
      }
    } catch (e) {}

    // 1. TẢI TỪ LOCAL CACHE (NẾU CÓ DỮ LIỆU CỦA ĐÚNG SHEET ID NÀY)
    loadFromLocalCache();

    // 2. TẢI NGẦM DỮ LIỆU MỚI NHẤT TỪ GOOGLE SHEET
    await refreshData(false);
  }

  function getCacheKey() {
    return CACHE_PREFIX + (state.activeSheetId || 'default');
  }

  function loadFromLocalCache() {
    try {
      const key = getCacheKey();
      const raw = localStorage.getItem(key);
      if (raw) {
        const cached = JSON.parse(raw);
        if (cached && cached.data) {
          applyData(cached.data);
          renderAll();
        }
      }
    } catch (e) {
      console.warn('Cache load error:', e);
    }
  }

  function saveToLocalCache(data) {
    try {
      const key = getCacheKey();
      localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), data: data }));
    } catch (e) {}
  }

  function clearLocalCache() {
    try {
      const key = getCacheKey();
      localStorage.removeItem(key);
      showToast('Đã xóa bộ nhớ đệm cache!', 'success');
      refreshData(true);
    } catch (e) {}
  }

  function applyData(data) {
    state.kpis = data.kpis || state.kpis;
    state.theme = data.theme || state.theme;
    state.members = data.members || [];
    state.groups = data.groups || [];
    state.funds = data.funds || [];
    state.transactions = data.transactions || [];
    state.attendances = data.attendances || [];
    state.visits = data.visits || [];
    state.schedules = data.schedules || [];
    state.themes = data.themes || [];
    state.templates = data.templates || [];
    state.spreadsheet = data.spreadsheet || state.spreadsheet;

    // Reset Live Attendance State
    initLiveAttendanceState();
  }

  async function refreshData(showLoader) {
    const refreshIcon = document.getElementById('btn-refresh-icon');
    if (refreshIcon) refreshIcon.classList.add('animate-spin');
    if (showLoader) showLoading(true);

    try {
      const res = await runGAS('apiGetInitialData', state.activeSheetId);
      if (res && res.success && res.data) {
        applyData(res.data);
        saveToLocalCache(res.data);
        renderCurrentView();
        if (showLoader) showToast('Đồng bộ dữ liệu thành công!', 'success');
      } else {
        if (!state.members.length) {
          showToast('Chưa kết nối dữ liệu: ' + (res.message || 'Vui lòng kiểm tra cài đặt Sheet'), 'warning');
        }
      }
    } catch (e) {
      console.error('refreshData Error:', e);
      if (showLoader) showToast('Lỗi nạp dữ liệu: ' + e.message, 'error');
    } finally {
      if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      if (showLoader) showLoading(false);
    }
  }

  function navigateTo(viewName) {
    state.currentView = viewName;
    document.querySelectorAll('.app-view').forEach(el => el.classList.add('hidden'));

    const target = document.getElementById('view-' + viewName);
    if (target) {
      target.classList.remove('hidden');
      target.classList.add('animate-fade-in');
    }

    document.querySelectorAll('.nav-link-btn').forEach(btn => {
      if (btn.getAttribute('data-page') === viewName) {
        btn.className = 'nav-link-btn px-3.5 py-1.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 transition-all';
      } else {
        btn.className = 'nav-link-btn px-3.5 py-1.5 rounded-full text-xs font-semibold text-text-secondary hover:text-white hover:bg-white/5 transition-all border border-transparent';
      }
    });

    document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
      const isCurrent = btn.getAttribute('data-page') === viewName;
      btn.className = isCurrent 
        ? 'bottom-nav-btn flex flex-col items-center justify-center text-emerald-400 drop-shadow-[0_0_8px_rgba(78,222,163,0.5)] active:scale-90 transition-transform'
        : 'bottom-nav-btn flex flex-col items-center justify-center text-text-secondary hover:text-white active:scale-90 transition-transform';
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderCurrentView();
  }

  function renderCurrentView() {
    switch (state.currentView) {
      case 'dashboard':
        renderDashboard();
        renderBirthdays();
        renderAbsenceWarnings();
        break;
      case 'members':
        renderMembers();
        break;
      case 'groups':
        renderGroups();
        break;
      case 'attendance':
        renderAttendance();
        break;
      case 'finance':
        renderFinance();
        break;
      case 'schedule':
        renderSchedule();
        break;
      case 'visitations':
        renderVisitations();
        break;
      case 'settings':
        renderSettings();
        break;
      default:
        renderDashboard();
        break;
    }
  }

  function renderAll() {
    renderDashboard();
    renderBirthdays();
    renderAbsenceWarnings();
    renderMembers();
    renderGroups();
    renderAttendance();
    renderFinance();
    renderSchedule();
    renderVisitations();
    renderSettings();
  }

  // =========================================================================
  // 1. DASHBOARD & SMART WIDGETS
  // =========================================================================

  function renderDashboard() {
    document.getElementById('dash-kpi-members').textContent = state.kpis.total_members;
    document.getElementById('dash-kpi-groups').textContent = state.kpis.group_count;
    document.getElementById('dash-kpi-balance').textContent = Number(state.kpis.total_balance || 0).toLocaleString('vi-VN') + ' đ';
    document.getElementById('dash-kpi-attendance').textContent = state.kpis.total_attendance_records;

    if (state.theme) {
      document.getElementById('dash-theme-title').textContent = state.theme.chuDe || 'KỶ LUẬT THUỘC LINH';
      document.getElementById('dash-theme-verse').textContent = state.theme.cauGoc || 'I Ti-mô-thê 4:7-8';
      document.getElementById('dash-theme-content').textContent = state.theme.noiDungCauGoc || 'Hãy tập tành sự tin kính...';
    }

    if (state.spreadsheet && state.spreadsheet.name) {
      document.getElementById('dash-sheet-name').textContent = state.spreadsheet.name;
      document.getElementById('dash-sheet-link').href = state.spreadsheet.url || ('https://docs.google.com/spreadsheets/d/' + state.activeSheetId + '/edit');
    }

    // Recent Members
    const rMembersEl = document.getElementById('dash-recent-members');
    if (state.members.length > 0) {
      rMembersEl.innerHTML = state.members.slice(0, 5).map(m => {
        const name = getMemberName(m);
        const phone = getMemberPhone(m);
        const role = getMemberRole(m);
        const code = getMemberCode(m);

        return `
          <div class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center font-bold text-xs">
                <span class="material-symbols-outlined text-base">person</span>
              </div>
              <div>
                <h4 class="text-xs font-bold text-white">${name}</h4>
                <p class="text-[11px] text-text-secondary">${role} &bull; ${phone || 'Chưa có SĐT'}</p>
              </div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-400">
              ${code}
            </span>
          </div>
        `;
      }).join('');
    } else {
      rMembersEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có ban viên nào</div>`;
    }

    // Recent Transactions
    const rFinanceEl = document.getElementById('dash-recent-finance');
    if (state.transactions.length > 0) {
      rFinanceEl.innerHTML = state.transactions.slice(0, 5).map(t => {
        const hm = t.hangMuc || t.HangMuc || t.noidung || 'Giao dịch';
        const st = Number(t.soTien || t.SoTien || 0);
        const loai = t.loaiGD || t.LoaiGD || 'THU';
        const ngay = t.ngayGD || t.NgayGD || '';
        const nguoi = t.nguoiNopNhan || t.NguoiNopNhan || '';

        return `
          <div class="p-3 rounded-2xl bg-surface-elevated/70 border border-white/5 flex items-center justify-between">
            <div>
              <h4 class="text-xs font-bold text-white">${hm}</h4>
              <p class="text-[11px] text-text-secondary">${ngay} &bull; ${nguoi}</p>
            </div>
            <span class="text-xs font-bold ${loai === 'THU' ? 'text-emerald-400' : 'text-rose-400'}">
              ${loai === 'THU' ? '+' : '-'}${st.toLocaleString('vi-VN')} đ
            </span>
          </div>
        `;
      }).join('');
    } else {
      rFinanceEl.innerHTML = `<div class="text-center py-6 text-xs text-text-secondary">Chưa có giao dịch nào</div>`;
    }
  }

  // WIDGET: SINH NHẬT THÁNG NÀY
  function renderBirthdays() {
    const container = document.getElementById('dash-birthday-container');
    const badge = document.getElementById('dash-birthday-badge');
    if (!container) return;

    const currentMonth = new Date().getMonth() + 1;
    const birthdayList = [];

    (state.members || []).forEach(m => {
      const dobStr = m.ngaySinh || m.NgaySinh || '';
      if (!dobStr) return;

      let bMonth = null;
      let bDay = null;

      if (dobStr.includes('/')) {
        const parts = dobStr.split('/');
        bDay = parseInt(parts[0], 10);
        bMonth = parseInt(parts[1], 10);
      } else if (dobStr.includes('-')) {
        const parts = dobStr.split('-');
        bMonth = parseInt(parts[1], 10);
        bDay = parseInt(parts[2], 10);
      }

      if (bMonth === currentMonth) {
        birthdayList.push({ member: m, day: bDay, raw: dobStr });
      }
    });

    birthdayList.sort((a, b) => (a.day || 0) - (b.day || 0));

    if (badge) badge.textContent = `${birthdayList.length} người trong tháng ${currentMonth}`;

    if (birthdayList.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 text-center py-6 text-xs text-text-secondary">
          <span class="material-symbols-outlined text-2xl text-pink-400/50 block mb-1">cake</span>
          Không có ban viên nào sinh nhật trong tháng ${currentMonth}.
        </div>
      `;
      return;
    }

    container.innerHTML = birthdayList.map(item => {
      const m = item.member;
      const name = getMemberName(m);
      const phone = getMemberPhone(m);
      const cleanPhone = cleanPhoneNumber(phone);
      const role = getMemberRole(m);

      return `
        <div class="p-3 rounded-2xl bg-surface-elevated/80 border border-pink-500/20 flex items-center justify-between gap-2 shadow-sm">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-pink-500/20 text-pink-300 font-bold flex flex-col items-center justify-center shrink-0 border border-pink-500/30">
              <span class="text-[9px] uppercase font-semibold leading-none">Ngày</span>
              <span class="text-sm font-extrabold leading-none mt-0.5">${item.day || '--'}</span>
            </div>
            <div class="min-w-0">
              <h4 class="text-xs font-bold text-white truncate">${name}</h4>
              <p class="text-[10px] text-text-secondary truncate">${role} &bull; ${item.raw}</p>
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            ${cleanPhone ? `
              <a href="https://zalo.me/${cleanPhone}" target="_blank" class="px-2.5 py-1.5 rounded-xl bg-sky-600/30 hover:bg-sky-600/50 text-sky-300 text-[11px] font-bold flex items-center gap-1 transition-all" title="Gửi lời chúc mừng qua Zalo">
                <span class="material-symbols-outlined text-sm">cake</span>
                <span>Chúc Zalo</span>
              </a>
            ` : `
              <span class="text-[10px] text-text-secondary italic">Chưa có SĐT</span>
            `}
          </div>
        </div>
      `;
    }).join('');
  }

  // WIDGET: CẢNH BÁO VẮNG NHÓM & CẦN THĂM VIẾNG
  function renderAbsenceWarnings() {
    const container = document.getElementById('dash-absence-container');
    const badge = document.getElementById('dash-absence-badge');
    if (!container) return;

    const allAtt = state.attendances || [];
    const dateMap = {};
    allAtt.forEach(a => {
      if (a.ngayDiemDanh) dateMap[a.ngayDiemDanh] = true;
    });
    const sortedDates = Object.keys(dateMap).sort().reverse();
    const recentDates = sortedDates.slice(0, 3);

    const absenceList = [];

    if (recentDates.length >= 2) {
      (state.members || []).forEach(m => {
        if ((m.trangThai || 'active') !== 'active') return;
        let consecutiveAbsences = 0;

        for (let d of recentDates) {
          const rec = allAtt.find(a => a.ngayDiemDanh === d && String(a.thanhVienId) === String(m.id));
          if (!rec || rec.coMat === 'VANG' || rec.coMat === false || rec.coMat === 'false') {
            consecutiveAbsences++;
          } else {
            break;
          }
        }

        if (consecutiveAbsences >= 2) {
          absenceList.push({ member: m, absences: consecutiveAbsences });
        }
      });
    }

    if (badge) badge.textContent = `${absenceList.length} người cần chăm sóc`;

    if (absenceList.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 text-center py-6 text-xs text-text-secondary">
          <span class="material-symbols-outlined text-2xl text-emerald-400/50 block mb-1">verified</span>
          Tất cả ban viên đều duy trì sinh hoạt đều đặn!
        </div>
      `;
      return;
    }

    container.innerHTML = absenceList.map(item => {
      const m = item.member;
      const name = getMemberName(m);
      const phone = getMemberPhone(m);
      const cleanPhone = cleanPhoneNumber(phone);

      return `
        <div class="p-3 rounded-2xl bg-surface-elevated/80 border border-amber-500/25 flex items-center justify-between gap-2 shadow-sm">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-warning-amber font-bold flex flex-col items-center justify-center shrink-0 border border-amber-500/30">
              <span class="material-symbols-outlined text-base">person_alert</span>
              <span class="text-[9px] font-bold leading-none mt-0.5">Vắng ${item.absences}T</span>
            </div>
            <div class="min-w-0">
              <h4 class="text-xs font-bold text-white truncate">${name}</h4>
              <p class="text-[10px] text-warning-amber font-semibold">Vắng ${item.absences} tuần liên tiếp</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            ${cleanPhone ? `
              <a href="tel:${cleanPhone}" class="p-1.5 rounded-lg bg-white/5 hover:bg-emerald-500/20 text-emerald-400 transition-colors" title="Gọi điện">
                <span class="material-symbols-outlined text-base">call</span>
              </a>
              <a href="https://zalo.me/${cleanPhone}" target="_blank" class="p-1.5 rounded-lg bg-white/5 hover:bg-sky-500/20 text-sky-400 transition-colors" title="Zalo">
                <span class="material-symbols-outlined text-base">chat</span>
              </a>
            ` : ''}
            <button onclick="openQuickVisitModal('${m.id}', ${item.absences})" class="px-2.5 py-1.5 rounded-xl bg-amber-600/30 hover:bg-amber-600/50 text-amber-300 text-[11px] font-bold flex items-center gap-1 transition-all" title="Lập phiếu thăm viếng">
              <span class="material-symbols-outlined text-sm">volunteer_activism</span>
              <span>Thăm</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  // =========================================================================
  // 2. MEMBERS VIEW (BAN VIÊN) & QUICK ACTIONS
  // =========================================================================

  function extractVietnameseFirstName(fullName) {
    if (!fullName) return '';
    const parts = fullName.trim().split(/\s+/);
    return parts[parts.length - 1] || fullName;
  }

  function parseDateForSort(dateStr) {
    if (!dateStr) return 0;
    const parts = String(dateStr).trim().split(/[\/\-\.]/);
    if (parts.length === 3) {
      const d = parseInt(parts[0], 10) || 1;
      const m = parseInt(parts[1], 10) || 1;
      let y = parseInt(parts[2], 10) || 1900;
      if (y < 100) y += 1900;
      return new Date(y, m - 1, d).getTime();
    }
    return 0;
  }

  function getFilteredMembers() {
    let list = state.members || [];

    // 1. Filter by Group
    if (state.filterMemberGroup === 'unassigned') {
      list = list.filter(m => !m.toId || m.toId === '' || m.toId === 'null');
    } else if (state.filterMemberGroup === 'assigned') {
      list = list.filter(m => m.toId && m.toId !== '' && m.toId !== 'null');
    } else if (state.filterMemberGroup && state.filterMemberGroup !== 'all') {
      list = list.filter(m => String(m.toId) === String(state.filterMemberGroup));
    }

    // 2. Filter by Gender
    if (state.filterMemberGender && state.filterMemberGender !== 'all') {
      list = list.filter(m => String(m.gioiTinh || 'Nam').toLowerCase() === state.filterMemberGender.toLowerCase());
    }

    // 3. Search query
    if (state.searchMember) {
      const q = state.searchMember.toLowerCase().trim();
      list = list.filter(m => 
        getMemberName(m).toLowerCase().includes(q) ||
        getMemberCode(m).toLowerCase().includes(q) ||
        getMemberPhone(m).toLowerCase().includes(q) ||
        getMemberRole(m).toLowerCase().includes(q) ||
        getMemberAddress(m).toLowerCase().includes(q)
      );
    }

    // 4. Sort Algorithm (Chuẩn tiếng Việt với Intl.Collator)
    const collator = new Intl.Collator('vi', { sensitivity: 'base', numeric: true });
    const sortMode = state.sortMemberMode || 'name_asc';

    list = [...list].sort((a, b) => {
      const nameA = getMemberName(a);
      const nameB = getMemberName(b);
      const firstNameA = extractVietnameseFirstName(nameA);
      const firstNameB = extractVietnameseFirstName(nameB);

      switch (sortMode) {
        case 'name_asc': {
          const cmp = collator.compare(firstNameA, firstNameB);
          return cmp !== 0 ? cmp : collator.compare(nameA, nameB);
        }
        case 'name_desc': {
          const cmp = collator.compare(firstNameB, firstNameA);
          return cmp !== 0 ? cmp : collator.compare(nameB, nameA);
        }
        case 'fullname_asc':
          return collator.compare(nameA, nameB);
        case 'code_asc':
          return collator.compare(getMemberCode(a), getMemberCode(b));
        case 'dob_desc':
          return parseDateForSort(b.ngaySinh || b.NgaySinh) - parseDateForSort(a.ngaySinh || a.NgaySinh);
        case 'dob_asc':
          return parseDateForSort(a.ngaySinh || a.NgaySinh) - parseDateForSort(b.ngaySinh || b.NgaySinh);
        case 'group': {
          const gA = a.toId || 'ZZZ';
          const gB = b.toId || 'ZZZ';
          const gCmp = collator.compare(gA, gB);
          return gCmp !== 0 ? gCmp : collator.compare(firstNameA, firstNameB);
        }
        default:
          return 0;
      }
    });

    return list;
  }

  function updateBatchActionBar() {

    const groupSelect = document.getElementById('batch-target-group');

  async function handleBatchAssignGroup() {
    const toId = (document.getElementById('batch-target-group') || {}).value || '';
    if (!toId) {
      showToast('Vui lòng chọn Tổ nhóm muốn gán vào', 'warning');
      return;
    }

    const memberIds = Array.from(state.selectedMemberIds || []);
    if (memberIds.length === 0) {
      showToast('Chưa chọn ban viên nào', 'warning');
      return;
    }

    const targetGroup = (state.groups || []).find(g => String(g.id) === String(toId));
    const groupName = targetGroup ? (targetGroup.tenTo || targetGroup.name) : 'Tổ đã chọn';

    if (!confirm(`Bạn có chắc muốn gán ${memberIds.length} ban viên đã chọn vào "${groupName}"?`)) return;

    showLoading(true);
    try {
      const res = await runGAS('apiBatchAssignGroup', memberIds, toId, state.activeSheetId);
      if (res && res.success) {
        showToast(res.message || `Đã gán ${memberIds.length} ban viên vào ${groupName}!`, 'success');
        const idSet = new Set(memberIds.map(String));
        (state.members || []).forEach(m => {
          if (idSet.has(String(m.id))) {
            m.toId = toId;
          }
        });
        clearSelectedMembers();
        renderMembers();
        renderGroups();
        renderDashboard();
      } else {
        showToast(res.message || 'Lỗi khi gán tổ nhóm', 'error');
      }
    } catch (e) {
      showToast(e.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function handleSaveMember(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('member-id').value || null,
      hoTen: document.getElementById('member-hoten').value.trim(),
      maTV: document.getElementById('member-matv').value.trim(),
      sdt: document.getElementById('member-sdt').value.trim(),
      ngaySinh: document.getElementById('member-ngaysinh').value.trim(),
      gioiTinh: document.getElementById('member-gioitinh').value,
      toId: document.getElementById('member-modal-group').value,
      chucVu: document.getElementById('member-chucvu').value,
      diaChi: document.getElementById('member-diachi').value.trim(),
      trangThai: document.getElementById('member-trangthai').value,
      ghiChu: document.getElementById('member-ghichu').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiSaveMember', payload, state.activeSheetId);
      if (res && res.success) {
        showToast(res.message || 'Lưu ban viên thành công!', 'success');
        closeModal('modal-member');
        const saved = (res.data && res.data.id) ? res.data : { ...payload, id: (res.data && res.data.id) || payload.id || ('id_' + Date.now()) };

  function parseBulkMembersText(rawText) {
    if (!rawText) return [];
    const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    const parsed = [];
    const defaultGroupId = (document.getElementById('bulk-default-group') || {}).value || '';

    lines.forEach((line, idx) => {
      // Bỏ qua dòng tiêu đề nếu người dùng copy cả header từ Excel
      const low = line.toLowerCase();
      if (low.includes('họ và tên') || low.includes('ho va ten') || low.includes('full name') || low.includes('fullname')) return;

      let parts = line.split('\t');
      if (parts.length === 1) parts = line.split(',');
      if (parts.length === 1) parts = line.split(';');

      let stt = '', hoTen = '', ngaySinh = '', diaChi = '', sdt = '', toName = '', toId = defaultGroupId;

      if (parts.length >= 6) {
        stt = parts[0].trim();
        hoTen = parts[1].trim();
        ngaySinh = parts[2].trim();
        diaChi = parts[3].trim();
        sdt = cleanPhoneNumber(parts[4].trim());
        toName = parts[5].trim();
      } else if (parts.length === 5) {
        stt = parts[0].trim();
        hoTen = parts[1].trim();
        ngaySinh = parts[2].trim();
        diaChi = parts[3].trim();
        sdt = cleanPhoneNumber(parts[4].trim());
      } else if (parts.length === 4) {
        hoTen = parts[0].trim();
        ngaySinh = parts[1].trim();
        diaChi = parts[2].trim();
        sdt = cleanPhoneNumber(parts[3].trim());
      } else if (parts.length >= 2) {
        hoTen = parts[0].trim();
        sdt = cleanPhoneNumber(parts[1].trim());
      } else {
        hoTen = line.trim();
      }

      if (!hoTen) return;

      // Tìm tên tổ nếu có toId
      if (!toName && toId) {
        const found = (state.groups || []).find(g => g.id === toId);
        if (found) toName = found.tenTo || found.name;
      }

      parsed.push({
        stt: stt || String(idx + 1),
        hoTen: hoTen,
        ngaySinh: ngaySinh,
        diaChi: diaChi,
        sdt: sdt,
        to: toName || '',
        toId: toId
      });
    });

    return parsed;
  }

  function setAllAttendance(coMatVal, thuocCauGocVal) {
    let list = getFilteredAttendanceMembers();
    list.forEach(m => {
      if (!state.liveAttendance[m.id]) {
        state.liveAttendance[m.id] = { coMat: false, thuocCauGoc: false, ghiChu: '' };
      }
      if (coMatVal !== null && coMatVal !== undefined) {
        state.liveAttendance[m.id].coMat = coMatVal;
      }
      if (thuocCauGocVal !== null && thuocCauGocVal !== undefined) {

  function handleToggleLiveAttendance(memberId, field, val) {
    if (!state.liveAttendance[memberId]) {
      state.liveAttendance[memberId] = { coMat: false, thuocCauGoc: false, ghiChu: '' };
    }
    state.liveAttendance[memberId][field] = val;

    // Tính toán lại thanh thống kê KPI ngay lập tức mà không vẽ lại toàn bộ DOM
    const list = getFilteredAttendanceMembers();
    let presentCount = 0;
    let verseCount = 0;
    list.forEach(m => {
      const att = state.liveAttendance[m.id] || { coMat: false, thuocCauGoc: false };
      if (att.coMat) presentCount++;
      if (att.thuocCauGoc) verseCount++;
    });
    updateAttendanceStats(presentCount, verseCount, list.length);
  }

  function handleLiveAttendanceNote(memberId, val) {
    if (!state.liveAttendance[memberId]) {
      state.liveAttendance[memberId] = { coMat: false, thuocCauGoc: false, ghiChu: '' };
    }
    state.liveAttendance[memberId].ghiChu = val;
  }

  function updateAttendanceStats(present, verse, total) {
    const pPct = total > 0 ? Math.round((present / total) * 100) : 0;
    const vPct = total > 0 ? Math.round((verse / total) * 100) : 0;

    const elPText = document.getElementById('att-live-present');
    const elPBar = document.getElementById('att-bar-present');
    const elVText = document.getElementById('att-live-verse');
    const elVBar = document.getElementById('att-bar-verse');

    if (elPText) elPText.textContent = `${present} / ${total} (${pPct}%)`;
    if (elPBar) elPBar.style.width = `${pPct}%`;
    if (elVText) elVText.textContent = `${verse} / ${total} (${vPct}%)`;
    if (elVBar) elVBar.style.width = `${vPct}%`;
  }

  async function handleSaveAttendance() {
    const rawDate = document.getElementById('attendance-date').value;
    if (!rawDate) {
      showToast('Vui lòng chọn ngày điểm danh!', 'warning');
      return;
    }

    const dParts = rawDate.split('-');
    const formattedDate = `${dParts[2]}/${dParts[1]}/${dParts[0]}`;

    const list = getFilteredAttendanceMembers();
    const records = list.map(m => {
      const att = state.liveAttendance[m.id] || { coMat: false, thuocCauGoc: false, ghiChu: '' };
      return {
        thanhVienId: m.id,
        coMat: att.coMat,

        ghiChu: att.ghiChu || ''
      };

    if (records.length === 0) {
      showToast('Không có ban viên nào để lưu điểm danh', 'warning');
      return;
    }

    showLoading(true);
    try {
      const payload = {

        nguoiDiemDanh: 'Thư Ký'

      const res = await runGAS('apiSaveAttendance', payload, state.activeSheetId);

      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

      loaiGD: document.getElementById('tx-loai').value,
      hangMuc: document.getElementById('tx-hangmuc').value.trim(),
      soTien: document.getElementById('tx-sotien').value,
      nguoiNopNhan: document.getElementById('tx-nguoinopnhan').value.trim(),
      ghiChu: document.getElementById('tx-ghichu').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiAddTransaction', payload, state.activeSheetId);
      if (res && res.success) {
        showToast('Lưu phiếu thành công!', 'success');
        closeModal('modal-transaction');
        const saved = (res.data && res.data.id) ? res.data : { ...payload, id: (res.data && res.data.id) || ('id_' + Date.now()), ngayGD: new Date().toLocaleDateString('vi-VN') };
        upsertById(state.transactions, saved);

        let totalBalance = 0;
        state.transactions.forEach(t => {
          const amount = Number(t.soTien) || 0;
          const type = (t.loaiGD || '').toUpperCase();
          if (type === 'THU') totalBalance += amount;
          else if (type === 'CHI') totalBalance -= amount;
        });
        state.kpis.total_balance = totalBalance;
        renderFinance();
        renderDashboard();
      } else {
        showToast(res.message || 'Lỗi lưu giao dịch', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function deleteTransaction(id) {
    if (!confirm('Bạn có chắc muốn xóa giao dịch này?')) return;
    showLoading(true);
    try {
      const res = await runGAS('apiDeleteTransaction', id, state.activeSheetId);

        state.transactions.forEach(t => {

        state.kpis.total_balance = totalBalance;
        renderFinance();
        renderDashboard();
      } else {
        showToast(res.message || 'Không thể xóa', 'error');
      }

    } finally {

      'III': { chuDe: 'BỀN ĐỖ', cauGoc: 'Cô-lô-se 4:2', noiDungCauGoc: 'Phải bền đỗ và tỉnh thức trong sự cầu nguyện, mà thêm sự tạ ơn vào.', baiHatChuDe: 'TẠ ƠN CHÚA' },

      'NAM': { chuDe: 'KỶ LUẬT THUỘC LINH', cauGoc: 'I Ti-mô-thê 4:7-8', noiDungCauGoc: 'Hãy tập tành sự tin kính; vì sự tập tành thân thể ích lợi ít bề...' }

  function copyZaloTemplate(scheduleId) {
    const s = (state.schedules || []).find(item => String(item.id) === String(scheduleId));
    if (!s) {
      showToast('Không tìm thấy thông tin buổi nhóm', 'error');
      return;
    }

    const theme = getThemeForQuarter(s.quy || 'I');
    const banTitle = state.banNganhTitle || 'Thanh Tráng';
    const gioNhom = s.gioNhom || '16h00';
    const ngayNhom = s.ngayNhom || '';
    const baiHat = s.baiHatTonVinh || theme.baiHatChuDe || 'DÂNG CHÚA LỜI NGỢI CA';
    const trangPhuc = s.trangPhuc || 'Nam áo sơ mi + cavat\nNữ áo dài tự do';
    const cauGoc = s.cauGoc || theme.cauGoc || '';
    const noiDungCauGoc = s.noiDungCauGoc || theme.noiDungCauGoc || '';
    const doKtText = s.doKT ? s.doKT : 'Tự do';
    const nguoiDoKtText = s.nguoiDoKT ? `   ${s.nguoiDoKT}` : '';

    const text = `@All   📣THÔNG BÁO 📣
Kính gửi các Anh Chị Em trong ban ${banTitle} chương trình nhóm lại
Chúa Nhật ${ngayNhom}

💒 7h30 : HỌC TRƯỜNG CHÚA NHẬT

💒 8h30 : THỜ PHƯỢNG CHÚA
-Ban ${banTitle} Tôn Vinh Chúa
-Bài hát "${baiHat}"
-Trang phục: 
${trangPhuc}

💒 ${gioNhom}: CHƯƠNG TRÌNH THỜ PHƯỢNG-SINH HOẠT BAN ${banTitle.toUpperCase()}
-Chủ Đề: ${s.deTai || 'SINH HOẠT THỜ PHƯỢNG'}
-Phụ trách: ${s.phuTrach || 'BĐH'}
-Tổ phụ trách: ${s.toPhuTrach || 'BĐH'}
-HCDT: ${s.huongDan || 'Ban Điều Hành'}
-Đố Kinh Thánh:  ${doKtText}${nguoiDoKtText}
-Câu gốc: ${cauGoc}
“${noiDungCauGoc}”

Chúc các Anh/chị/em ngày cuối tuần vui vẻ /-heart`;

    // Copy to clipboard
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Đã sao chép thông báo Zalo ngày ${ngayNhom}! Hãy dán vào Zalo ngay.`, 'success');
      }).catch(err => {
        fallbackCopyText(text, ngayNhom);
      });
    } else {
      fallbackCopyText(text, ngayNhom);
    }
  }

  function fallbackCopyText(text, ngay) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(`Đã sao chép thông báo Zalo ngày ${ngay}!`, 'success');
    } catch (e) {
      showToast('Không thể sao chép tự động, vui lòng thử lại', 'error');
    }
    document.body.removeChild(ta);
  }

        stt: 5,
        chuDe: document.getElementById('theme-year-title').value.trim(),
        cauGoc: document.getElementById('theme-year-verse').value.trim(),
        noiDungCauGoc: document.getElementById('theme-year-content').value.trim()
      },
      {
        id: 'theme_q1',
        quy: 'I',
        stt: 1,
        chuDe: document.getElementById('theme-q1-title').value.trim(),
        cauGoc: document.getElementById('theme-q1-verse').value.trim(),
        noiDungCauGoc: document.getElementById('theme-q1-content').value.trim()
      },
      {
        id: 'theme_q2',
        quy: 'II',
        stt: 2,
        chuDe: document.getElementById('theme-q2-title').value.trim(),
        cauGoc: document.getElementById('theme-q2-verse').value.trim(),
        noiDungCauGoc: document.getElementById('theme-q2-content').value.trim()
      },
      {
        id: 'theme_q3',
        quy: 'III',
        stt: 3,
        chuDe: document.getElementById('theme-q3-title').value.trim(),
        cauGoc: document.getElementById('theme-q3-verse').value.trim(),
        noiDungCauGoc: document.getElementById('theme-q3-content').value.trim()
      },
      {
        id: 'theme_q4',
        quy: 'IV',
        stt: 4,
        chuDe: document.getElementById('theme-q4-title').value.trim(),
        cauGoc: document.getElementById('theme-q4-verse').value.trim(),
        noiDungCauGoc: document.getElementById('theme-q4-content').value.trim()
      }
    ];

    showLoading(true);
    try {
      const res = await runGAS('apiSaveAllThemes', { themes: themesList }, state.activeSheetId);
      if (res && res.success) {
        showToast('Lưu chủ đề năm và 4 quý thành công!', 'success');
        closeModal('modal-themes');
        state.themes = themesList;
        const yearTheme = themesList.find(t => t.quy === 'NAM') || themesList[0];
        if (yearTheme) {
          state.theme = {
            chuDe: yearTheme.chuDe,
            cauGoc: yearTheme.cauGoc,
            noiDungCauGoc: yearTheme.noiDungCauGoc
          };
        }
        renderSchedule();
        renderDashboard();
      } else {
        showToast(res.message || 'Lỗi lưu chủ đề', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function triggerPrintSchedule() {
    window.print();
  }

  // =========================================================================
  // 8. VISITATIONS & SETTINGS
  // =========================================================================

  function renderVisitations() {
    const container = document.getElementById('visitations-list-container');
    const memberSelect = document.getElementById('vis-thanhvien-id');
    if (memberSelect) {
      memberSelect.innerHTML = `<option value="">-- Chọn ban viên --</option>` + 
        (state.members || []).map(m => `<option value="${m.id}">${getMemberName(m)} (${getMemberRole(m)})</option>`).join('');
    }

    if (!container) return;

    const list = state.visits || [];
    if (list.length === 0) {
      container.innerHTML = `<div class="col-span-3 text-center py-12 text-xs text-text-secondary">Chưa có phiếu thăm viếng nào.</div>`;
      return;
    }

    const memberMap = {};
    state.members.forEach(m => { memberMap[m.id] = getMemberName(m); });

    container.innerHTML = list.map(v => {
      const mName = memberMap[v.thanhVienId] || 'Ban viên';
      return `
        <div class="glass-card rounded-3xl p-5 border border-white/10 space-y-3 shadow-lg">
          <div class="flex justify-between items-start gap-2">
            <div>
              <span class="text-[10px] font-bold text-pink-400 block">${v.ngayTham || ''}</span>
              <h3 class="text-sm font-bold text-white">${mName}</h3>
            </div>
            <button onclick="deleteVisitation('${v.id}')" class="p-1.5 text-text-secondary hover:text-rose-400 rounded-full hover:bg-white/5"><span class="material-symbols-outlined text-[16px]">delete</span></button>
          </div>
          <div class="p-3 bg-surface-elevated/70 rounded-2xl border border-white/5 text-xs text-text-secondary">
            <p class="text-white">${v.noiDungCauNguyen || 'Thăm hỏi, khích lệ và cầu nguyện.'}</p>
            ${v.nguoiTham ? `<p class="mt-2 text-[10px] text-text-secondary/70">Người đi thăm: <span class="text-emerald-400 font-medium">${v.nguoiTham}</span></p>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function openAddVisitationModal() {
    document.getElementById('form-visitation').reset();
    document.getElementById('vis-ngaytham').value = new Date().toISOString().split('T')[0];
    openModal('modal-visitation');
  }

  function openQuickVisitModal(memberId, absences) {
    openAddVisitationModal();
    if (memberId) {
      const sel = document.getElementById('vis-thanhvien-id');
      if (sel) sel.value = memberId;
    }
    const noteArea = document.getElementById('vis-noidung');
    if (noteArea && absences) {
      noteArea.value = `Ban viên vắng sinh hoạt ${absences} tuần liên tiếp, cần thăm viếng khích lệ và cầu nguyện.`;
    }
  }

  async function handleSaveVisitation(e) {
    e.preventDefault();
    const payload = {
      thanhVienId: document.getElementById('vis-thanhvien-id').value,
      ngayTham: document.getElementById('vis-ngaytham').value,
      nguoiTham: document.getElementById('vis-nguoitham').value.trim(),
      noiDungCauNguyen: document.getElementById('vis-noidung').value.trim()
    };

    showLoading(true);
    try {
      const res = await runGAS('apiSaveVisitation', payload, state.activeSheetId);
      if (res && res.success) {
        showToast('Đã lưu phiếu thăm viếng!', 'success');
        closeModal('modal-visitation');
        const saved = (res.data && res.data.id) ? res.data : { ...payload, id: (res.data && res.data.id) || payload.id || ('vis_' + Date.now()) };
        upsertById(state.visits, saved);
        state.kpis.total_visits = state.visits.length;
        renderVisitations();
        renderDashboard();
      } else {
        showToast(res.message || 'Lỗi lưu phiếu thăm', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  async function deleteVisitation(id) {
    if (!confirm('Bạn có chắc muốn xóa phiếu thăm viếng này?')) return;
    showLoading(true);
    try {
      const res = await runGAS('apiDeleteVisitation', id, state.activeSheetId);
      if (res && res.success) {
        showToast('Đã xóa phiếu thăm viếng!', 'info');
        removeById(state.visits, id);
        state.kpis.total_visits = state.visits.length;
        renderVisitations();
        renderDashboard();
      } else {
        showToast(res.message || 'Không thể xóa', 'error');
      }
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  function renderSettings() {
    const input = document.getElementById('cfg-bannganh-sheet-id');
    const status = document.getElementById('cfg-bannganh-sheet-status');
    const link = document.getElementById('cfg-bannganh-sheet-link');

    if (input && state.activeSheetId) input.value = state.activeSheetId;
    if (status) status.textContent = state.spreadsheet.name ? `Đã kết nối: ${state.spreadsheet.name}` : (state.activeSheetId ? 'Đã gán ID' : 'Chưa kết nối');
    if (link && state.spreadsheet.url) link.href = state.spreadsheet.url;
  }

  async function handleSaveSheetConnection() {
    const raw = document.getElementById('cfg-bannganh-sheet-id').value.trim();
    if (!raw) return;

    state.activeSheetId = raw;
    showLoading(true);
    await refreshData(true);
    showLoading(false);
  }

  async function handleSyncDatabaseSchema() {
    showLoading(true);
    try {
      const res = await runGAS('apiSyncDatabaseSchema', state.activeSheetId);
      if (res && res.success) {
        showToast(res.message || 'Đã đồng bộ và chuẩn hóa cấu trúc Google Sheet thành công!', 'success');
        await refreshData(true);
      } else {
        showToast(res.message || 'Lỗi chuẩn hóa Sheet', 'error');
      }
    } catch (e) {
      showToast(e.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  // =========================================================================
  // MODALS & TOASTS
  // =========================================================================

  function openModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.remove('hidden');
      el.classList.add('flex');
      document.body.style.overflow = 'hidden';
      state.activeModal = modalId;
    }
  }

  function closeModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) {
      el.classList.add('hidden');
      el.classList.remove('flex');
      document.body.style.overflow = '';
      if (state.activeModal === modalId) state.activeModal = null;
    }
  }

  function closeAllModals() {
    document.querySelectorAll('.app-modal').forEach(m => {
      m.classList.add('hidden');
      m.classList.remove('flex');
    });
    document.body.style.overflow = '';
    state.activeModal = null;
  }

  function showLoading(show) {
    const loader = document.getElementById('global-loading-indicator');
    if (loader) {
      if (show) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  }

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const bgColors = {
      success: 'bg-emerald-600/90 border-emerald-400/50 text-white',
      error: 'bg-rose-600/90 border-rose-400/50 text-white',
      info: 'bg-surface-elevated/90 border-emerald-500/40 text-on-surface',
      warning: 'bg-amber-600/90 border-amber-400/50 text-white'
    };
    const icons = {
      success: 'check_circle',
      error: 'error',
      info: 'info',
      warning: 'warning'
    };

    toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl transition-all duration-300 transform translate-y-4 opacity-0 ${bgColors[type] || bgColors.info}`;
    toast.innerHTML = `
      <span class="material-symbols-outlined text-[20px]">${icons[type] || 'info'}</span>
      <span class="font-medium text-sm">${message}</span>
    `;

    container.appendChild(toast);

    setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-x-full');
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAllModals();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
</script>
