<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang điều hướng...</title>
  <script>
    // GitHub Pages SPA Dynamic Router (Hỗ trợ cấu trúc URL: /<hoi-thanh>/<ban-nganh>)
    (function() {
      const fullPath = window.location.pathname; // e.g. /GGSheet-QLHT/tml/thanh-trang
      const repoName = '/GGSheet-QLHT';
      
      let relativePath = fullPath;
      if (relativePath.startsWith(repoName)) {
        relativePath = relativePath.substring(repoName.length);
      }
      
      // Remove leading and trailing slashes
      const segments = relativePath.split('/').filter(Boolean);
      
      if (segments.length >= 2) {
        // e.g. /tml/thanh-trang -> redirect to ban-nganh.html?ht=tml&bn=thanh-trang
        const churchSlug = encodeURIComponent(segments[0]);
        const ministrySlug = encodeURIComponent(segments[1]);
        const target = repoName + '/ban-nganh.html?ht=' + churchSlug + '&bn=' + ministrySlug;
        window.location.replace(target);
      } else if (segments.length === 1) {
        // e.g. /thanh-trang -> redirect to ban-nganh.html?bn=thanh-trang
        const singleSlug = encodeURIComponent(segments[0].replace(/\.html$/i, ''));
        const target = repoName + '/ban-nganh.html?bn=' + singleSlug;
        window.location.replace(target);
      } else {
        window.location.replace(repoName + '/index.html');
      }
    })();
  </script>
</head>
<body style="background: #0b131b; color: #4edea3; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <div style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">Đang mở Ban Ngành...</div>
    <div style="font-size: 14px; color: #8ba3b8;">Vui lòng chờ trong giây lát</div>
  </div>
</body>
</html>
