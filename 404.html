<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang điều hướng...</title>
  <script>
    (function() {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      let repoPrefix = '';
      let routes = [];

      if (pathSegments.length > 0 && pathSegments[0].toLowerCase() === 'ggsheet-qlht') {
        repoPrefix = '/' + pathSegments[0];
        routes = pathSegments.slice(1);
      } else {
        routes = pathSegments;
      }

      if (routes.length >= 2) {
        // e.g. /ht-thanh-my-loi/thanh-trang or /ht-thu-duc/thanh-nien
        const churchSlug = encodeURIComponent(routes[0]);
        const ministrySlug = encodeURIComponent(routes[1]);
        const target = repoPrefix + '/ban-nganh.html?ht=' + churchSlug + '&bn=' + ministrySlug;
        window.location.replace(target);
      } else if (routes.length === 1) {
        // e.g. /thanh-trang
        const singleSlug = encodeURIComponent(routes[0].replace(/\.html$/i, ''));
        const target = repoPrefix + '/ban-nganh.html?bn=' + singleSlug;
        window.location.replace(target);
      } else {
        window.location.replace((repoPrefix || '') + '/index.html');
      }
    })();
  </script>
</head>
<body style="background: #0b131b; color: #4edea3; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <div style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">Đang mở Ban Ngành...</div>
    <div style="font-size: 14px; color: #8ba3b8;">Vui lòng chờ trong giây lát</div>
  </div>
</body>
</html>
